meta:
  category: XSS
  version: "3.0.0"
  updated: "2025"
rules:
  - id: XSS-B01
    title: "Blade raw output {!! !!} dengan variabel tidak terpercaya"
    description: >
      Direktif output mentah Blade {!! !!} melewati HTML escaping. Konten apapun yang dikendalikan pengguna yang dirender dengan cara ini menciptakan vektor XSS tersimpan atau tercermin yang dieksekusi di browser korban.

    severity: high
    confidence: medium
    category: Reflected/Stored XSS
    tags: [xss, blade, owasp-a03, cwe-79]
    patterns:
      - type: regex
        target: blade-files
        pattern: '\{!!\s*\$'
        exclude_pattern: '(config|asset|Purifier|purify|clean\(|sanitize|strip_tags|e\(|htmlspecialchars)'
    remediation: |
      Gunakan output Blade yang di-escape untuk semua konten pengguna:
        {{ $userContent }}
      Cadangkan {!! !!} hanya untuk HTML statis tepercaya atau konten yang disanitasi:
        {!! Purifier::clean($richText) !!}
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://laravel.com/docs/blade#displaying-data"
  - id: XSS-B02
    title: "Blade raw output dari data request (old/request/Input)"
    description: >
      Direktif {!! !!} merender data langsung dari HTTP request (old(), request(), Input::). Data request selalu dikendalikan penyerang dan tidak boleh pernah dirender tanpa escaping.

    severity: critical
    confidence: high
    category: Reflected XSS
    tags: [xss, blade, owasp-a03, cwe-79]
    patterns:
      - type: regex
        target: blade-files
        pattern: '\{!!\s*(old\(|request\(|Input::|\$_GET|\$_POST|\$_REQUEST)'
    remediation: |
      Gunakan sintaks double-brace yang mengescaping output secara otomatis:
        {{ old('name') }}
        {{ request('query') }}
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-B03
    title: "Blade @php echo — output variabel tanpa escaping"
    description: >
      Blok @php/@endphp menggunakan echo/print untuk output variabel tanpa melewatinya melalui htmlspecialchars() atau e(). Output @php tidak diproses oleh pipeline auto-escaping Blade.

    severity: high
    confidence: medium
    category: Stored/Reflected XSS
    tags: [xss, blade, owasp-a03, cwe-79]
    patterns:
      - type: regex
        target: blade-files
        pattern: '@php\s*(echo|print)\s+\$\w+'
        exclude_pattern: '(htmlspecialchars|e\(|strip_tags|ENT_QUOTES|Purifier)'
      - type: regex
        target: blade-files
        pattern: '@php.*echo\s+\$(_GET|_POST|_REQUEST|request)'
    remediation: |
      Gunakan output Blade yang di-escape daripada echo di dalam @php:
        {{ $variable }}
      Jika @php diperlukan, selalu escape:
        @php echo e($variable); @endphp
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-B04
    title: "Blade @include dengan path view dari input pengguna"
    description: >
      Direktif @include Blade menerima nama view yang berasal dari input pengguna. Penyerang dapat menavigasi ke template admin, mengekspos data konfigurasi, atau memicu eksekusi kode level template.

    severity: critical
    confidence: high
    category: SSTI/XSS
    tags: [xss, ssti, owasp-a03, cwe-94]
    patterns:
      - type: regex
        pattern: '@include\s*\(\s*\$'
        exclude_pattern: '\$errors'
    remediation: |
      Whitelist nama view yang diizinkan — jangan pernah teruskan input pengguna langsung:
        @php
            $allowed = ['header' => 'partials.header', 'footer' => 'partials.footer'];
            $view    = $allowed[$type] ?? 'partials.default';
        @endphp
        @include($view)
    references:
      - "https://cwe.mitre.org/data/definitions/94.html"
  - id: XSS-H01
    title: "Inline event handler dengan data yang dikendalikan pengguna"
    description: >
      Template Blade berisi atribut event handler inline (onclick, onerror, onload, dll.) yang nilainya menyertakan data dari pengguna. Bahkan dengan HTML attribute encoding, menempatkan data pengguna di dalam event handler menciptakan vektor JavaScript injection.

    severity: high
    confidence: high
    category: DOM XSS
    tags: [xss, dom-xss, owasp-a03, cwe-79]
    patterns:
      - type: regex
        target: blade-files
        pattern: 'on(click|error|load|mouseover|submit|focus|blur|change|keyup|keydown)\s*=\s*["''][^"'']*\{\{'
    remediation: |
      Jangan pernah mencampur data pengguna dengan event handler inline.
      Gunakan atribut data dan event listener JavaScript:
        <button data-id="{{ $id }}" class="js-action">Click</button>
        <script>
        document.querySelectorAll('.js-action').forEach(b =>
            b.addEventListener('click', () => handle(b.dataset.id)));
        </script>
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-H02
    title: "href dengan data pengguna berpotensi javascript: URI"
    description: >
      Template Blade menghasilkan atribut href menggunakan data dari pengguna tanpa validasi skema. Penyerang menyisipkan URI javascript: yang dieksekusi di browser saat tautan diklik.

    severity: high
    confidence: medium
    category: DOM XSS
    tags: [xss, dom-xss, owasp-a03, cwe-79]
    patterns:
      - type: regex
        target: blade-files
        pattern: 'href\s*=\s*["'']?\{\{[^}]*(request|old|input|url|link|param)[^}]*\}\}'
        exclude_pattern: '(route\(|url\(|asset\(|secure_url\(|Str::startsWith)'
    remediation: |
      Validasi URL sebelum menggunakannya dalam atribut href:
        @php
            $url = Str::startsWith($link, ['https://', '/']) ? $link : '#';
        @endphp
        <a href="{{ $url }}">Link</a>
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-H03
    title: "Data JSON inline di <script> tanpa direktif @json"
    description: >
      Data PHP ditanamkan di dalam tag <script> menggunakan echo atau interpolasi string tanpa melalui direktif @json Blade atau json_encode() dengan JSON_HEX_TAG. JSON mentah dapat berisi sekuens </script> yang keluar dari konteks script.

    severity: high
    confidence: high
    category: Stored/Reflected XSS
    tags: [xss, owasp-a03, cwe-79]
    patterns:
      - type: regex
        target: blade-files
        pattern: '<script[^>]*>[\s\S]*?\{\{[\s\S]*?\}\}[\s\S]*?<\/script>'
        exclude_pattern: '(@json|JSON_HEX_TAG|json_encode)'
    remediation: |
      Gunakan direktif @json Blade yang mengatur flag yang benar secara otomatis:
        <script>const config = @json($config);</script>
      Atau gunakan json_encode() dengan flag HTML-safe:
        <?= json_encode($data, JSON_HEX_TAG|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_HEX_AMP) ?>
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-P01
    title: "echo/print dengan data tidak terpercaya tanpa escaping"
    description: >
      echo atau print mengeluarkan data dari $_GET, $_POST, $_REQUEST, atau $request-> tanpa htmlspecialchars() atau e(). Ini adalah reflected XSS paling mendasar dalam PHP.

    severity: critical
    confidence: high
    category: Reflected XSS
    tags: [xss, owasp-a03, cwe-79]
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(echo|print)\s+\$(_GET|_POST|_REQUEST)'
        exclude_pattern: '(htmlspecialchars|htmlentities|strip_tags|e\(|ENT_QUOTES)'
      - type: regex
        target: php-files
        pattern: '\b(echo|print)\s+\$request->(input|query|get|post)\s*\('
        exclude_pattern: '(htmlspecialchars|htmlentities|e\(|strip_tags|ENT_QUOTES)'
    remediation: |
      Selalu escape output ke HTML:
        echo htmlspecialchars($value, ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8');
        // atau di Laravel:
        echo e($request->input('name'));
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-P02
    title: "htmlspecialchars() tanpa null coalescing (PHP 8.1+)"
    description: >
      htmlspecialchars() atau htmlentities() menerima variabel tanpa null coalescing. Sejak PHP 8.1 input null memancarkan deprecation notice; di PHP 9.0 akan throw TypeError. Jika warning dipromosikan ke exception, encoding HTML gagal di tengah render dan dapat meninggalkan konten tanpa escaping di response.

    severity: medium
    confidence: medium
    category: Reflected XSS
    tags: [xss, php81, cwe-79]
    patterns:
      - type: regex
        target: php-files
        pattern: 'htmlspecialchars\s*\(\s*\$\w+\s*[,)]'
        exclude_pattern: '(\?\?|\(string\)|strval|is_string|is_null|e\()'
      - type: regex
        target: php-files
        pattern: 'htmlentities\s*\(\s*\$\w+\s*[,)]'
        exclude_pattern: '(\?\?|\(string\)|strval|is_string|is_null)'
    remediation: |
      Guard terhadap null dengan null coalescing atau cast eksplisit:
        htmlspecialchars($value ?? '', ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8');
        htmlspecialchars((string) $value, ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8');
      Lebih baik gunakan helper e() Laravel yang menangani null dengan aman: e($value)
    references:
      - "https://wiki.php.net/rfc/deprecate_null_to_scalar_internal_arg"
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-P03
    title: "FILTER_SANITIZE_STRING deprecated di PHP 8.1 — silent XSS risk"
    description: >
      FILTER_SANITIZE_STRING dideprecasi di PHP 8.1. Kode yang mengandalkannya untuk mitigasi XSS secara diam-diam tidak mendapat sanitasi apapun di PHP 8.1+ tanpa error runtime, membuka kembali vektor reflected dan stored XSS.

    severity: high
    confidence: high
    category: Reflected XSS
    tags: [xss, php81, deprecated, cwe-79]
    patterns:
      - type: regex
        target: php-files
        pattern: '\bFILTER_SANITIZE_(STRING|STRIPPED)\b'
    remediation: |
      Ganti dengan escaping yang sesuai konteks:
        $clean = e($input);                                          // Blade/HTML
        $clean = strip_tags($input);                                 // strip semua tag HTML
        $clean = htmlspecialchars($input ?? '', ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8');
    references:
      - "https://wiki.php.net/rfc/deprecations_php_8_1"
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-M01
    title: "Model accessor mengembalikan HTML mentah"
    description: >
      Accessor model mengembalikan nilai yang mengandung tag HTML. Ketika accessor ini dirender dengan {!! !!} di Blade atau dimasukkan ke response JSON, HTML tanpa escaping menciptakan vektor stored XSS yang dapat dicapai via setiap view atau consumer yang menggunakan accessor.

    severity: medium
    confidence: medium
    category: Stored XSS
    tags: [xss, eloquent, owasp-a03, cwe-79]
    patterns:
      - type: regex
        target: model-files
        pattern: 'function\s+get\w+Attribute\s*\([^)]*\)[^{]*\{[^}]*(<[a-z]+[\s>]|<\/[a-z]+>)'
    remediation: |
      Kembalikan nilai yang di-escape dari semua accessor:
        public function getDisplayNameAttribute(): string
        {
            return e($this->first_name . ' ' . $this->last_name);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
