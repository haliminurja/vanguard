meta:
  category: CodeIgniter 3 - Authentication
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 2.x-3.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CI-AUTH-001
    title: "CodeIgniter session identity or role sourced from POST input"
    description: >
      Session identity or privilege context is set directly from request input.
      This can enable account takeover or privilege escalation.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authentication
    tags: [codeigniter, auth, impersonation, owasp-a07-2021, cwe-287, asvs-2.1.1]
    owasp: "A07:2021"
    cwe: "CWE-287"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$this->session->set_userdata\s*\(\s*[''"](user|user_id|role|is_admin)[''"]\s*,\s*\$this->input->post'
      - type: regex
        target: php-files
        pattern: '\$this->session->set_userdata\s*\(\s*\[[^\]]*[''"](user|user_id|role|is_admin)[''"]\s*=>\s*\$this->input->post'
    remediation: |
      Resolve the authenticated user server-side after verified credentials or
      trusted token checks. Never let raw form input define session identity.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/287.html"
      - "https://codeigniter.com/userguide3/libraries/sessions.html"

  - id: CI-AUTH-002
    title: "Sensitive CodeIgniter controller action without clear auth check"
    description: >
      A privileged CodeIgniter controller action is present without nearby
      evidence of login or role verification.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authorization
    tags: [codeigniter, auth, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(admin|profile|settings|password|billing|delete|update)\b'
        exclude_pattern: '(logged_in|is_admin|has_role|authorize|auth|session->userdata\s*\(\s*[''"]user_id)'
    remediation: |
      Enforce authentication and role checks for every privileged controller
      action and validate ownership on object-level mutations.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://codeigniter.com/userguide3/general/controllers.html"

  - id: CI-AUTH-003
    title: "CodeIgniter login or recovery action without clear throttling"
    description: >
      Login, password reset, or OTP actions appear without visible brute-force
      controls nearby.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Authentication
    tags: [codeigniter, auth, rate-limit, bruteforce, owasp-a07-2021, cwe-307, asvs-2.2.4]
    owasp: "A07:2021"
    cwe: "CWE-307"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(login|forgot_password|reset_password|otp|verify)\b'
        exclude_pattern: '(throttle|rate_limit|login_attempt|TooManyAttempts|cache)'
    remediation: |
      Apply throttling and lockout controls to authentication and recovery
      handlers, keyed by both account and origin.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://codeigniter.com/userguide3/libraries/sessions.html"
