meta:
  category: CodeIgniter 3 - Security Configuration
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 2.x-3.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CI-SECCFG-001
    title: "CodeIgniter trusted proxy configuration is overly broad"
    description: >
      CodeIgniter trusted proxy settings allow all proxies or an effectively
      unbounded range. This weakens trust decisions based on forwarded headers
      such as client IP, scheme, or host.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:H/A:N"
    category: Security Configuration
    tags: [codeigniter, security-config, proxy, owasp-a05-2021, cwe-346, asvs-14.4.3]
    owasp: "A05:2021"
    cwe: "CWE-346"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[''proxy_ips''\]\s*=\s*[''"](\*|0\.0\.0\.0/0|::/0)[''"]'
    remediation: |
      Restrict trusted proxies to the specific addresses or CIDR ranges of your
      reverse-proxy infrastructure.
    references:
      - "https://codeigniter.com/userguide3/general/urls.html"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
  - id: CI-SECCFG-002
    title: "Overly Permissive CORS Policy Indicator"
    description: >
      CORS configuration appears overly permissive and may expose authenticated data across origins.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Configuration
    tags: [codeigniter, security-config, cors, owasp-a05-2021, cwe-346, asvs-14.2.5]
    owasp: "A05:2021"
    cwe: "CWE-346"
    patterns:
      - type: regex
        target: any
        pattern: 'Access-Control-Allow-Origin:\s*\*'
    remediation: |
      Use strict origin allowlists and avoid wildcard origins for sensitive or credentialed endpoints.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://codeigniter.com/userguide3/"
