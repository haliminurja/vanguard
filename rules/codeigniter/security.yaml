##############################################################################
# ENTERPRISE SECURITY RULESET — CODEIGNITER 3 (Legacy / CI < 3.2)
# Version : 2.0.0
# Last Updated : 2026-03-09
# Maintainer : Enterprise AppSec Team
# Standard : OWASP Top-10 2021 | CWE/SANS Top-25 | NIST SP 800-53
##############################################################################

metadata:
  framework: codeigniter3
  version_range: ">=2.0 <4.0"
  language: php
  ruleset_version: "2.0.0"
  last_updated: "2026-03-09"
  eol_notice: >
    CodeIgniter 3.x reached End of Life on December 31, 2022.
    Migration to CodeIgniter 4.x is strongly recommended for all
    production enterprise applications.
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001

rules:

  # ─────────────────────────────────────────────────────────────────────────
  # CI-ENT-001 | Insecure Client-Side Session Storage → RCE via POP Chain
  # ─────────────────────────────────────────────────────────────────────────
  - id: CI-ENT-001
    title: "Insecure Client-Side Session Deserialization (CI 2.x / Early 3.x)"
    description: >
      CodeIgniter 2 and early CI 3 versions stored session data as a PHP
      serialized array inside an HMAC-signed client-side cookie. If the
      encryption key is weak or leaked, it triggers PHP Object Injection.
    severity: critical
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Deserialization / Insecure Session
    enabled: true
    tags: [rce, deserialization, session, owasp-a08-2021, codeigniter, cwe-502, cwe-565]
    patterns:
      - id: CI-ENT-001-P1
        type: regex
        target: config-files
        description: "CI session not using database backend (uses cookie/file)"
        pattern: '\$config\[''sess_use_database''\]\s*=\s*(FALSE|false|0)\s*;'
        confidence: high
      - id: CI-ENT-001-P2
        type: regex
        target: config-files
        description: "CI3 sess_driver not set to database (defaults to files/cookie)"
        pattern: '\$config\[''sess_driver''\]\s*=\s*[''"](?:cookie|files|memcached|redis)[''"]\s*;'
        confidence: medium
      - id: CI-ENT-001-P3
        type: regex
        target: config-files
        description: "Empty or whitespace-only encryption key"
        pattern: '\$config\[''encryption_key''\]\s*=\s*[''"](\s*)[''"]'
        confidence: critical
    remediation: |
      Set sessions to use the database driver: `$config['sess_driver'] = 'database';`

  # ─────────────────────────────────────────────────────────────────────────
  # CI-ENT-002 | Weak / Empty Encryption Key → Full Impersonation
  # ─────────────────────────────────────────────────────────────────────────
  - id: CI-ENT-002
    title: "Weak, Empty, or Default Encryption Key in CodeIgniter Config"
    description: >
      CodeIgniter's `$config['encryption_key']` is the cryptographic root of
      trust. A weak key allows session forgery, CSRF bypass, and data decryption.
    severity: critical
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    enabled: true
    tags: [crypto, weak-key, owasp-a02-2021, codeigniter, cwe-321, cwe-326]
    patterns:
      - id: CI-ENT-002-P1
        type: regex
        target: config-files
        description: "Encryption key set to empty string"
        pattern: '\$config\[''encryption_key''\]\s*=\s*[''"](\s*)[''"];'
        confidence: critical
      - id: CI-ENT-002-P2
        type: regex
        target: config-files
        description: "Encryption key set to well-known placeholder value"
        pattern: '\$config\[''encryption_key''\]\s*=\s*[''"](?i)(YourSecretKey|changeme|secret|password|1234|test|demo|key)[''"];'
        confidence: critical
      - id: CI-ENT-002-P3
        type: regex
        target: config-files
        description: "Encryption key shorter than 32 characters"
        pattern: '\$config\[''encryption_key''\]\s*=\s*[''"][^''"]{1,31}[''"];'
        confidence: medium
    remediation: |
      Generate a 256-bit (32-byte) random key and store it via environment variables.

  # ─────────────────────────────────────────────────────────────────────────
  # CI-ENT-003 | Path Traversal via permitted_uri_chars → LFI
  # ─────────────────────────────────────────────────────────────────────────
  - id: CI-ENT-003
    title: "Local File Inclusion via URI Traversal in permitted_uri_chars"
    description: >
      If `$config['permitted_uri_chars']` allows dot (`.`) characters without filtering, attackers can inject `../` to force the router to include arbitrary PHP files.
    severity: high
    cvss_v3:
      score: 8.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N"
    category: Path Traversal / LFI
    enabled: true
    tags: [routing, lfi, path-traversal, owasp-a01-2021, codeigniter, cwe-22]
    patterns:
      - id: CI-ENT-003-P1
        type: regex
        target: config-files
        description: "permitted_uri_chars contains dot-dot traversal characters"
        pattern: '\$config\[''permitted_uri_chars''\]\s*=\s*[''"][^''"]*\.\.[^''"]*[''"]'
        confidence: critical
      - id: CI-ENT-003-P2
        type: regex
        target: config-files
        description: "permitted_uri_chars allows unescaped dot character"
        pattern: '\$config\[''permitted_uri_chars''\]\s*=\s*[''"][^''"]*[^\\]\.[^''"]*[''"]'
        exclude_pattern: '(a-z|0-9|%\.|\\\.)'
        confidence: medium
    remediation: |
      Use the safe default charset: `$config['permitted_uri_chars'] = 'a-z 0-9~%.:_\-';` and sanitize double dots.

  # ─────────────────────────────────────────────────────────────────────────
  # CI-ENT-004 | SQL Injection via Active Record Improper Usage
  # ─────────────────────────────────────────────────────────────────────────
  - id: CI-ENT-004
    title: "SQL Injection via CI3 Active Record Without Query Binding"
    description: >
      Using `$this->db->query()` with string concatenation, or passing raw strings
      to `where()`, bypasses escaping entirely.
    severity: critical
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: SQL Injection
    enabled: true
    tags: [sqli, codeigniter, cwe-89, owasp-a03-2021]
    patterns:
      - id: CI-ENT-004-P1
        type: regex
        target: php-files
        description: "Direct query() call with concatenated user variable"
        pattern: '\$this->db->query\s*\(\s*["''].*\.\s*\$(?:_GET|_POST|_REQUEST|this->input->(?:get|post))'
        confidence: critical
      - id: CI-ENT-004-P2
        type: regex
        target: php-files
        description: "where() call with raw string containing request variable"
        pattern: '\$this->db->where\s*\(\s*["''][^''"]+\s*=\s*[^''"]*\.\s*\$'
        confidence: high
    remediation: |
      Use query bindings or the Active Record array syntax.

  # ─────────────────────────────────────────────────────────────────────────
  # CI-ENT-005 | Insecure unserialize() Usage
  # ─────────────────────────────────────────────────────────────────────────
  - id: CI-ENT-005
    title: "Insecure unserialize() Custom Code"
    description: >
      Using `unserialize()` on user input allows Object Injection attacks.
    severity: critical
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Deserialization
    enabled: true
    tags: [php-object-injection, deserialization, codeigniter, cwe-502]
    patterns:
      - id: CI-ENT-005-P1
        type: regex
        target: php-files
        description: "unserialize on input data"
        pattern: 'unserialize\s*\(\s*\$(?:this->input->(?:post|get|cookie)|_POST|_GET|_COOKIE)'
        confidence: high
    remediation: |
      Use `json_decode()` instead of `unserialize()`.

  # ─────────────────────────────────────────────────────────────────────────
  # CI-ENT-006 | Path Traversal in $this->load->view()
  # ─────────────────────────────────────────────────────────────────────────
  - id: CI-ENT-006
    title: "Path Traversal in $this->load->view()"
    description: >
      Loading views using user-supplied parameters can lead to Local File Inclusion (LFI).
    severity: high
    cvss_v3:
      score: 8.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N"
    category: Path Traversal
    enabled: true
    tags: [lfi, codeigniter, cwe-22]
    patterns:
      - id: CI-ENT-006-P1
        type: regex
        target: php-files
        description: "Loading view from user input"
        pattern: '\$this->load->view\s*\(\s*\$(?:this->input->(?:post|get)|_POST|_GET)'
        confidence: high
    remediation: |
      Validate view names against an allowlist before loading.
