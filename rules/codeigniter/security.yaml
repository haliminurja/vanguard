
meta:
  category: CodeIgniter 3 Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 2.x-3.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:

  - id: CI-ENT-001
    title: "Insecure Client-Side Session Deserialization (CI 2.x / Early 3.x)"
    description: >
      CodeIgniter 2 and early CI 3 versions stored session data as a PHP
      serialized array inside an HMAC-signed client-side cookie. If the
      encryption key is weak or leaked, it triggers PHP Object Injection.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Deserialization / Insecure Session
    enabled: true
    tags: [rce, deserialization, session, owasp-a08-2021, codeigniter, cwe-502, cwe-565]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[''sess_use_database''\]\s*=\s*(FALSE|false|0)\s*;'
      - type: regex
        target: config-files
        pattern: '\$config\[''sess_driver''\]\s*=\s*[''"](?:cookie|files|memcached|redis)[''"]\s*;'
      - type: regex
        target: config-files
        pattern: '\$config\[''encryption_key''\]\s*=\s*[''"](\s*)[''"]'
    remediation: |
      Set sessions to use the database driver: `$config['sess_driver'] = 'database';`

    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
  - id: CI-ENT-002
    title: "Weak, Empty, or Default Encryption Key in CodeIgniter Config"
    description: >
      CodeIgniter's `$config['encryption_key']` is the cryptographic root of
      trust. A weak key allows session forgery, CSRF bypass, and data decryption.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    enabled: true
    tags: [crypto, weak-key, owasp-a02-2021, codeigniter, cwe-321, cwe-326]
    owasp: "A02:2021"
    cwe: "CWE-321"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[''encryption_key''\]\s*=\s*[''"](\s*)[''"];'
      - type: regex
        target: config-files
        pattern: '\$config\[''encryption_key''\]\s*=\s*[''"](?i)(YourSecretKey|changeme|secret|password|1234|test|demo|key)[''"];'
      - type: regex
        target: config-files
        pattern: '\$config\[''encryption_key''\]\s*=\s*[''"][^''"]{1,31}[''"];'
    remediation: |
      Generate a 256-bit (32-byte) random key and store it via environment variables.

    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/321.html"
  - id: CI-ENT-003
    title: "Local File Inclusion via URI Traversal in permitted_uri_chars"
    description: >
      If `$config['permitted_uri_chars']` allows dot (`.`) characters without filtering, attackers can inject `../` to force the router to include arbitrary PHP files.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N"
    category: Path Traversal / LFI
    enabled: true
    tags: [routing, lfi, path-traversal, owasp-a01-2021, codeigniter, cwe-22]
    owasp: "A01:2021"
    cwe: "CWE-22"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[''permitted_uri_chars''\]\s*=\s*[''"][^''"]*\.\.[^''"]*[''"]'
    remediation: |
      Use the safe default charset: `$config['permitted_uri_chars'] = 'a-z 0-9~%.:_\-';` and sanitize double dots.

    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/22.html"
  - id: CI-ENT-004
    title: "SQL Injection via CI3 Active Record Without Query Binding"
    description: >
      Using `$this->db->query()` with string concatenation, or passing raw strings
      to `where()`, bypasses escaping entirely.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: SQL Injection
    enabled: true
    tags: [sqli, codeigniter, cwe-89, owasp-a03-2021]
    owasp: "A03:2021"
    cwe: "CWE-89"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$this->db->query\s*\(\s*["''].*\.\s*\$(?:_GET|_POST|_REQUEST|this->input->(?:get|post))'
      - type: regex
        target: php-files
        pattern: '\$this->db->where\s*\(\s*["''][^''"]+\s*=\s*[^''"]*\.\s*\$'
    remediation: |
      Use query bindings or the Active Record array syntax.

    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/89.html"
  - id: CI-ENT-005
    title: "Insecure unserialize() Custom Code"
    description: >
      Using `unserialize()` on user input allows Object Injection attacks.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Deserialization
    enabled: true
    tags: [php-object-injection, deserialization, codeigniter, cwe-502]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: 'unserialize\s*\(\s*\$(?:this->input->(?:post|get|cookie)|_POST|_GET|_COOKIE)'
    remediation: |
      Use `json_decode()` instead of `unserialize()`.

    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
  - id: CI-ENT-006
    title: "Path Traversal in $this->load->view()"
    description: >
      Loading views using user-supplied parameters can lead to Local File Inclusion (LFI).
    severity: high
    confidence: high
    cvss_v3:
      score: 8.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N"
    category: Path Traversal
    enabled: true
    tags: [lfi, codeigniter, cwe-22]
    owasp: "A01:2021"
    cwe: "CWE-22"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$this->load->view\s*\(\s*\$(?:this->input->(?:post|get)|_POST|_GET)'
        exclude_pattern: '(in_array|array_key_exists|switch\s*\(|if\s*\()'
    remediation: |
      Validate view names against an allowlist before loading.

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/22.html"
  - id: CI-ENT-007
    title: "CSRF Protection Disabled"
    description: >
      CodeIgniter's built-in CSRF protection is disabled in `config.php`. Without this, all POST forms in the application are vulnerable to Cross-Site Request Forgery attacks.
    severity: critical
    confidence: high
    category: CSRF
    tags: [csrf, codeigniter, cwe-352]
    owasp: "A05:2021"
    cwe: "CWE-352"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[''csrf_protection''\]\s*=\s*(FALSE|false|0)\s*;'
    remediation: |
      Enable CSRF protection: `$config['csrf_protection'] = TRUE;`

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/352.html"
  - id: CI-ENT-008
    title: "Base URL Not Defined (Auto-detection Risk)"
    description: >
      If `$config['base_url']` is left empty, CodeIgniter attempts to guess it from `$_SERVER`. An attacker can manipulate the `Host` header to poison the URLs generated by the application (host header poisoning), which can cause password reset links or assets to point to the attacker's domain.
    severity: medium
    confidence: medium
    category: Hardening
    tags: [host-poisoning, codeigniter, cwe-20]
    owasp: "A05:2021"
    cwe: "CWE-20"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[''base_url''\]\s*=\s*[''"]\s*[''"]\s*;'
    remediation: |
      Always define base_url statically (or via environment variables):
      `$config['base_url'] = 'https://example.com/';`
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/20.html"
  - id: CI-ENT-009
    title: "Query String Routing Enabled (Legacy Attack Surface)"
    description: >
      Enabling query string routing can broaden reachable controller surface and bypass
      stricter route patterns expected by the application.
    severity: medium
    confidence: medium
    cvss_v3:
      score: 5.9
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:L/A:N"
    category: Security Misconfiguration
    tags: [codeigniter, routing, owasp-a05-2021, cwe-16, cis-control-4]
    owasp: "A05:2021"
    cwe: "CWE-16"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[''enable_query_strings''\]\s*=\s*(TRUE|true|1)\s*;'
    remediation: |
      Disable query string routing unless absolutely needed and harden route definitions.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/16.html"
      - "https://codeigniter.com/userguide3/general/urls.html"

  - id: CI-ENT-010
    title: "Database Debug Enabled"
    description: >
      `db_debug` enabled can leak SQL errors and internal schema details to users,
      aiding exploitation and reconnaissance.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Information Disclosure
    tags: [codeigniter, db, disclosure, owasp-a05-2021, cwe-209, asvs-9.5.1]
    owasp: "A05:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$db\[[^\]]+\]\[''db_debug''\]\s*=\s*(TRUE|true|1)\s*;'
    remediation: |
      Set `db_debug` to FALSE in production and centralize database error logging.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/209.html"
      - "https://codeigniter.com/userguide3/database/configuration.html"

  - id: CI-ENT-011
    title: "Session Cookie Not Forced to Secure Channel"
    description: >
      If `cookie_secure` is disabled, session cookies can be transmitted over plaintext HTTP,
      exposing authentication material to interception.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Session Security
    tags: [codeigniter, cookie, session, owasp-a07-2021, cwe-614, asvs-3.4.3]
    owasp: "A07:2021"
    cwe: "CWE-614"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[''cookie_secure''\]\s*=\s*(FALSE|false|0)\s*;'
    remediation: |
      Enable secure cookies and enforce HTTPS everywhere:
      `$config['cookie_secure'] = TRUE;`
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/614.html"
      - "https://codeigniter.com/userguide3/libraries/sessions.html"
