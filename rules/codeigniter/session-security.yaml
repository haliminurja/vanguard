meta:
  category: CodeIgniter 3 - Session Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 2.x-3.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CI-SESSION-001
    title: "CodeIgniter session cookie configuration is weak"
    description: >
      CodeIgniter session or cookie settings disable `cookie_secure` or
      `cookie_httponly`, exposing authenticated sessions to theft.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Session Security
    tags: [codeigniter, session-security, cookie, owasp-a07-2021, cwe-614, asvs-3.4.3]
    owasp: "A07:2021"
    cwe: "CWE-614"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[\s*[''"](cookie_secure|cookie_httponly)[''"]\s*\]\s*=\s*(FALSE|false|0)'
    remediation: |
      Keep CodeIgniter cookies secure and HttpOnly in production deployment
      profiles.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/614.html"
      - "https://codeigniter.com/userguide3/libraries/sessions.html"

  - id: CI-SESSION-002
    title: "CodeIgniter session rotation is disabled or preserves old sessions"
    description: >
      Session ID rotation is disabled or configured to retain old sessions. This
      weakens fixation protection after login or other sensitive transitions.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Session Security
    tags: [codeigniter, session-security, fixation, owasp-a07-2021, cwe-384, asvs-3.3.2]
    owasp: "A07:2021"
    cwe: "CWE-384"
    patterns:
      - type: regex
        target: config-files
        pattern: '\$config\[\s*[''"]sess_time_to_update[''"]\s*\]\s*=\s*0|\$config\[\s*[''"]sess_regenerate_destroy[''"]\s*\]\s*=\s*(FALSE|false|0)'
    remediation: |
      Keep session ID rotation enabled and destroy the old session when the ID
      changes after authentication or privilege changes.
    references:
      - "https://cwe.mitre.org/data/definitions/384.html"
      - "https://codeigniter.com/userguide3/libraries/sessions.html"

  - id: CI-SESSION-003
    title: "CodeIgniter accepts session IDs from request input"
    description: >
      CodeIgniter code sources the session ID from GET, POST, or cookie input.
      This is a direct session fixation risk.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Session Security
    tags: [codeigniter, session-security, fixation, owasp-a07-2021, cwe-384, asvs-3.3.2]
    owasp: "A07:2021"
    cwe: "CWE-384"
    patterns:
      - type: regex
        target: php-files
        pattern: 'session_id\s*\(\s*(\$this->input->(get|post|cookie)\s*\(|\$_(?:GET|POST|REQUEST|COOKIE))'
      - type: regex
        target: php-files
        pattern: '["''][^"'']*PHPSESSID='
    remediation: |
      Accept session identifiers only from framework-managed secure cookies and
      never from request-controlled parameters.
    references:
      - "https://cwe.mitre.org/data/definitions/384.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"
