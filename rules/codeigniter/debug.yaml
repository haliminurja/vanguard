meta:
  category: CodeIgniter 3 - Information Disclosure
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 2.x-3.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CI-DEBUG-001
    title: "Debug Mode or Verbose Diagnostic Exposure"
    description: >
      Debug functionality appears enabled in application or runtime configuration. Production exposure can leak internals and accelerate exploitation.
    severity: medium
    confidence: high
    cvss_v3:
      score: 5.9
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [codeigniter, debug, diagnostics, owasp-a05-2021, cwe-489, nist-si-11]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: any
        pattern: 'ENVIRONMENT\s*[,=]\s*[\"]development[\"]|db_debug\s*=\s*TRUE'
    remediation: |
      Disable debug features in production and route diagnostics into secure observability tooling with strict access controls.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/489.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
      - "https://codeigniter.com/userguide3/"
  - id: CI-DEBUG-002
    title: "CodeIgniter last_query() exposed to runtime output"
    description: >
      CodeIgniter database debugging helpers are exposed in runtime code.
      Returning or printing the last executed SQL query can leak schema details,
      table names, and raw query fragments to users.
    severity: medium
    confidence: high
    cvss_v3:
      score: 6.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [codeigniter, debug, sql-disclosure, owasp-a05-2021, cwe-209, asvs-14.3.1]
    owasp: "A05:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: php-files
        pattern: '(echo|print|return|die|exit)[^;\n]*\$this->db->last_query\s*\('
        exclude_pattern: '(log_message|logger|test|Test|spec)'
    remediation: |
      Do not expose last_query() to users. Keep query diagnostics in secured
      logs or local-only debugging workflows.
    references:
      - "https://codeigniter.com/userguide3/database/helpers.html"
      - "https://cwe.mitre.org/data/definitions/209.html"
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
