meta:
  category: CakePHP - Information Disclosure
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-DEBUG-001
    title: "CakePHP Debugger diagnostic methods present in runtime code"
    description: >
      CakePHP Debugger helpers are present in runtime paths and may expose raw
      object graphs, request data, or secrets if reached in production.
    severity: medium
    confidence: high
    cvss_v3:
      score: 6.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [cakephp, debug, debugger, owasp-a05-2021, cwe-489, asvs-14.3.1]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Debugger::(dump|printVar|exportVar)\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test|spec)'
    remediation: |
      Remove Debugger diagnostics from runtime code and use controlled logging
      or local-only debugging paths.
    references:
      - "https://cwe.mitre.org/data/definitions/489.html"
      - "https://book.cakephp.org/5/en/development/debugging.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
  - id: CAKE-DEBUG-002
    title: "Debug Functions Present in Runtime Code"
    description: >
      Debug helper functions are present and may expose sensitive runtime data if reached in production paths.
    severity: medium
    confidence: high
    cvss_v3:
      score: 6.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [cakephp, debug, owasp-a05-2021, cwe-489, asvs-14.3.1]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(debug|var_dump|print_r|var_export)\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test|spec|hexdump|mysqldump|mongodump|pg_dump)'
    remediation: |
      Remove debug statements from production code and use controlled logging with sanitization and access controls.
    references:
      - "https://cwe.mitre.org/data/definitions/489.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
      - "https://book.cakephp.org/4/en/index.html"
