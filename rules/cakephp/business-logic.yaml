meta:
  category: CakePHP - Business Logic
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-BIZ-001
    title: "Sensitive CakePHP business action without clear authorization check"
    description: >
      CakePHP controller methods for refunds, approvals, cancellations, price
      updates, or destructive mutations are present without nearby authorization
      enforcement.
    severity: high
    confidence: medium
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [cakephp, business-logic, access-control, owasp-a01-2021, cwe-840, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(edit|delete|approve|refund|cancel|capture|changeRole|setStatus|updatePrice)\b'
        exclude_pattern: '(->Authorization->authorize\s*\(|isAuthorized\s*\(|skipAuthorization)'
    remediation: |
      Keep authorization explicit for every business-critical CakePHP action and
      enforce object ownership close to the write path.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://book.cakephp.org/authorization/2/en/index.html"

  - id: CAKE-BIZ-002
    title: "Sensitive business fields assigned from CakePHP request input"
    description: >
      Price, amount, balance, discount, role, or status values are copied
      directly from CakePHP request data into entity setters or persistence
      arrays.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [cakephp, business-logic, pricing, owasp-a04-2021, cwe-840, asvs-4.2.4]
    owasp: "A04:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: '->set\s*\(\s*["''](price|amount|balance|discount|role|status)["'']\s*,\s*\$this->request->getData\s*\('
      - type: regex
        target: php-files
        pattern: '["''](price|amount|balance|discount|role|status)["'']\s*=>\s*\$this->request->getData\s*\('
    remediation: |
      Derive privileged business values server-side or constrain them with
      strict validation plus workflow-aware authorization logic.
    references:
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://book.cakephp.org/5/en/controllers/request-response.html"

  - id: CAKE-BIZ-003
    title: "CakePHP refund or balance mutation uses request-controlled amount"
    description: >
      Refund, credit, debit, transfer, or price adjustment methods receive raw
      CakePHP request values directly as the controlling amount or quantity.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [cakephp, business-logic, finance, owasp-a04-2021, cwe-840, asvs-4.2.4]
    owasp: "A04:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: '(refund|credit|debit|withdraw|transfer|adjustBalance|setPrice|applyDiscount)\s*\([^)]*\$this->request->getData\s*\('
    remediation: |
      Normalize and bound financial input before use and re-check business
      invariants such as ownership, state, and maximum allowed adjustment.
    references:
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://owasp.org/www-project-top-ten/"
