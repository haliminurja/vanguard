meta:
  category: CakePHP - API Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-API-001
    title: "CakePHP API routes without clear authentication or authorization middleware"
    description: >
      CakePHP API routes are declared without clear evidence of Authentication
      or Authorization middleware in the same routing context. This can expose
      sensitive JSON endpoints to unauthorized callers.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: API Security
    tags: [cakephp, api-security, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: routes-files
        pattern: 'Router::scope\s*\(\s*[''"]/api|->prefix\s*\(\s*[''"]Api[''"]|->setExtensions\s*\(\s*\[[^\]]*[''"]json[''"]\s*\]'
        exclude_pattern: '(Authentication|Authorization|applyMiddleware|registerMiddleware|->add\s*\(\s*[''"](Authentication|Authorization))'
    remediation: |
      Apply authentication and authorization middleware explicitly to CakePHP
      API scopes and keep sensitive JSON routes deny-by-default.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/"
      - "https://book.cakephp.org/4/en/controllers/middleware.html"

  - id: CAKE-API-002
    title: "CakePHP authentication API action without clear brute-force controls"
    description: >
      Login, token, OTP, or password reset actions are implemented without
      visible lockout or throttling indicators in the same controller file.
      These endpoints are common abuse targets.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: API Security
    tags: [cakephp, api-security, rate-limit, bruteforce, owasp-a04-2021, cwe-307, asvs-2.2.4]
    owasp: "A04:2021"
    cwe: "CWE-307"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'function\s+(login|token|authenticate|forgotPassword|resetPassword|otp)\s*\('
        exclude_pattern: '(attempts|throttle|rateLimit|lockout|TooManyRequests|Limiter)'
    remediation: |
      Add explicit anti-bruteforce controls to authentication-related API
      actions, including throttling, lockouts, and alerting.
    references:
      - "https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://book.cakephp.org/4/en/index.html"
