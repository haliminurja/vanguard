meta:
  category: CakePHP - Authentication
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-AUTH-001
    title: "CakePHP identity set directly from request data"
    description: >
      CakePHP authentication state is created from raw request data rather than
      a verified identity object. This can enable impersonation or account
      takeover.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authentication
    tags: [cakephp, auth, impersonation, owasp-a07-2021, cwe-287, asvs-2.1.1]
    owasp: "A07:2021"
    cwe: "CWE-287"
    patterns:
      - type: regex
        target: php-files
        pattern: '->setIdentity\s*\(\s*\$this->request->getData'
    remediation: |
      Use CakePHP authentication services to build a verified identity object
      before calling `setIdentity()`. Do not feed raw request data into the
      authenticated session state.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/287.html"
      - "https://book.cakephp.org/authentication/2/en/index.html"

  - id: CAKE-AUTH-002
    title: "Sensitive CakePHP controller action without clear authorization"
    description: >
      A privileged CakePHP action is present without nearby evidence of
      authorization enforcement.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authorization
    tags: [cakephp, auth, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(edit|delete|profile|settings|password|billing|admin)\b'
        exclude_pattern: '(->Authorization->authorize\s*\(|isAuthorized\s*\(|skipAuthorization)'
    remediation: |
      Apply explicit authorization checks for privileged controller actions and
      keep object ownership checks close to the mutation path.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://book.cakephp.org/authorization/2/en/index.html"

  - id: CAKE-AUTH-003
    title: "CakePHP login or recovery action without clear throttling"
    description: >
      Login, password reset, or OTP actions are present without visible
      throttling or brute-force controls nearby.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Authentication
    tags: [cakephp, auth, rate-limit, bruteforce, owasp-a07-2021, cwe-307, asvs-2.2.4]
    owasp: "A07:2021"
    cwe: "CWE-307"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(login|forgotPassword|resetPassword|verifyOtp|twoFactor)\b'
        exclude_pattern: '(RateLimiter|throttle|TooManyRequests|Cache::)'
    remediation: |
      Add brute-force controls to every CakePHP login and recovery flow,
      including account-based and IP-based throttling.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://book.cakephp.org/4/en/controllers/components/form-protection.html"
