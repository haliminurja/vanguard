meta:
  category: CakePHP - Authentication
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-AUTH-001
    title: "User-Controlled Authentication Flow"
    description: >
      Authentication identity or privilege context is derived from user-controlled input without strict verification. This can enable account takeover or privilege escalation.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authentication
    tags: [cakephp, auth, authorization, owasp-a07-2021, cwe-287, asvs-2.1.1]
    owasp: "A07:2021"
    cwe: "CWE-287"
    patterns:
      - type: regex
        target: php-files
        pattern: '->setIdentity\s*\(\s*\$this->request->getData'
        exclude_pattern: '(authorize|policy|current_user_can|denyAccessUnlessGranted|checkAccess|isAuthorized|Gate::|can\()'
    remediation: |
      Enforce strong authentication checks before setting identity or session context. Use framework-native guards, policies, and MFA for privileged flows.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/287.html"
      - "https://owasp.org/www-project-application-security-verification-standard/"
      - "https://book.cakephp.org/4/en/index.html"

  - id: CAKE-AUTH-002
    title: "Privileged Endpoint Without Clear Auth Guard"
    description: >
      Potential privileged endpoint patterns are detected without clear access control indicators in the same context.
    severity: high
    confidence: medium
    cvss_v3:
      score: 8.3
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authentication
    tags: [cakephp, auth, authorization, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: php-files
        pattern: 'public\s+function\s+(edit|delete|profile|settings|password|billing)\b'
        exclude_pattern: '(auth|middleware|authorize|isAuthorized|current_user_can|denyAccessUnlessGranted|checkAccess|Gate::|can\()'
    remediation: |
      Protect privileged endpoints with explicit authentication and authorization middleware/policies. Enforce deny-by-default.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://book.cakephp.org/4/en/index.html"
