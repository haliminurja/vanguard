meta:
  category: CakePHP - Security Configuration
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-SECCFG-001
    title: "CakePHP fullBaseUrl left empty"
    description: >
      CakePHP `App.fullBaseUrl` is empty, causing URL generation to rely on the
      incoming request host and proxy context. This can enable host-header
      poisoning if upstream trust boundaries are weak.
    severity: medium
    confidence: high
    cvss_v3:
      score: 6.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"
    category: Security Configuration
    tags: [cakephp, security-config, host-header, owasp-a05-2021, cwe-346, asvs-14.4.3]
    owasp: "A05:2021"
    cwe: "CWE-346"
    patterns:
      - type: regex
        target: config-files
        pattern: "['\"]fullBaseUrl['\"]\\s*=>\\s*['\"]\\s*['\"]"
    remediation: |
      Set `App.fullBaseUrl` explicitly for each environment and keep trusted
      proxy handling narrowly scoped.
    references:
      - "https://book.cakephp.org/4/en/development/configuration.html"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
  - id: CAKE-SECCFG-002
    title: "Manual wildcard CORS response header"
    description: >
      Application code emits a wildcard CORS origin header directly. This can
      expose sensitive responses cross-origin when applied to authenticated or
      sensitive endpoints.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Configuration
    tags: [cakephp, security-config, cors, owasp-a05-2021, cwe-346, asvs-14.2.5]
    owasp: "A05:2021"
    cwe: "CWE-346"
    patterns:
      - type: regex
        target: any
        pattern: "['\"]Access-Control-Allow-Origin['\"]\\s*=>\\s*['\"]\\*['\"]|header\\s*\\(\\s*['\"]Access-Control-Allow-Origin:\\s*\\*"
    remediation: |
      Use strict origin allowlists and avoid wildcard origins for sensitive or credentialed endpoints.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://book.cakephp.org/4/en/index.html"
