meta:
  category: CakePHP - Logging and Monitoring
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-LOG-001
    title: "Sensitive data written to CakePHP logs"
    description: >
      CakePHP logging calls include credentials, secrets, or authorization
      material. This creates durable downstream disclosure risk.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
    category: Logging and Monitoring
    tags: [cakephp, logging, monitoring, owasp-a09-2021, cwe-532, asvs-9.3.3]
    owasp: "A09:2021"
    cwe: "CWE-532"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Log::(debug|info|warning|error|critical|write)\s*\([^)]*(password|token|secret|authorization|api_key|private_key|otp)'
    remediation: |
      Redact or omit secret-bearing fields before they enter CakePHP logs and
      log only the minimum metadata required for investigation.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/532.html"
      - "https://book.cakephp.org/5/en/core-libraries/logging.html"

  - id: CAKE-LOG-002
    title: "CakePHP exception details returned to clients without clear logging"
    description: >
      Controller code returns or rethrows raw exception details to the client
      without nearby logging. This leaks internals and weakens incident
      response.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Logging and Monitoring
    tags: [cakephp, logging, exception-handling, owasp-a09-2021, cwe-209, asvs-9.1.1]
    owasp: "A09:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*return\s+\$this->response->[^}]*\$e->(getMessage|getTraceAsString)\(\)'
        exclude_pattern: 'Log::(error|critical|warning)|->log\s*\('
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*throw\s+new\s+[A-Za-z0-9_\\]*Exception\s*\([^)]*\$e->getMessage\(\)'
        exclude_pattern: 'Log::(error|critical|warning)|->log\s*\('
    remediation: |
      Log the exception server-side and return only normalized, generic client-
      facing error responses.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/209.html"
      - "https://book.cakephp.org/5/en/development/errors.html"

  - id: CAKE-LOG-003
    title: "CakePHP privilege or account-state changes without audit logging"
    description: >
      Privilege, password, email, or account-status changes appear without
      nearby audit logging or event emission.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Logging and Monitoring
    tags: [cakephp, logging, audit, owasp-a09-2021, cwe-778, asvs-9.2.1]
    owasp: "A09:2021"
    cwe: "CWE-778"
    patterns:
      - type: regex
        target: php-files
        pattern: '->set\s*\(\s*[''"](role|password|email|status)[''"]'
        exclude_pattern: '(Log::|audit|event\(|dispatch\()'
      - type: regex
        target: php-files
        pattern: 'patchEntity\s*\([^,]+,\s*\[[^\]]*[''"](role|password|email|status)[''"]'
        exclude_pattern: '(Log::|audit|event\(|dispatch\()'
    remediation: |
      Emit structured audit records for role, password, email, and account-
      status changes with actor, target, origin, and reason metadata.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/778.html"
      - "https://book.cakephp.org/5/en/core-libraries/events.html"
