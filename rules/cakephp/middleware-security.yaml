meta:
  category: CakePHP - Middleware Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-MID-001
    title: "CakePHP authorization bypass helper used in runtime path"
    description: >
      Runtime code explicitly calls authorization skip helpers, creating a risk
      that sensitive actions bypass normal policy enforcement.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Middleware Security
    tags: [cakephp, middleware-security, authorization, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: php-files
        pattern: 'skipAuthorization\s*\(|skipAuthentication\s*\('
    remediation: |
      Keep authorization and authentication skips narrowly scoped to routes that
      are intentionally public and document the exception explicitly.
    references:
      - "https://book.cakephp.org/authorization/2/en/index.html"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
  - id: CAKE-MID-002
    title: "Middleware Bypass or Security Filter Disabled"
    description: >
      Middleware bypass patterns or disabled security filters are detected, increasing the risk of unprotected request handling.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Middleware Security
    tags: [cakephp, middleware-security, security-misconfiguration, owasp-a05-2021, cwe-16, asvs-14.2.1]
    owasp: "A05:2021"
    cwe: "CWE-16"
    patterns:
      - type: regex
        target: any
        pattern: 'skipCheckCallback\s*\('
    remediation: |
      Remove middleware bypass behavior from production paths and restore security filters.
      Review exception lists and route-level overrides regularly.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/16.html"
      - "https://book.cakephp.org/4/en/index.html"
