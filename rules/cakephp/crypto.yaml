meta:
  category: CakePHP - Cryptographic Failure
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CAKE-CRYPTO-001
    title: "CakePHP uses weak password or token hashing"
    description: >
      CakePHP hasher configuration or application code uses MD5 or SHA-1 for
      password or token material, weakening resistance to offline cracking.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    tags: [cakephp, crypto, hashing, owasp-a02-2021, cwe-327, asvs-2.4.4]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: config-files
        pattern: 'hashType\s*=>\s*["''](md5|sha1)["'']'
      - type: regex
        target: php-files
        pattern: '\$(password|passwd|pwd|token|resetToken|reset_token|secret|apiKey|api_key)[A-Za-z0-9_]*\s*=\s*(md5|sha1|hash\s*\(\s*["''](md5|sha1)["''])'
    remediation: |
      Use CakePHP password hashers backed by modern algorithms and never derive
      long-lived secrets from MD5 or SHA-1.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://book.cakephp.org/authentication/2/en/password-hashers.html"

  - id: CAKE-CRYPTO-002
    title: "CakePHP outbound HTTP disables TLS verification"
    description: >
      CakePHP HTTP client configuration disables peer or host certificate
      verification, allowing man-in-the-middle attacks against upstream calls.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    tags: [cakephp, crypto, tls, owasp-a02-2021, cwe-295, asvs-9.1.1]
    owasp: "A02:2021"
    cwe: "CWE-295"
    patterns:
      - type: regex
        target: php-files
        pattern: '["'']ssl_verify_(peer|host|peer_name)["'']\s*=>\s*false|["'']verify["'']\s*=>\s*false'
    remediation: |
      Keep peer and host verification enabled for CakePHP outbound HTTP calls
      and fix trust issues at the certificate layer instead of bypassing checks.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://book.cakephp.org/5/en/core-libraries/httpclient.html"

  - id: CAKE-CRYPTO-003
    title: "CakePHP code uses ECB mode or hardcoded IV/nonce"
    description: >
      CakePHP application code uses insecure ECB mode or static IV/nonce values
      in custom encryption routines.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.9
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    tags: [cakephp, crypto, encryption, owasp-a02-2021, cwe-327, asvs-6.2.5]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(encrypt|decrypt)\s*\([^,]+,\s*["'']AES-(128|192|256)-ECB["'']'
      - type: regex
        target: php-files
        pattern: '\$(iv|nonce|salt)[A-Za-z0-9_]*\s*=\s*["''][^"''\$]{8,}["'']'
        exclude_pattern: '(random_bytes|bin2hex|base64_decode\s*\()'
    remediation: |
      Use modern AEAD encryption and generate a fresh random IV or nonce for
      every encryption operation.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/327.html"
