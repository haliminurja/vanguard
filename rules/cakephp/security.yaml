
meta:
  category: CakePHP Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CakePHP 3.0-5.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:

  - id: CAKE-ENT-001
    title: "SecurityComponent Form Tampering Ignored"
    description: >
      The legacy `SecurityComponent` in CakePHP 3/4 relies on tokens to verify form tampering. Disabling `validatePost` or `unlockedActions` wildly reduces security posture, allowing attackers to inject CSRF or tamper with POST fields unchecked.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: CSRF / Data Tampering
    enabled: true
    tags: [cakephp, csrf, form-tampering, cwe-352, owasp-a05-2021]
    owasp: "A05:2021"
    cwe: "CWE-352"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$this->Security->(unlockedActions|setConfig\(\s*\[[^\]]*[''"]validatePost[''"]\s*=>\s*false)'
    remediation: |
      Do not disable `validatePost` globally. Refactor actions that require non-standard tokens to specifically bypass only the required fields using `unlockedFields`.

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/352.html"
  - id: CAKE-ENT-002
    title: "Mass Assignment Bypass via ORM $_accessible"
    description: >
      CakePHP Entities use the `$_accessible` array to define which properties can be mass-assigned (`patchEntity`). If `$_accessible = ['*' => true]` is utilized without explicit overriding of sensitive fields like `$is_admin => false`, any payload mapped via `$this->request->getData()` will escalate privileges.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Mass Assignment
    enabled: true
    tags: [mass-assignment, cakephp, cwe-915, owasp-a04-2021]
    owasp: "A04:2021"
    cwe: "CWE-915"
    patterns:
      - type: regex
        target: model-files
        pattern: '\$_accessible\s*=\s*\[[^\]]*[''"]\*[''"]\s*=>\s*true'
        exclude_pattern: '([''"](role|admin|is_admin|superuser)[''"]\s*=>\s*false)'
    remediation: |
      If assigning `* => true`, explicitly set security-critical entity properties to false:
      `protected $_accessible = ['*' => true, 'is_admin' => false, 'role' => false];`

    references:
      - "https://owasp.org/Top10/A04_2021-Insecure_Design/"
      - "https://cwe.mitre.org/data/definitions/915.html"
  - id: CAKE-ENT-003
    title: "AuthComponent Allow(*) Wide-Open Bypass"
    description: >
      A Controller invokes `$this->Auth->allow()` without arguments or explicitly passing `*`, rendering all actions inside the controller completely readable/actionable to unauthenticated visitors.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
    category: Authentication Bypass
    enabled: true
    tags: [auth-bypass, idor, cakephp, cwe-285, owasp-a01-2021]
    owasp: "A01:2021"
    cwe: "CWE-285"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$this->Auth->allow\s*\(\s*(?:\[\s*\])?\s*\)'
    remediation: |
      Pass only the explicit action boundaries that demand open entry:
      `$this->Auth->allow(['login', 'register', 'forgotPassword']);`

    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/285.html"
  - id: CAKE-ENT-004
    title: "Insecure Object Deserialization via CakePHP Cache"
    description: >
      CakePHP's Cache engines often rely on PHP's native `serialize()` and
      `unserialize()`. If an attacker can write to the Cache backend (e.g. unprotected Redis)
      or manipulate cache keys derived from user input, they can trigger RCE via POP chains
      when Cake reads the cache.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Deserialization
    enabled: true
    tags: [rce, deserialization, cakephp, owasp-a08-2021, cwe-502]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Cache::(?:read|write|delete)\s*\(\s*(\$this->request->(?:getData|getQuery)|\$_POST|\$_GET)'
    remediation: |
      Never build Cache keys systematically utilizing unvalidated user input.
      Authenticate all cache backends like Redis or Memcached.

    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
  - id: CAKE-ENT-005
    title: "Security.salt Lemah atau Default"
    description: >
      `'salt' => env('SECURITY_SALT', '...')` di `app.php`. Jika salt dibiarkan default atau diset ke string pendek/lemah, penyerang dapat memalsukan token CSRF, cookie sesi (jika dienkripsi), dan hashing data internal lainnya.
    severity: critical
    confidence: high
    category: Cryptographic Failure
    tags: [crypto, salt, cakephp, cwe-326]
    owasp: "A02:2021"
    cwe: "CWE-326"
    patterns:
      - type: regex
        target: config-files
        pattern: "['\"]salt['\"]\\s*=>\\s*env\\(\\s*['\"]SECURITY_SALT['\"]\\s*,\\s*['\"]([^'\"]{1,31}|__SALT__)['\"]\\s*\\)"
    remediation: |
      Ganti salt dengan string acak panjang (minimal 64 karakter) di file `.env`.

    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/326.html"
  - id: CAKE-ENT-006
    title: "Debug Mode Aktif di Production (CakePHP)"
    description: >
      `'debug' => filter_var(env('DEBUG', true), FILTER_VALIDATE_BOOLEAN)` di `app.php`. Jika debug aktif di production, CakePHP akan menampilkan detail error yang sangat teknis termasuk query SQL dan variabel lingkungan, yang membocorkan rahasia infrastruktur.
    severity: high
    confidence: high
    category: Information Disclosure
    tags: [debug, disclosure, cakephp, cwe-489]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: config-files
        pattern: "['\"]debug['\"]\\s*=>\\s*(true|1|filter_var\\(env\\(['\"]DEBUG['\"]\\s*,\\s*true\\))"
    remediation: |
      Pastikan environment variable `DEBUG` diset ke `false` di lingkungan production.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/489.html"
  - id: CAKE-ENT-007
    title: "CSRF Protection Middleware Missing from Application Pipeline"
    description: >
      Application middleware pipeline does not include CSRF protection middleware.
      State-changing requests can be forged from attacker-controlled origins.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: CSRF
    tags: [cakephp, csrf, middleware, owasp-a01-2021, cwe-352, asvs-4.3.2]
    owasp: "A01:2021"
    cwe: "CWE-352"
    condition: all
    patterns:
      - type: regex-multiline
        target: php-files
        pattern: '(?s)function\s+middleware\s*\([^)]*\)\s*:\s*MiddlewareQueue'
      - type: contains
        target: php-files
        pattern: 'CsrfProtectionMiddleware'
        negative: true
    remediation: |
      Tambahkan `CsrfProtectionMiddleware` pada middleware queue aplikasi.
      Pastikan semua endpoint state-changing tervalidasi token CSRF.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/352.html"
      - "https://book.cakephp.org/4/en/security/csrf.html"

  - id: CAKE-ENT-008
    title: "CORS Wildcard Origin with Credentials in Middleware"
    description: >
      CORS middleware allows all origins while also allowing credentials.
      This can expose authenticated responses across origins.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Misconfiguration
    tags: [cakephp, cors, owasp-a05-2021, cwe-346, asvs-14.2.5, nist-sc-23]
    owasp: "A05:2021"
    cwe: "CWE-346"
    condition: all
    patterns:
      - type: regex
        target: php-files
        pattern: 'allowOrigin\s*\(\s*\[\s*[''"]\*[''"]\s*\]\s*\)'
      - type: regex
        target: php-files
        pattern: 'allowCredentials\s*\(\s*true\s*\)'
    remediation: |
      Gunakan daftar origin yang eksplisit dan nonaktifkan credentials untuk wildcard.
      Review ulang seluruh endpoint CORS-exposed.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://book.cakephp.org/4/en/controllers/middleware.html"

  - id: CAKE-ENT-009
    title: "Weak Password Hashing Configuration"
    description: >
      Password hasher config uses weak/legacy algorithms such as MD5 or SHA1,
      or legacy hasher class names that are not suitable for modern password storage.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    tags: [cakephp, password, hashing, owasp-a02-2021, cwe-327, asvs-2.4.4, pci-dss-3.5]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: config-files
        pattern: "['\"]className['\"]\\s*=>\\s*['\"](Legacy|WeakPasswordHasher)['\"]|['\"]hashType['\"]\\s*=>\\s*['\"](md5|sha1)['\"]"
    remediation: |
      Gunakan hasher modern (bcrypt/argon2id) dengan cost yang sesuai dan kebijakan rotasi.
      Rehash password legacy saat user login.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://book.cakephp.org/4/en/controllers/components/authentication.html"
