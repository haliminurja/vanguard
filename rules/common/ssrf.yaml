meta:
  category: Server-Side Request Forgery (SSRF)
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:

  - id: SSRF-003
    title: "SSRF via DNS Rebinding - DNS resolution without post-resolution validation"
    description: >
      The URL is validated but DNS resolution is performed twice (once for validation, once for the request). An attacker configures a DNS record with a very short TTL that first resolves to a public IP (passing validation) and then changes to an internal IP (when the actual request is made) - this is called a DNS Rebinding Attack.
    severity: high
    confidence: medium
    category: SSRF
    tags: [ssrf, dns-rebinding, owasp-a10, cwe-918]
    owasp: "A01:2021"
    cwe: "CWE-918"
    patterns:
      - type: regex-multiline
        target: php-files
        pattern: '(?s)gethostbyname\s*\([^)]+\).*?(Http::(get|post|put|patch|delete)|curl_setopt\s*\([^,]+,\s*CURLOPT_URL)'
        exclude_pattern: '(CURLOPT_RESOLVE|curl_setopt\s*\([^,]+,\s*CURLOPT_RESOLVE|withOptions\s*\(\s*\[.*CURLOPT_RESOLVE|dnsPin|pinned)'
    remediation: |
      Pin the resolved IP using the cURL RESOLVE option to prevent DNS rebinding:
        $host = parse_url($url, PHP_URL_HOST);
        $ip   = gethostbyname($host);
        // Validate IP...
        // Pin DNS resolution so it doesn't change between validation and request
        $response = Http::withOptions([
            'curl' => [CURLOPT_RESOLVE => ["{$host}:443:{$ip}"]],
        ])->timeout(5)->get($url);
    references:
      - "https://cwe.mitre.org/data/definitions/918.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"

  - id: SSRF-004
    title: "SSRF - unrestricted redirect following on HTTP client"
    description: >
      The HTTP client (Guzzle, Http facade) follows redirects without restrictions. An attacker sends a URL that initially points to an allowed host, but that URL redirects to an internal host or cloud metadata endpoint - bypassing allowlist validation.
    severity: high
    confidence: medium
    category: SSRF
    tags: [ssrf, redirect-bypass, owasp-a10, cwe-918]
    owasp: "A01:2021"
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: php-files
        pattern: '(Http::(get|post|put|patch|delete|send|request)\s*\(\s*(\$_GET|\$_POST|\$_REQUEST|\$request->(input|get|query|post|url|fullUrl)|request\(\)->(input|get|query)|\$\w*(url|uri|endpoint|callback|target|redirect)\w*)|curl_setopt\s*\([^,]+,\s*CURLOPT_URL\s*,\s*(\$_GET|\$_POST|\$_REQUEST|\$request->|\$\w*(url|uri|endpoint|callback|target|redirect)\w*))'
        exclude_pattern: '(allow_redirects\s*=>\s*false|maxRedirects\s*\(\s*0\s*\)|CURLOPT_FOLLOWLOCATION\s*,\s*false|filter_var\s*\([^,]+,\s*FILTER_VALIDATE_URL\)|parse_url\s*\()'
    remediation: |
      Disable or limit redirect following:
        $response = Http::withOptions([
            'allow_redirects' => false,  // Disable redirects
        ])->timeout(5)->get($validatedUrl);

        // Or limit the number of redirects
        $response = Http::maxRedirects(0)->get($validatedUrl);
    references:
      - "https://cwe.mitre.org/data/definitions/918.html"

  - id: SSRF-005
    title: "Direct access to cloud metadata endpoint"
    description: >
      Internal cloud provider metadata hosts (AWS, GCP, Azure, ECS, Alibaba) detected in source.
      These endpoints are often misused in SSRF scenarios to retrieve temporary credentials
      or instance identity.
    severity: critical
    confidence: high
    category: SSRF
    tags: [ssrf, metadata-service, owasp-a10, cwe-918]
    owasp: "A10:2021"
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: any
        pattern: '(https?:\/\/)?(169\.254\.169\.254|metadata\.google\.internal|metadata\.azure\.internal|169\.254\.170\.2|100\.100\.100\.200)([:\/]|$)'
        exclude_pattern: '(example|placeholder|dummy|sample|mock|test|README|CHANGELOG|docs?)'
    remediation: |
      Do not allow requests to internal metadata hosts. Apply an explicit denylist
      at the outbound HTTP layer:

        $blockedHosts = [
            '169.254.169.254',
            'metadata.google.internal',
            'metadata.azure.internal',
            '169.254.170.2',
            '100.100.100.200',
        ];

        if (in_array($host, $blockedHosts, true)) {
            throw new SecurityException('Metadata endpoint is blocked');
        }
    references:
      - "https://cwe.mitre.org/data/definitions/918.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
