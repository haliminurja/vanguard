meta:
  category: Server-Side Request Forgery (SSRF)
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10–12, PHP 8.0–8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: SSRF-001
    title: "SSRF — HTTP client request dengan URL dari input pengguna"
    description: >
      Laravel Http facade, Guzzle, atau cURL membuat request keluar menggunakan URL yang
      diambil langsung dari input pengguna tanpa validasi allowlist. Penyerang dapat mencapai
      layanan internal (Redis, RDS, metadata EC2 169.254.169.254), port scanning jaringan
      internal, membypass firewall, atau menyalahgunakan kredensial IAM.
    severity: critical
    confidence: high
    category: SSRF
    tags: [ssrf, owasp-a10, cwe-918, cloud-metadata]
    cwe: "CWE-918"
    owasp: "A10:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Http::(get|post|put|patch|delete|head|send|pool|async)\s*\(\s*(\$request->|request\()'
      - type: regex
        target: php-files
        pattern: 'curl_setopt\s*\([^,]+,\s*CURLOPT_URL\s*,\s*\$'
        exclude_pattern: '(config\(|env\(|allowedHosts|parse_url)'
      - type: regex
        target: php-files
        pattern: '(new GuzzleHttp\\\\Client|new Client)\s*\(\s*\)\s*->(get|post|request)\s*\(\s*\$'
        exclude_pattern: 'config\('
    remediation: |
      Validasi URL terhadap allowlist host yang ketat dan blokir IP private:
        $url    = $request->input('url');
        $parsed = parse_url($url);
        abort_unless(in_array($parsed['scheme'] ?? '', ['https'], true), 422, 'Skema tidak diizinkan');

        $allowedHosts = config('services.allowed_webhook_hosts', []);
        abort_unless(in_array($parsed['host'] ?? '', $allowedHosts, true), 422, 'Host tidak diizinkan');

        $ip = gethostbyname($parsed['host']);
        $flags = FILTER_FLAG_NO_PRIV_RANGE | FILTER_FLAG_NO_RES_RANGE;
        abort_if(
            filter_var($ip, FILTER_VALIDATE_IP, $flags) === false || $ip === '169.254.169.254',
            422, 'IP tidak diizinkan'
        );
    references:
      - "https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_(SSRF)/"
      - "https://cwe.mitre.org/data/definitions/918.html"

  - id: SSRF-002
    title: "SSRF — file_get_contents() dengan URL eksternal dari pengguna"
    description: >
      file_get_contents() dipanggil dengan URL yang dikontrol pengguna. Jika allow_url_fopen
      aktif, ini memungkinkan SSRF via HTTP/HTTPS wrapper dan eksposure resource internal.
    severity: critical
    confidence: high
    category: SSRF
    tags: [ssrf, owasp-a10, cwe-918]
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: php-files
        pattern: 'file_get_contents\s*\(\s*\$\w*(url|link|endpoint|webhook|callback|uri|src)\w*'
        exclude_pattern: '(FILTER_VALIDATE_URL|parse_url|allowedHost|storage_path|resource_path)'
      - type: regex
        target: php-files
        pattern: 'file_get_contents\s*\(\s*(\$request->|request\(|\$_GET|\$_POST)'
        exclude_pattern: '(FILTER_VALIDATE_URL|parse_url|allowedHosts)'
    remediation: |
      Gunakan Http facade Laravel dengan timeout dan validasi host:
        $response = Http::timeout(5)->get($validatedUrl);
    references:
      - "https://cwe.mitre.org/data/definitions/918.html"

  - id: SSRF-003
    title: "SSRF via DNS Rebinding — resolusi DNS tanpa validasi post-resolution"
    description: >
      URL divalidasi tetapi DNS resolution dilakukan dua kali (sekali untuk validasi, sekali untuk
      request). Penyerang mengonfigurasi DNS record dengan TTL sangat pendek yang pertama kali
      me-resolve ke IP public (melewati validasi) kemudian berubah ke IP internal (saat request
      sebenarnya dibuat) — ini disebut DNS Rebinding Attack.
    severity: high
    confidence: medium
    category: SSRF
    tags: [ssrf, dns-rebinding, owasp-a10, cwe-918]
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: php-files
        pattern: 'gethostbyname\s*\([^)]+\)[^;]*Http::'
        exclude_pattern: '(CURLOPT_RESOLVE|curl_setopt.*CURLOPT_RESOLVE|pinned|->withOptions.*resolve)'
    remediation: |
      Pin resolved IP menggunakan cURL RESOLVE option untuk mencegah DNS rebinding:
        $host = parse_url($url, PHP_URL_HOST);
        $ip   = gethostbyname($host);
        // Validasi IP...
        // Pin resolusi DNS agar tidak berubah antara validasi dan request
        $response = Http::withOptions([
            'curl' => [CURLOPT_RESOLVE => ["{$host}:443:{$ip}"]],
        ])->timeout(5)->get($url);
    references:
      - "https://cwe.mitre.org/data/definitions/918.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"

  - id: SSRF-004
    title: "SSRF — redirect following pada HTTP client tanpa pembatasan"
    description: >
      HTTP client (Guzzle, Http facade) mengikuti redirect tanpa pembatasan. Penyerang mengirim
      URL yang awalnya mengarah ke host yang diizinkan, tetapi URL tersebut melakukan redirect
      ke host internal atau cloud metadata endpoint — membypass validasi allowlist.
    severity: high
    confidence: medium
    category: SSRF
    tags: [ssrf, redirect-bypass, owasp-a10, cwe-918]
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Http::(get|post|put)\s*\('
        exclude_pattern: '(maxRedirects|allow_redirects.*false|withOptions.*redirect|->maxRedirects\(0\))'
    remediation: |
      Nonaktifkan atau batasi redirect following:
        $response = Http::withOptions([
            'allow_redirects' => false,  // Nonaktifkan redirect
        ])->timeout(5)->get($validatedUrl);

        // Atau batasi jumlah redirect
        $response = Http::maxRedirects(0)->get($validatedUrl);
    references:
      - "https://cwe.mitre.org/data/definitions/918.html"

  - id: SSRF-005
    title: "SSRF — webhook URL disimpan tanpa validasi dan digunakan untuk callback"
    description: >
      Aplikasi menyimpan URL webhook dari pengguna ke database dan kemudian menggunakannya
      untuk mengirim HTTP callback. URL tidak divalidasi saat disimpan maupun saat digunakan.
      Ini adalah SSRF yang tertunda (stored SSRF) — penyerang menyimpan URL internal dan
      menunggu sistem mengirim request ke URL tersebut.
    severity: critical
    confidence: medium
    category: SSRF
    tags: [ssrf, stored-ssrf, webhook, owasp-a10, cwe-918]
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: php-files
        pattern: '(webhook_url|callback_url|notify_url|endpoint_url)\s*=\s*\$request->(input|get)\s*\('
        exclude_pattern: '(FILTER_VALIDATE_URL|parse_url|allowedHost|validate.*url)'
    remediation: |
      Validasi webhook URL saat penyimpanan DAN saat penggunaan:
        // Saat menyimpan
        $request->validate(['webhook_url' => 'required|url:https']);
        $parsed = parse_url($request->input('webhook_url'));
        $ip = gethostbyname($parsed['host']);
        abort_if(filter_var($ip, FILTER_VALIDATE_IP, FILTER_FLAG_NO_PRIV_RANGE) === false, 422);

        // Saat callback
        $ip = gethostbyname(parse_url($webhook->url, PHP_URL_HOST));
        abort_if(filter_var($ip, FILTER_VALIDATE_IP, FILTER_FLAG_NO_PRIV_RANGE) === false, 422);
        Http::timeout(5)->maxRedirects(0)->post($webhook->url, $payload);
    references:
      - "https://cwe.mitre.org/data/definitions/918.html"
