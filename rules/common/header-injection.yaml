meta:
  category: Header Injection & Security Headers
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: HDR-I01
    title: "HTTP Response Splitting — input pengguna dalam nilai header()"
    description: >
      header() dipanggil dengan nilai yang mengandung input pengguna tanpa menghapus karakter newline (\r\n). Penyerang menyisipkan sekuens CRLF untuk menambahkan header HTTP arbitrer, memisahkan response menjadi dua response terpisah, menyetel cookie atas nama server, atau melakukan cache poisoning.

    severity: critical
    confidence: high
    category: Response Splitting
    tags: [header-injection, owasp-a03, cwe-113]
    patterns:
      - type: regex
        target: php-files
        pattern: 'header\s*\(\s*["''][^"'']+(Location|Content-Type|Set-Cookie)[^"'']*.+\$(_GET|_POST|_REQUEST|request)'
    remediation: |
      Hapus semua karakter CR/LF dari input pengguna yang digunakan dalam nilai header:
        $clean = str_replace(["\r", "\n", "%0d", "%0a", "%0D", "%0A"], '', $request->input('value'));
        header("Location: /redirect?ref=" . urlencode($clean));
      Lebih baik gunakan helper redirect() dan response() Laravel yang menangani ini secara otomatis.
    references:
      - "https://cwe.mitre.org/data/definitions/113.html"
      - "https://owasp.org/www-community/attacks/HTTP_Response_Splitting"
  - id: HDR-S01
    title: "Tidak ada header X-Content-Type-Options dalam security middleware"
    description: >
      Tidak ada middleware yang menyetel header X-Content-Type-Options: nosniff. Tanpa header ini, browser mungkin melakukan MIME-sniffing pada tipe konten response, memungkinkan file yang diupload disajikan sebagai text/plain untuk dieksekusi sebagai JavaScript atau HTML.

    severity: medium
    confidence: medium
    category: Missing Security Header
    tags: [security-headers, mime-sniff, owasp-a05, cwe-16]
    patterns:
      - type: contains
        target: middleware-files
        pattern: "X-Content-Type-Options"
        negative: true
    remediation: |
      Tambahkan header ini dalam middleware security-headers khusus:
        $response->headers->set('X-Content-Type-Options', 'nosniff');
      Daftarkan middleware dalam global HTTP kernel group.
    references:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Content-Type-Options"
      - "https://cwe.mitre.org/data/definitions/16.html"
  - id: HDR-S02
    title: "Tidak ada header Strict-Transport-Security (HSTS) dalam middleware"
    description: >
      Tidak ada middleware yang menyetel header HTTP Strict-Transport-Security. Tanpa HSTS, browser tidak menerapkan koneksi HTTPS — pengguna yang menavigasi ke http:// tidak di-upgrade secara otomatis, dan serangan SSL-stripping berhasil secara diam-diam.

    severity: high
    confidence: medium
    category: Missing Security Header
    tags: [security-headers, hsts, owasp-a05, cwe-319]
    patterns:
      - type: contains
        target: middleware-files
        pattern: "Strict-Transport-Security"
        negative: true
    remediation: |
      Set HSTS dengan max-age minimum 1 tahun di security middleware Anda:
        $response->headers->set(
            'Strict-Transport-Security',
            'max-age=31536000; includeSubDomains; preload'
        );
    references:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security"
      - "https://cwe.mitre.org/data/definitions/319.html"
  - id: HDR-S03
    title: "Tidak ada header X-Frame-Options dalam middleware"
    description: >
      Tidak ada middleware yang menyetel header X-Frame-Options atau CSP frame-ancestors. Tanpa proteksi frame, situs berbahaya dapat menanamkan aplikasi dalam iframe tersembunyi untuk melakukan serangan UI redressing (clickjacking).

    severity: medium
    confidence: medium
    category: Missing Security Header
    tags: [clickjacking, security-headers, owasp-a05, cwe-1021]
    patterns:
      - type: contains
        target: middleware-files
        pattern: "X-Frame-Options"
        negative: true
    remediation: |
      Tambahkan proteksi frame dalam middleware security-headers global:
        $response->headers->set('X-Frame-Options', 'SAMEORIGIN');
        // Atau gunakan CSP frame-ancestors (lebih disukai):
        $response->headers->set('Content-Security-Policy', "frame-ancestors 'self'");
    references:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/X-Frame-Options"
      - "https://cwe.mitre.org/data/definitions/1021.html"
  - id: HDR-S04
    title: "Tidak ada header Referrer-Policy dalam middleware"
    description: >
      Tidak ada middleware yang menyetel header Referrer-Policy. Tanpa ini, browser mengirimkan URL lengkap (termasuk query parameter) sebagai header Referer pada semua cross-origin request — membocorkan token session, kata kunci pencarian, struktur route internal, dan parameter URL yang mengidentifikasi pengguna ke pihak ketiga.

    severity: medium
    confidence: medium
    category: Missing Security Header
    tags: [security-headers, referrer, owasp-a05, cwe-200]
    patterns:
      - type: contains
        target: middleware-files
        pattern: "Referrer-Policy"
        negative: true
    remediation: |
      Set kebijakan referrer yang ketat dalam security-headers middleware:
        $response->headers->set('Referrer-Policy', 'strict-origin-when-cross-origin');
    references:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Referrer-Policy"
      - "https://cwe.mitre.org/data/definitions/200.html"
  - id: HDR-S05
    title: "Tidak ada header Content-Security-Policy dalam middleware"
    description: >
      Tidak ada middleware yang menyetel header Content-Security-Policy (CSP). CSP adalah lapisan pertahanan yang paling efektif terhadap XSS karena membatasi sumber konten yang dapat dimuat dan dieksekusi oleh browser.

    severity: medium
    confidence: low
    category: Missing Security Header
    tags: [security-headers, csp, xss, owasp-a05, cwe-16]
    patterns:
      - type: contains
        target: middleware-files
        pattern: "Content-Security-Policy"
        negative: true
    remediation: |
      Mulai dengan kebijakan CSP yang restriktif dan longgarkan secara bertahap:
        $response->headers->set(
            'Content-Security-Policy',
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
        );
    references:
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP"
      - "https://csp-evaluator.withgoogle.com/"
