meta:
  category: Middleware Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: MID-001
    title: "Auth middleware dengan silent failure - tanpa abort atau redirect"
    description: >
      Pemeriksaan autentikasi dalam middleware dilakukan tetapi tidak ada abort(), throw, atau redirect yang dikeluarkan saat gagal. Request secara diam-diam meneruskan ke middleware atau controller berikutnya, melewati autentikasi sepenuhnya.

    severity: critical
    confidence: medium
    category: Auth Bypass
    tags: [middleware, auth-bypass, owasp-a07, cwe-862]
    patterns:
      - type: regex
        target: middleware-files
        pattern: '(Auth::check|auth\(\)->check|auth\(\)->guest)\s*\(\s*\)\s*[;)]'
        exclude_pattern: '(abort|throw\s+new|redirect|return\s+response|if\s*\(|&&|\|\|)'
    remediation: |
      Selalu abort atau redirect segera pada pemeriksaan auth yang gagal:
        public function handle(Request $request, Closure $next): Response
        {
            if (!Auth::check()) {
                abort(401, 'Unauthenticated.');
            }
            return $next($request);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/862.html"
  - id: MID-002
    title: "Pemeriksaan role/permission tanpa null-guard pada user"
    description: >
      Middleware memanggil $request->user()->(hasRole|can|isAdmin) tanpa terlebih dahulu memverifikasi bahwa $request->user() tidak null. Pada request yang tidak terautentikasi ini menyebabkan fatal error yang mungkin ditelan secara diam-diam, memungkinkan request melewati otorisasi.

    severity: high
    confidence: medium
    category: Authorization Bypass
    tags: [middleware, authz, owasp-a01, cwe-862]
    patterns:
      - type: regex
        target: middleware-files
        pattern: '\$request->user\(\)->(hasRole|hasPermission|can|cannot|isAdmin|hasAbility|isA)\s*\('
        exclude_pattern: '(Auth::check|auth\(\)->check|->user\(\)\s*&&|\?\?|!==?\s*null|optional\(|abort_unless.*auth)'
    remediation: |
      Selalu verifikasi autentikasi sebelum memeriksa otorisasi:
        public function handle(Request $request, Closure $next): Response
        {
            $user = $request->user();
            abort_if(!$user, 401);
            abort_if(!$user->hasRole('admin'), 403);
            return $next($request);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/862.html"
  - id: MID-003
    title: "CORS middleware mengizinkan wildcard atau reflected origin"
    description: >
      Custom CORS middleware menyetel Access-Control-Allow-Origin ke '*' atau langsung merefleksikan header Origin tanpa validasi. Ini mengizinkan website manapun membuat cross-origin request, termasuk dengan kredensial jika Allow-Credentials juga disetel.

    severity: high
    confidence: high
    category: CORS Misconfiguration
    tags: [middleware, cors, owasp-a05, cwe-942]
    patterns:
      - type: regex
        target: middleware-files
        pattern: 'Access-Control-Allow-Origin[^:]*:\s*[*]'
      - type: regex
        target: middleware-files
        pattern: '\$request->header\s*\(\s*["'']Origin["'']\s*\)'
        exclude_pattern: '(in_array|allowedOrigins|whitelist|allowed|config\(|$allowedOrigins)'
    remediation: |
      Validasi header Origin terhadap allowlist eksplisit:
        $allowed = config('cors.allowed_origins', []);
        $origin  = $request->header('Origin', '');
        if (in_array($origin, $allowed, true)) {
            $response->header('Access-Control-Allow-Origin', $origin);
            $response->header('Vary', 'Origin');
        }
    references:
      - "https://cwe.mitre.org/data/definitions/942.html"
      - "https://portswigger.net/web-security/cors"
  - id: MID-004
    title: "Middleware mencatat seluruh request body"
    description: >
      Middleware mencatat seluruh request body ($request->all() atau $request->getContent()). Payload login, data pembayaran, dan informasi personal yang ditangkap dengan cara ini menciptakan risiko eksposur data sensitif dalam penyimpanan log dan dashboard monitoring.

    severity: high
    confidence: high
    category: Sensitive Data Logging
    tags: [middleware, logging, info-disclosure, owasp-a09, cwe-532]
    patterns:
      - type: regex
        target: middleware-files
        pattern: 'Log::\w+\s*\([^;]*\$request->(all\(\)|getContent\(\)|toArray\(\))'
    remediation: |
      Log hanya metadata request yang aman dan tidak sensitif:
        Log::info('Incoming request', [
            'method'     => $request->method(),
            'path'       => $request->path(),
            'ip'         => $request->ip(),
            'user_agent' => substr($request->userAgent() ?? '', 0, 200),
        ]);
    references:
      - "https://cwe.mitre.org/data/definitions/532.html"
  - id: MID-005
    title: "TrustProxies dikonfigurasi dengan wildcard '*'"
    description: >
      TrustProxies dikonfigurasi dengan $proxies = '*', menyebabkan aplikasi menerima X-Forwarded-For, X-Forwarded-Proto dari IP manapun. Penyerang dapat memalsukan header ini untuk melewati rate limiting berbasis IP dan penerapan HTTPS.

    severity: high
    confidence: high
    category: Proxy Trust Misconfiguration
    tags: [proxy, owasp-a05, cwe-346, laravel]
    patterns:
      - type: regex
        target: php-files
        pattern: 'protected\s+\$proxies\s*=\s*["'']?\*["'']?'
      - type: regex
        target: env-files
        pattern: 'TRUSTED_PROXIES\s*=\s*\*'
    remediation: |
      Tentukan range IP load balancer/CDN Anda secara eksplisit:
        protected $proxies = ['203.0.113.1/32', '10.0.0.0/8'];
      Untuk Cloudflare/AWS ALB, gunakan range IP mereka yang terdokumentasi.
    references:
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://laravel.com/docs/requests#configuring-trusted-proxies"
