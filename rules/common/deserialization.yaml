meta:
  category: Deserialization & Object Injection
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: DESER-001
    title: "Insecure Deserialization - unserialize() with user input"
    description: >
      unserialize() is called with user-controlled input. PHP unserialize()
      can instantiate arbitrary objects and trigger magic methods (__destruct, __wakeup,
      __toString), allowing an attacker to execute arbitrary code via POP chains
      (Property-Oriented Programming) - this is Remote Code Execution.
    severity: critical
    confidence: high
    category: Insecure Deserialization
    tags: [deserialization, rce, php-object-injection, owasp-a08, cwe-502]
    cwe: "CWE-502"
    owasp: "A08:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'unserialize\s*\(\s*(\$request->|\$_GET|\$_POST|\$_COOKIE|\$_REQUEST|base64_decode\s*\(\s*\$)'
      - type: regex
        target: php-files
        pattern: 'unserialize\s*\(\s*\$\w*(data|input|payload|body|content|value|param)\w*'
        exclude_pattern: '(allowed_classes\s*=>\s*false|allowed_classes\s*=>\s*\[|test|Test|mock|Mock)'
    remediation: |
      DO NOT use unserialize() for data from users. Use JSON:
        // - CORRECT - JSON is safe from object injection
        $data = json_decode($input, true, 10, JSON_THROW_ON_ERROR);

        // If unserialize() cannot be avoided, block object creation:
        $data = unserialize($input, ['allowed_classes' => false]);
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/07-Input_Validation_Testing/16-Testing_for_HTTP_Incoming_Requests"

  - id: DESER-002
    title: "Insecure Deserialization - unserialize() without allowed_classes restriction"
    description: >
      unserialize() is called without the allowed_classes parameter. Since PHP 7.0, this
      parameter allows restricting which classes can be instantiated. Without restriction,
      all classes in the autoloader are available for POP chain attacks.
    severity: high
    confidence: high
    category: Insecure Deserialization
    tags: [deserialization, rce, owasp-a08, cwe-502]
    cwe: "CWE-502"
    owasp: "A08:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'unserialize\s*\(\s*\$[^,)]+\s*\)'
        exclude_pattern: '(allowed_classes|json_decode|test|Test|mock|Mock|\$this->serializer)'
    remediation: |
      If unserialize() must be used, restrict allowed_classes:
        // Block all classes
        $data = unserialize($input, ['allowed_classes' => false]);
        // Or whitelist specific classes
        $data = unserialize($input, ['allowed_classes' => [UserDTO::class]]);
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"

  - id: DESER-003
    title: "Insecure Deserialization - cookie contains serialized data"
    description: >
      The application reads and unserializes data from a cookie. Cookies are fully
      client-controlled - even if encrypted, if the encryption key is leaked (via
      APP_KEY leak), an attacker can craft a cookie with arbitrary serialized payload
      for RCE via POP chains.
    severity: critical
    confidence: high
    category: Insecure Deserialization
    tags: [deserialization, cookies, rce, owasp-a08, cwe-502]
    cwe: "CWE-502"
    owasp: "A08:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'unserialize\s*\(\s*(Cookie::|cookie\(|\$_COOKIE|\$request->cookie)'
      - type: regex
        target: php-files
        pattern: 'unserialize\s*\(\s*(decrypt|Crypt::decrypt)\s*\(\s*(\$_COOKIE|\$request->cookie)'
    remediation: |
      Use JSON for cookie data. Do not serialize objects to cookies:
        // - CORRECT
        $preferences = json_decode($request->cookie('prefs', '{}'), true);

        // Set cookie
        return response()->withCookie(
            cookie('prefs', json_encode($prefs), 60 * 24)
        );
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"

  - id: DESER-004
    title: "PHP Object Injection via dangerous __wakeup() or __destruct()"
    description: >
      A class defines a __wakeup() or __destruct() method that performs dangerous operations
      (file operations, command execution, database queries). This class becomes a gadget in
      a POP chain - if an attacker finds an unserialize() entry point, this class enables
      escalation from deserialization to RCE.
    severity: high
    confidence: medium
    category: POP Chain Gadget
    tags: [deserialization, pop-chain, gadget, owasp-a08, cwe-502]
    cwe: "CWE-502"
    owasp: "A08:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'function\s+__(wakeup|destruct)\s*\(\s*\)\s*\{[^}]*(exec|system|passthru|shell_exec|file_put_contents|unlink|fwrite|include|require|eval)'
    remediation: |
      Avoid dangerous operations in magic methods. If necessary, validate state:
        public function __destruct()
        {
            // - Only safe, non-destructive operations
            if (isset($this->tempFile) && file_exists($this->tempFile)) {
                // Validate path before operation
                $safePath = realpath($this->tempFile);
                if ($safePath && str_starts_with($safePath, sys_get_temp_dir())) {
                    unlink($safePath);
                }
            }
        }
    references:
      - "https://cwe.mitre.org/data/definitions/502.html"
