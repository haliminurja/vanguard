meta:
  category: Business Logic & Access Control
  version: "4.0.0"
  updated: "2026"
  maintainer: "Security Engineering Team"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: BIZ-007
    title: "Quantity/Amount without minimum and maximum limits"
    description: >
      Quantity or amount from user input is not validated against minimum and maximum limits. Attackers input negative values (causing refunds or credits), zero (bypassing costs), or very large values (integer overflow, DoS, or resource exhaustion).

    severity: high
    confidence: medium
    category: Input Validation
    tags: [business-logic, input-validation, cwe-20, owasp-a04]
    cwe: "CWE-20"
    owasp: "A04:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$request->(input|get|integer)\s*\(\s*["''](quantity|qty|amount|count|units|seats|tickets|items)["'']'
        exclude_pattern: '(validate|min:|max:|between:|gt:|gte:|integer|numeric|->integer\()'
    remediation: |
      Always validate quantity limits with strict rules:
        $request->validate([
            'quantity' => 'required|integer|min:1|max:100',
            'amount'   => 'required|numeric|min:0.01|max:999999.99',
        ]);
    references:
      - "https://cwe.mitre.org/data/definitions/20.html"
