meta:
  category: XSS
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: XSS-B04
    title: "Blade @include dengan path view dari input pengguna"
    description: >
      Direktif @include Blade menerima nama view yang berasal dari input pengguna. Penyerang dapat menavigasi ke template admin, mengekspos data konfigurasi, atau memicu eksekusi kode level template.

    severity: critical
    confidence: high
    category: SSTI/XSS
    tags: [xss, ssti, owasp-a03, cwe-94]
    owasp: "A03:2021"
    cwe: "CWE-94"
    patterns:
      - type: regex
        pattern: '@include\s*\(\s*\$'
        exclude_pattern: '\$errors'
    remediation: |
      Whitelist nama view yang diizinkan - jangan pernah teruskan input pengguna langsung:
        @php
            $allowed = ['header' => 'partials.header', 'footer' => 'partials.footer'];
            $view    = $allowed[$type] ?? 'partials.default';
        @endphp
        @include($view)
    references:
      - "https://cwe.mitre.org/data/definitions/94.html"
  - id: XSS-P01
    title: "echo/print dengan data tidak terpercaya tanpa escaping"
    description: >
      echo atau print mengeluarkan data dari $_GET, $_POST, $_REQUEST, atau $request-> tanpa htmlspecialchars() atau e(). Ini adalah reflected XSS paling mendasar dalam PHP.

    severity: critical
    confidence: high
    category: Reflected XSS
    tags: [xss, owasp-a03, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(echo|print)\s+\$(_GET|_POST|_REQUEST)'
        exclude_pattern: '(htmlspecialchars|htmlentities|strip_tags|e\(|ENT_QUOTES)'
      - type: regex
        target: php-files
        pattern: '\b(echo|print)\s+\$request->(input|query|get|post)\s*\('
        exclude_pattern: '(htmlspecialchars|htmlentities|e\(|strip_tags|ENT_QUOTES)'
    remediation: |
      Selalu escape output ke HTML:
        echo htmlspecialchars($value, ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8');
        // atau di Laravel:
        echo e($request->input('name'));
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-P02
    title: "htmlspecialchars() tanpa null coalescing (PHP 8.1+)"
    description: >
      htmlspecialchars() atau htmlentities() menerima variabel tanpa null coalescing. Sejak PHP 8.1 input null memancarkan deprecation notice; di PHP 9.0 akan throw TypeError. Jika warning dipromosikan ke exception, encoding HTML gagal di tengah render dan dapat meninggalkan konten tanpa escaping di response.

    severity: medium
    confidence: medium
    category: Reflected XSS
    tags: [xss, php81, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: php-files
        pattern: 'htmlspecialchars\s*\(\s*\$\w+\s*[,)]'
        exclude_pattern: '(\?\?|\(string\)|strval|is_string|is_null|e\()'
      - type: regex
        target: php-files
        pattern: 'htmlentities\s*\(\s*\$\w+\s*[,)]'
        exclude_pattern: '(\?\?|\(string\)|strval|is_string|is_null)'
    remediation: |
      Guard terhadap null dengan null coalescing atau cast eksplisit:
        htmlspecialchars($value ?? '', ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8');
        htmlspecialchars((string) $value, ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8');
      Lebih baik gunakan helper e() Laravel yang menangani null dengan aman: e($value)
    references:
      - "https://wiki.php.net/rfc/deprecate_null_to_scalar_internal_arg"
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-P03
    title: "FILTER_SANITIZE_STRING deprecated di PHP 8.1 - silent XSS risk"
    description: >
      FILTER_SANITIZE_STRING dideprecasi di PHP 8.1. Kode yang mengandalkannya untuk mitigasi XSS secara diam-diam tidak mendapat sanitasi apapun di PHP 8.1+ tanpa error runtime, membuka kembali vektor reflected dan stored XSS.

    severity: high
    confidence: high
    category: Reflected XSS
    tags: [xss, php81, deprecated, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bFILTER_SANITIZE_(STRING|STRIPPED)\b'
    remediation: |
      Ganti dengan escaping yang sesuai konteks:
        $clean = e($input);                                          // Blade/HTML
        $clean = strip_tags($input);                                 // strip semua tag HTML
        $clean = htmlspecialchars($input ?? '', ENT_QUOTES|ENT_SUBSTITUTE, 'UTF-8');
    references:
      - "https://wiki.php.net/rfc/deprecations_php_8_1"
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-M01
    title: "Model accessor mengembalikan HTML mentah"
    description: >
      Accessor model mengembalikan nilai yang mengandung tag HTML. Ketika accessor ini dirender dengan {!! !!} di Blade atau dimasukkan ke response JSON, HTML tanpa escaping menciptakan vektor stored XSS yang dapat dicapai via setiap view atau consumer yang menggunakan accessor.

    severity: medium
    confidence: medium
    category: Stored XSS
    tags: [xss, eloquent, owasp-a03, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: model-files
        pattern: 'function\s+get\w+Attribute\s*\([^)]*\)[^{]*\{[^}]*(<[a-z]+[\s>]|<\/[a-z]+>)'
    remediation: |
      Kembalikan nilai yang di-escape dari semua accessor:
        public function getDisplayNameAttribute(): string
        {
            return e($this->first_name . ' ' . $this->last_name);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
