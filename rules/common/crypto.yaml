meta:
  category: Cryptography
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: CRY-H01
    title: "md5() digunakan untuk hashing - rentan terhadap collision"
    description: >
      md5() menghasilkan hash 128-bit dengan serangan collision yang diketahui dan tanpa salt atau work factor. Tidak cocok untuk penyimpanan password, integritas data, atau tujuan keamanan apapun. GPU cluster dapat memecahkan hash md5 dalam hitungan detik.

    severity: high
    confidence: medium
    category: Weak Hash
    tags: [crypto, weak-hash, owasp-a02, cwe-327]
    patterns:
      - type: regex
        target: php-files
        pattern: '\bmd5\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test|spec|legacy|etag|cache_key|filename)'
    remediation: |
      Untuk password: gunakan Hash::make() (bcrypt) atau password_hash() dengan PASSWORD_BCRYPT.
      Untuk integritas data: gunakan hash('sha256', ...) atau hash_hmac('sha256', ..., $key).
      Untuk checksum file: gunakan hash_file('sha256', $path).
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://www.php.net/manual/en/function.hash.php"
  - id: CRY-H02
    title: "sha1() digunakan untuk hashing yang sensitif terhadap keamanan"
    description: >
      sha1() menghasilkan hash 160-bit. SHA-1 dideprecasi oleh NIST dan IETF untuk penggunaan keamanan. Serangan collision praktis yang diketahui ada. Menggunakan sha1() untuk tanda tangan HMAC, pembuatan token, atau penyimpanan password tidak memadai.

    severity: medium
    confidence: medium
    category: Weak Hash
    tags: [crypto, weak-hash, owasp-a02, cwe-327]
    patterns:
      - type: regex
        target: php-files
        pattern: '\bsha1\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test|spec|git|legacy|uuid|oauth)'
    remediation: |
      Ganti dengan SHA-256 atau lebih kuat:
        hash('sha256', $data)
        hash_hmac('sha256', $data, $secret)
      Untuk token: gunakan Str::random(64) atau bin2hex(random_bytes(32)).
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
  - id: CRY-H03
    title: "password_hash() dipanggil dengan algoritma lemah"
    description: >
      password_hash() dipanggil dengan PASSWORD_MD5, PASSWORD_SHA1, atau PASSWORD_DEFAULT yang di-override ke algoritma lemah. Ini menghasilkan hash password yang mudah dipecahkan dengan serangan berbasis GPU.

    severity: high
    confidence: high
    category: Weak Password Hash
    tags: [crypto, password, owasp-a02, cwe-916]
    patterns:
      - type: regex
        target: php-files
        pattern: 'password_hash\s*\([^,]+,\s*(PASSWORD_MD5|PASSWORD_SHA1|0|1)\s*[,)]'
    remediation: |
      Gunakan PASSWORD_BCRYPT dengan cost - 12, atau PASSWORD_ARGON2ID:
        password_hash($password, PASSWORD_BCRYPT, ['cost' => 12]);
        password_hash($password, PASSWORD_ARGON2ID);
      Di Laravel, selalu gunakan Hash::make($password) yang menggunakan bcrypt secara default.
    references:
      - "https://cwe.mitre.org/data/definitions/916.html"
  - id: CRY-H04
    title: "base64 digunakan sebagai enkripsi atau obfuskasi"
    description: >
      base64_encode() atau base64_decode() digunakan pada nilai bernama password, secret, token, atau key. base64 adalah encoding - bukan enkripsi. Tidak menyediakan kerahasiaan apapun dan dapat dibalik secara trivial oleh siapa saja yang memeriksa nilai tersebut.

    severity: high
    confidence: high
    category: Encoding Misused as Encryption
    tags: [crypto, owasp-a02, cwe-311]
    patterns:
      - type: regex
        target: php-files
        pattern: 'base64_(encode|decode)\s*\(\s*\$\w*(password|passwd|secret|token|api_key|private_key)\w*'
    remediation: |
      Gunakan helper encrypt()/decrypt() Laravel untuk kerahasiaan:
        $encrypted = encrypt($sensitiveValue);
        $original  = decrypt($encrypted);
      Untuk penyimpanan password gunakan Hash::make() - bukan base64 atau encoding reversible.
    references:
      - "https://cwe.mitre.org/data/definitions/311.html"
  - id: CRY-R01
    title: "Fungsi random yang lemah atau dapat diprediksi untuk nilai keamanan"
    description: >
      rand(), mt_rand(), array_rand(), uniqid(), atau microtime() digunakan untuk menghasilkan nilai yang sensitif terhadap keamanan (token, password, nonce, IV, OTP). Fungsi-fungsi ini tidak aman secara kriptografi dan dapat diprediksi dengan sampel output yang cukup.

    severity: high
    confidence: medium
    category: Weak Random
    tags: [crypto, weak-random, owasp-a02, cwe-338]
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(rand|mt_rand|array_rand|uniqid|microtime)\s*\('
        exclude_pattern: '(test|Test|seed|Seed|fake|Fake|factory|Factory|//|#\s|/\*)'
    remediation: |
      Gunakan fungsi random yang aman secara kriptografi:
        $token = bin2hex(random_bytes(32));      // token hex 64 karakter
        $otp   = random_int(100000, 999999);     // OTP 6 digit
        $token = Str::random(64);               // helper Laravel (menggunakan random_bytes)
    references:
      - "https://cwe.mitre.org/data/definitions/338.html"
      - "https://www.php.net/manual/en/function.random-bytes.php"
  - id: CRY-C01
    title: "ECB mode encryption"
    description: >
      openssl_encrypt() dipanggil dengan cipher mode yang berakhiran '-ECB'. Mode ECB mengenkripsi blok plaintext identik ke blok ciphertext identik, membuat pola terlihat dalam ciphertext. Data dengan struktur berulang (record terstruktur, gambar, data terkompresi) membocorkan informasi.

    severity: high
    confidence: high
    category: Weak Cipher Mode
    tags: [crypto, ecb, owasp-a02, cwe-327]
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(encrypt|decrypt)\s*\([^,]+,[^"'']*-ECB'
    remediation: |
      Gunakan AES-256-GCM (authenticated encryption) atau AES-256-CBC dengan random IV:
        $iv        = random_bytes(openssl_cipher_iv_length('AES-256-GCM'));
        $encrypted = openssl_encrypt($data, 'AES-256-GCM', $key, 0, $iv, $tag);
      Atau gunakan helper encrypt() Laravel yang menggunakan AES-256-CBC dengan random IV.
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
  - id: CRY-C02
    title: "Algoritma cipher yang usang atau broken"
    description: >
      Cipher DES, 3DES, RC2, RC4, atau BLOWFISH digunakan untuk enkripsi. Cipher ini sudah broken (RC4), memiliki panjang kunci terlalu pendek untuk keamanan modern (DES 56-bit), atau dideprecasi oleh NIST (3DES setelah 2023).

    severity: high
    confidence: high
    category: Broken Cipher
    tags: [crypto, weak-cipher, owasp-a02, cwe-327]
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(encrypt|decrypt)\s*\([^,]+,[^"'']*\b(DES|3DES|RC2|RC4|BLOWFISH|des-|bf-|rc4)\b'
        exclude_pattern: '(AES|aes)'
    remediation: |
      Gunakan AES-256-GCM untuk enkripsi baru:
        $iv        = random_bytes(openssl_cipher_iv_length('AES-256-GCM'));
        $encrypted = openssl_encrypt($data, 'AES-256-GCM', $key, 0, $iv, $tag);
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar2.pdf"
  - id: CRY-C03
    title: "Hardcoded atau static initialization vector (IV / nonce)"
    description: >
      Variabel IV atau nonce ditetapkan dengan string hardcoded atau urutan byte. IV tetap dengan kunci yang sama mengenkripsi plaintext identik ke ciphertext identik, merusak keamanan IND-CPA dan mengaktifkan serangan block-alignment (misalnya, CBC byte-flipping).

    severity: high
    confidence: high
    category: Hardcoded IV
    tags: [crypto, owasp-a02, cwe-330]
    patterns:
      - type: regex
        target: php-files
        pattern: '\$\w*(iv|nonce|salt)\w*\s*=\s*["''][^"''\$]{8,}["'']'
        exclude_pattern: '(random|openssl_random_pseudo_bytes|random_bytes|bin2hex)'
    remediation: |
      Selalu buat IV unik yang acak untuk setiap operasi enkripsi:
        $iv        = random_bytes(openssl_cipher_iv_length('AES-256-CBC'));
        $encrypted = openssl_encrypt($data, 'AES-256-CBC', $key, 0, $iv);
        $stored    = base64_encode($iv . $encrypted);
    references:
      - "https://cwe.mitre.org/data/definitions/330.html"
  - id: CRY-T01
    title: "Perbandingan string yang tidak aman terhadap timing attack untuk secret/token"
    description: >
      Perbandingan === atau strcmp() mentah digunakan pada token, tanda tangan, atau API key. Timing side-channel membocorkan berapa banyak byte secret yang cocok, memungkinkan brute force byte-per-byte dari nilai yang diharapkan.

    severity: high
    confidence: medium
    category: Timing Attack
    tags: [crypto, timing-attack, owasp-a02, cwe-208]
    patterns:
      - type: regex
        target: php-files
        pattern: '\$\w*(token|signature|secret|hmac|digest|api_key|csrf)\w*\s*===\s*\$'
        exclude_pattern: '(hash_equals|password_verify|Hash::check)'
      - type: regex
        target: php-files
        pattern: '\bstrcmp\s*\([^)]*\$\w*(token|signature|secret|api_key|hmac)\w*'
        exclude_pattern: '(hash_equals|password_verify)'
    remediation: |
      Gunakan perbandingan constant-time untuk semua perbandingan yang sensitif keamanan:
        if (hash_equals($expectedToken, $receivedToken)) { ... }
        if (Hash::check($password, $user->password)) { ... }
    references:
      - "https://cwe.mitre.org/data/definitions/208.html"
      - "https://www.php.net/manual/en/function.hash-equals.php"

  - id: CRY-C04
    title: "Weak RSA Padding (PKCS#1 v1.5) Vulnerable to Bleichenbacher Oracle"
    description: >
      openssl_public_encrypt() atau openssl_private_decrypt() digunakan dengan OPENSSL_PKCS1_PADDING (atau padding dibiarkan ke default). PKCS1 v1.5 padding rentan terhadap serangan Bleichenbacher's Oracle, dimana penyerang dapat mendekripsi ciphertext atau memalsukan signature dengan mengamati respons error (padding oracle).
    severity: high
    confidence: high
    category: Weak Padding
    tags: [crypto, rsa, padding-oracle, owasp-a02, cwe-327]
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(public_encrypt|private_decrypt)\s*\([^,]+,\s*[^,]+,\s*[^,]+(?:,\s*OPENSSL_PKCS1_PADDING)?\s*\)'
        exclude_pattern: '(OPENSSL_PKCS1_OAEP_PADDING)'
    remediation: |
      Gunakan OAEP padding yang aman terhadapa adaptive chosen-ciphertext attacks:
      `openssl_public_encrypt($data, $encrypted, $pubKey, OPENSSL_PKCS1_OAEP_PADDING);`
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://robotattack.org/"
