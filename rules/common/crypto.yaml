meta:
  category: Cryptography
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: CRY-H02
    title: "Weak hash used for password, token, or secret derivation"
    description: >
      Passwords, reset tokens, API keys, or similar secrets are derived with
      `md5()`, `sha1()`, or `hash('md5'|'sha1', ...)`. These algorithms are too
      weak for password or security-token handling and are easy to brute-force
      at scale.
    severity: high
    confidence: high
    category: Weak Hash
    tags: [crypto, weak-hash, owasp-a02, cwe-327]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$(password|passwd|pwd|token|resetToken|reset_token|secret|apiKey|api_key|authKey|auth_key)[A-Za-z0-9_]*\s*=\s*(md5|sha1)\s*\('
      - type: regex
        target: php-files
        pattern: '\$(password|passwd|pwd|token|resetToken|reset_token|secret|apiKey|api_key|authKey|auth_key)[A-Za-z0-9_]*\s*=\s*hash\s*\(\s*["''](md5|sha1)["'']'
      - type: regex
        target: php-files
        pattern: '["''](password|passwd|pwd|token|reset_token|secret|api_key|auth_key)["'']\s*=>\s*(md5|sha1|hash\s*\(\s*["''](md5|sha1)["''])'
    remediation: |
      Use `password_hash()` / `password_verify()` for passwords and
      `random_bytes()` for tokens. Never derive long-lived secrets from MD5 or
      SHA-1.
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"

  - id: CRY-C02
    title: "Obsolete cipher or ECB mode used for encryption"
    description: >
      Encryption uses DES, 3DES, RC2, RC4, Blowfish, or AES-ECB mode. These
      ciphers and modes are obsolete or unsafe for modern application security.
    severity: high
    confidence: high
    category: Broken Cipher
    tags: [crypto, weak-cipher, owasp-a02, cwe-327]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(encrypt|decrypt)\s*\([^,]+,\s*["''](DES|3DES|RC2|RC4|BLOWFISH|AES-128-ECB|AES-192-ECB|AES-256-ECB|des-[^"'']*|bf-[^"'']*|rc4)[^"'']*["'']'
    remediation: |
      Use authenticated encryption such as AES-256-GCM or ChaCha20-Poly1305.
      Avoid ECB mode entirely and retire legacy cipher suites.
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar2.pdf"

  - id: CRY-C03
    title: "Hardcoded initialization vector, nonce, or salt"
    description: >
      IV, nonce, or salt values are assigned from hardcoded literals instead of
      generated randomness. Reusing fixed values breaks key cryptographic
      security properties and can expose plaintext relationships.
    severity: high
    confidence: high
    category: Hardcoded IV
    tags: [crypto, owasp-a02, cwe-330]
    owasp: "A02:2021"
    cwe: "CWE-330"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$(iv|nonce|salt)[A-Za-z0-9_]*\s*=\s*["''][^"''\$]{8,}["'']'
        exclude_pattern: '(random|openssl_random_pseudo_bytes|random_bytes|bin2hex|base64_decode\s*\()'
    remediation: |
      Generate fresh random IV or nonce values for every encryption operation
      with `random_bytes()` or an equivalent CSPRNG-backed API.
    references:
      - "https://cwe.mitre.org/data/definitions/330.html"

  - id: CRY-C04
    title: "Weak RSA padding with PKCS#1 v1.5"
    description: >
      RSA encryption or decryption uses PKCS#1 v1.5 padding, which is vulnerable
      to padding-oracle style attacks and should be replaced for new designs.
    severity: high
    confidence: high
    category: Weak Padding
    tags: [crypto, rsa, padding-oracle, owasp-a02, cwe-327]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(public_encrypt|private_decrypt)\s*\([^,]+,\s*[^,]+,\s*[^,]+(?:,\s*OPENSSL_PKCS1_PADDING)?\s*\)'
        exclude_pattern: '(OPENSSL_PKCS1_OAEP_PADDING)'
    remediation: |
      Use OAEP padding for encryption and modern signature schemes instead of
      PKCS#1 v1.5 where compatibility requirements do not force legacy behavior.
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://robotattack.org/"
