meta:
  category: Cryptography
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: CRY-H02
    title: "sha1() used for security-sensitive hashing"
    description: >
      sha1() produces a 160-bit hash. SHA-1 is deprecated by NIST and IETF for security use. Known practical collision attacks exist. Using sha1() for HMAC signatures, token generation, or password storage is inadequate.

    severity: medium
    confidence: medium
    category: Weak Hash
    tags: [crypto, weak-hash, owasp-a02, cwe-327]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bsha1\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test|spec|git|legacy|uuid|oauth)'
    remediation: |
      Replace with SHA-256 or stronger:
        hash('sha256', $data)
        hash_hmac('sha256', $data, $secret)
      For tokens: use Str::random(64) or bin2hex(random_bytes(32)).
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
  - id: CRY-C02
    title: "Obsolete or broken cipher algorithms"
    description: >
      DES, 3DES, RC2, RC4, or BLOWFISH ciphers are used for encryption. These ciphers are broken (RC4), have key lengths too short for modern security (DES 56-bit), or are deprecated by NIST (3DES after 2023).

    severity: high
    confidence: high
    category: Broken Cipher
    tags: [crypto, weak-cipher, owasp-a02, cwe-327]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(encrypt|decrypt)\s*\([^,]+,[^"'']*\b(DES|3DES|RC2|RC4|BLOWFISH|des-|bf-|rc4)\b'
        exclude_pattern: '(AES|aes)'
    remediation: |
      Use AES-256-GCM for new encryption:
        $iv        = random_bytes(openssl_cipher_iv_length('AES-256-GCM'));
        $encrypted = openssl_encrypt($data, 'AES-256-GCM', $key, 0, $iv, $tag);
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar2.pdf"
  - id: CRY-C03
    title: "Hardcoded or static initialization vector (IV / nonce)"
    description: >
      The IV or nonce variable is assigned a hardcoded string or byte sequence. A fixed IV with the same key encrypts identical plaintext to identical ciphertext, breaking IND-CPA security and enabling block-alignment attacks (e.g., CBC byte-flipping).

    severity: high
    confidence: high
    category: Hardcoded IV
    tags: [crypto, owasp-a02, cwe-330]
    owasp: "A02:2021"
    cwe: "CWE-330"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$\w*(iv|nonce|salt)\w*\s*=\s*["''][^"''\$]{8,}["'']'
        exclude_pattern: '(random|openssl_random_pseudo_bytes|random_bytes|bin2hex)'
    remediation: |
      Always create an unique random IV for each encryption operation:
        $iv        = random_bytes(openssl_cipher_iv_length('AES-256-CBC'));
        $encrypted = openssl_encrypt($data, 'AES-256-CBC', $key, 0, $iv);
        $stored    = base64_encode($iv . $encrypted);
    references:
      - "https://cwe.mitre.org/data/definitions/330.html"

  - id: CRY-C04
    title: "Weak RSA Padding (PKCS#1 v1.5) Vulnerable to Bleichenbacher Oracle"
    description: >
      openssl_public_encrypt() or openssl_private_decrypt() is used with OPENSSL_PKCS1_PADDING (or padding is left at default). PKCS1 v1.5 padding is vulnerable to Bleichenbacher's Oracle attacks, where an attacker can decrypt ciphertext or forge signatures by observing error responses (padding oracle).
    severity: high
    confidence: high
    category: Weak Padding
    tags: [crypto, rsa, padding-oracle, owasp-a02, cwe-327]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(public_encrypt|private_decrypt)\s*\([^,]+,\s*[^,]+,\s*[^,]+(?:,\s*OPENSSL_PKCS1_PADDING)?\s*\)'
        exclude_pattern: '(OPENSSL_PKCS1_OAEP_PADDING)'
    remediation: |
      Use secure OAEP padding to prevent adaptive chosen-ciphertext attacks:
      `openssl_public_encrypt($data, $encrypted, $pubKey, OPENSSL_PKCS1_OAEP_PADDING);`
    references:
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://robotattack.org/"
