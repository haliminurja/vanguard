meta:
  category: Advanced Attack Vectors
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: ADV-PT03
    title: "Zip Slip - ZIP extraction without output path validation"
    description: >
      ZipArchive::extractTo() or similar extraction functions are used without validating the path of each entry against the target directory. A crafted ZIP file can contain entries with path traversal (../../etc/cron.d/backdoor) that write files outside the intended extraction directory, allowing remote code execution, privilege escalation, or persistence.

    severity: critical
    confidence: high
    category: Zip Slip
    tags: [file-upload, path-traversal, zip-slip, owasp-a01, cwe-22]
    owasp: "A01:2021"
    cwe: "CWE-22"
    patterns:
      - type: regex
        target: php-files
        pattern: '(ZipArchive|zip_open|->extractTo)\s*\('
        exclude_pattern: '(realpath|str_starts_with|basename|sanitize|validate|checkEntry)'
    remediation: |
      Validate each entry before extraction. Reject the entire archive if any
      entry is suspicious:

        function safeExtract(string $zipPath, string $destDir): void
        {
            $zip     = new ZipArchive;
            $destDir = rtrim(realpath($destDir), DIRECTORY_SEPARATOR) . DIRECTORY_SEPARATOR;

            if ($zip->open($zipPath) !== true) {
                throw new RuntimeException('Failed to open ZIP');
            }

            for ($i = 0; $i < $zip->numFiles; $i++) {
                $entry    = $zip->getNameIndex($i);
                $fullPath = realpath($destDir . $entry) ?: ($destDir . $entry);

                if (!str_starts_with($fullPath, $destDir)) {
                    $zip->close();
                    throw new SecurityException("Zip Slip detected: {$entry}");
                }
            }

            $zip->extractTo($destDir);
            $zip->close();
        }
    references:
      - "https://cwe.mitre.org/data/definitions/22.html"
      - "https://snyk.io/research/zip-slip-vulnerability"
  - id: ADV-XXE01
    title: "XXE - XML parsed from user-supplied content"
    description: >
      simplexml_load_string(), DOMDocument::loadXML(), or XMLReader accept XML from users without disabling external entity loading. Attackers can read local files (/etc/passwd, /proc/self/environ, .env), perform SSRF to internal services, or cause a denial of service (Billion Laughs / Quadratic Blowup attack).

    severity: critical
    confidence: high
    category: XXE
    tags: [xxe, owasp-a05, cwe-611, ssrf]
    owasp: "A05:2021"
    cwe: "CWE-611"
    patterns:
      - type: regex
        target: php-files
        pattern: '(simplexml_load_string|simplexml_load_file|loadXML|DOMDocument)\s*\(\s*(\$request->|request\(|\$_POST|\$_GET)'
      - type: regex
        target: php-files
        pattern: 'simplexml_load_string\s*\('
        exclude_pattern: '(LIBXML_NONET|libxml_disable_entity_loader|LIBXML_NOENT\s*=\s*false|libxml_use_internal_errors)'
      - type: regex
        target: php-files
        pattern: 'new\s+DOMDocument\s*\([^)]*\)'
        exclude_pattern: '(LIBXML_NONET|libxml_disable_entity_loader|preserveWhiteSpace)'
    remediation: |
      In PHP 8.0+ with libxml2 >= 2.9, external entities are disabled by default.
      For older versions, disable them explicitly:

        // PHP < 8.0 - disable external entity loader
        $prev = libxml_disable_entity_loader(true);
        $prev_errors = libxml_use_internal_errors(true);

        $xml = simplexml_load_string(
            $input,
            'SimpleXMLElement',
            LIBXML_NONET | LIBXML_NOERR   // No network, no error messages
        );

        libxml_disable_entity_loader($prev);
        libxml_use_internal_errors($prev_errors);

        // Never use LIBXML_NOENT (recursive entity) or
        // LIBXML_DTDLOAD (load external DTD) with untrusted input
    references:
      - "https://cwe.mitre.org/data/definitions/611.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"
  - id: ADV-ID01
    title: "IDOR - Model::update() with unfiltered request payload"
    description: >
      update() is called with $request->all() without first authorizing that the authenticated user owns that record. Attackers change the resource ID in the URL or request body to overwrite other users' data - this pattern is one of the most common IDOR vulnerabilities.

    severity: high
    confidence: high
    category: IDOR
    tags: [idor, owasp-a01, cwe-639]
    owasp: "A01:2021"
    cwe: "CWE-639"
    patterns:
      - type: regex
        target: php-files
        pattern: '->update\(\s*(\$request->all\(\)|request\(\)->all\(\))'
    remediation: |
      Always authorize ownership before updating, use ->only() for
      strict field limitations:

        // - CORRECT
        $post = Post::findOrFail($id);
        $this->authorize('update', $post);  // Policy verifies $user->id === $post->user_id
        $post->update($request->only(['title', 'body', 'category_id']));

        // - INCORRECT
        // Post::findOrFail($id)->update($request->all());
    references:
      - "https://cwe.mitre.org/data/definitions/639.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html"
