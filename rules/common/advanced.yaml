meta:
  category: Advanced Attack Vectors
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: ADV-SSRF01
    title: "SSRF — HTTP request keluar dengan URL dari input pengguna"
    description: >
      Laravel Http facade, Guzzle, atau cURL membuat request keluar menggunakan URL yang diambil langsung dari input pengguna tanpa validasi allowlist. Penyerang dapat mencapai layanan internal (Redis, RDS, metadata EC2 169.254.169.254), melakukan port scanning jaringan internal, membypass firewall, atau menyalahgunakan kredensial IAM dari instance metadata AWS. SSRF termasuk OWASP Top 10 #10 (A10:2021).

    severity: critical
    confidence: high
    category: SSRF
    tags: [ssrf, owasp-a10, cwe-918, cloud-metadata]
    cwe: "CWE-918"
    owasp: "A10:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Http::(get|post|put|patch|delete|head|send|pool|async)\s*\(\s*(\$request->|request\()'
      - type: regex
        target: php-files
        pattern: 'curl_setopt\s*\([^,]+,\s*CURLOPT_URL\s*,\s*\$'
        exclude_pattern: '(config\(|env\(|allowedHosts|parse_url)'
      - type: regex
        target: php-files
        pattern: '(new GuzzleHttp\\\\Client|new Client)\s*\(\s*\)\s*->(get|post|request)\s*\(\s*\$'
        exclude_pattern: 'config\('
      - type: regex
        target: php-files
        pattern: 'file_get_contents\s*\(\s*(\$request->|request\(|\$_GET|\$_POST)'
        exclude_pattern: '(FILTER_VALIDATE_URL|parse_url|allowedHosts)'
    remediation: |
      Validasi semua URL keluar terhadap allowlist host yang ketat.
      Blokir IP private, loopback, dan link-local:

        use Illuminate\Support\Facades\Http;

        $url    = $request->input('url');
        $parsed = parse_url($url);

        // 1. Validasi skema — hanya HTTPS
        abort_unless(in_array($parsed['scheme'] ?? '', ['https'], true), 422, 'Skema tidak diizinkan');

        // 2. Allowlist host eksplisit
        $allowedHosts = config('services.allowed_webhook_hosts', []);
        abort_unless(in_array($parsed['host'] ?? '', $allowedHosts, true), 422, 'Host tidak diizinkan');

        // 3. Resolusi DNS dan blokir IP private/loopback/cloud-metadata
        $ip = gethostbyname($parsed['host']);
        $flags = FILTER_FLAG_NO_PRIV_RANGE | FILTER_FLAG_NO_RES_RANGE;
        abort_if(
            filter_var($ip, FILTER_VALIDATE_IP, $flags) === false ||
            $ip === '169.254.169.254',  // AWS/GCP metadata
            422, 'IP tidak diizinkan'
        );

        $response = Http::timeout(5)->get($url);
    references:
      - "https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_(SSRF)/"
      - "https://cwe.mitre.org/data/definitions/918.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"
  - id: ADV-SSRF02
    title: "SSRF — file_get_contents() dengan URL dari pengguna"
    description: >
      file_get_contents() dipanggil dengan URL yang dikontrol pengguna dan allow_url_fopen aktif. Ini memungkinkan SSRF melalui HTTP wrapper dan eksposure resource internal seperti metadata cloud (169.254.169.254) atau layanan internal yang tidak terekspos ke internet.

    severity: critical
    confidence: high
    category: SSRF
    tags: [ssrf, owasp-a10, cwe-918]
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: php-files
        pattern: 'file_get_contents\s*\(\s*\$\w*(url|link|endpoint|webhook|callback|uri|src)\w*'
        exclude_pattern: '(FILTER_VALIDATE_URL|parse_url|allowedHost|storage_path|resource_path)'
    remediation: |
      Gunakan Http facade Laravel dengan timeout dan validasi host dibanding
      file_get_contents() untuk URL eksternal:
        $response = Http::timeout(5)->get($validatedUrl);
    references:
      - "https://cwe.mitre.org/data/definitions/918.html"
  - id: ADV-PT01
    title: "Path Traversal — operasi file dengan path dari input pengguna"
    description: >
      Operasi file system (Storage, file_get_contents, fopen, readfile) menerima path yang berasal dari input pengguna tanpa sanitasi atau validasi realpath. Penyerang menggunakan sekuens ../ (atau URL-encoded %2e%2e%2f) untuk membaca file sensitif: .env, storage/oauth-private.key, config/*.php, private key, database backup.

    severity: critical
    confidence: high
    category: Path Traversal
    tags: [lfi, path-traversal, owasp-a01, cwe-22]
    cwe: "CWE-22"
    owasp: "A01:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '(Storage::(get|download|delete|exists|url|put)|file_get_contents|readfile|fopen)\s*\(\s*(\$request->|request\(|\$_GET|\$_POST)'
      - type: regex
        target: php-files
        pattern: '(include|require|include_once|require_once)\s*\(\s*(\$request->|request\(|\$_GET|\$_POST)'
    remediation: |
      Jangan pernah menggunakan input pengguna langsung sebagai path file.
      Gunakan whitelist ID → path:

        // ✅ BENAR — lookup berdasarkan ID yang trusted
        $file = UserFile::findOrFail($request->input('file_id'));
        $this->authorize('download', $file);
        return Storage::download($file->storage_path, $file->original_name);

        // ✅ Jika path diperlukan, validasi dengan realpath
        $base = realpath(storage_path('app/uploads')) . DIRECTORY_SEPARATOR;
        $path = realpath($base . basename($request->input('filename')));
        abort_unless($path && str_starts_with($path, $base), 403, 'Akses ditolak');
    references:
      - "https://cwe.mitre.org/data/definitions/22.html"
      - "https://owasp.org/www-community/attacks/Path_Traversal"
  - id: ADV-PT02
    title: "Path Traversal — response()->download() dengan path dari pengguna"
    description: >
      response()->download() atau Storage::download() dipanggil dengan path yang berasal langsung dari input request. Penyerang menggunakan sekuens ../ untuk mengunduh file .env, private key, database backup, atau kode sumber aplikasi dari disk server.

    severity: critical
    confidence: high
    category: Path Traversal
    tags: [lfi, path-traversal, owasp-a01, cwe-22, laravel]
    cwe: "CWE-22"
    patterns:
      - type: regex
        target: php-files
        pattern: '(response\(\)->download|Storage::download)\s*\(\s*\$(_GET|_POST|_REQUEST|request)'
    remediation: |
      Lookup path server-side dari record yang sudah diotorisasi:
        $attachment = Attachment::findOrFail($request->input('id'));
        $this->authorize('download', $attachment);
        return Storage::download($attachment->path, $attachment->original_filename);
    references:
      - "https://cwe.mitre.org/data/definitions/22.html"
  - id: ADV-PT03
    title: "Zip Slip — ekstraksi ZIP tanpa validasi path output"
    description: >
      ZipArchive::extractTo() atau fungsi ekstraksi serupa digunakan tanpa memvalidasi path setiap entri terhadap direktori target. File ZIP yang dikrafting dapat berisi entri dengan path traversal (../../etc/cron.d/backdoor) yang menulis file di luar direktori ekstraksi yang dimaksud, memungkinkan remote code execution, privilege escalation, atau persistensi.

    severity: critical
    confidence: high
    category: Zip Slip
    tags: [file-upload, path-traversal, zip-slip, owasp-a01, cwe-22]
    cwe: "CWE-22"
    patterns:
      - type: regex
        target: php-files
        pattern: '(ZipArchive|zip_open|->extractTo)\s*\('
        exclude_pattern: '(realpath|str_starts_with|basename|sanitize|validate|checkEntry)'
    remediation: |
      Validasi setiap entri sebelum ekstraksi. Tolak seluruh archive jika ada
      satu entri yang mencurigakan:

        function safeExtract(string $zipPath, string $destDir): void
        {
            $zip     = new ZipArchive;
            $destDir = rtrim(realpath($destDir), DIRECTORY_SEPARATOR) . DIRECTORY_SEPARATOR;

            if ($zip->open($zipPath) !== true) {
                throw new RuntimeException('Gagal membuka ZIP');
            }

            for ($i = 0; $i < $zip->numFiles; $i++) {
                $entry    = $zip->getNameIndex($i);
                $fullPath = realpath($destDir . $entry) ?: ($destDir . $entry);

                if (!str_starts_with($fullPath, $destDir)) {
                    $zip->close();
                    throw new SecurityException("Zip Slip terdeteksi: {$entry}");
                }
            }

            $zip->extractTo($destDir);
            $zip->close();
        }
    references:
      - "https://cwe.mitre.org/data/definitions/22.html"
      - "https://snyk.io/research/zip-slip-vulnerability"
  - id: ADV-OR01
    title: "Open Redirect — target redirect dari input pengguna"
    description: >
      Aplikasi mengalihkan pengguna ke URL dari request input tanpa validasi. Penyerang membuat link phishing yang tampak berasal dari domain tepercaya Anda (https://yourapp.com/redirect?to=https://evil.com) untuk credential harvesting, session hijacking, atau distribusi malware. Serangan ini sangat efektif karena URL awal terlihat legitimate.

    severity: high
    confidence: high
    category: Open Redirect
    tags: [open-redirect, owasp-a01, cwe-601, phishing]
    cwe: "CWE-601"
    patterns:
      - type: regex
        target: php-files
        pattern: 'redirect\(\s*\)->(to|away)\(\s*(\$request->|request\()'
      - type: regex
        target: php-files
        pattern: 'Redirect::(to|away)\(\s*(\$request->|request\()'
      - type: regex
        target: php-files
        pattern: 'header\s*\(\s*["'']Location:\s*["'']?\s*\.?\s*\$(_GET|_POST|_REQUEST|request)'
      - type: regex
        target: php-files
        pattern: 'return\s+redirect\(\s*\$request->input\s*\(\s*["''](redirect|return_url|next|url|goto|back)["'']\s*\)'
        exclude_pattern: '(Str::startsWith|parse_url|filter_var|allowedDomains|intended)'
    remediation: |
      Hanya redirect ke path relatif internal. Tolak URL absolut atau
      validasi terhadap allowlist domain eksplisit:

        $destination = $request->input('redirect', '/dashboard');

        // Cegah protocol-relative URL (//evil.com) dan absolute URL
        $isRelativePath = preg_match('#^/[^/\\\\]#', $destination) === 1;
        abort_unless($isRelativePath, 422, 'Redirect tidak valid');

        return redirect($destination);

        // Alternatif aman: gunakan ->intended() bawaan Laravel
        return redirect()->intended('/dashboard');
    references:
      - "https://cwe.mitre.org/data/definitions/601.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Unvalidated_Redirects_and_Forwards_Cheat_Sheet.html"
  - id: ADV-XXE01
    title: "XXE — XML di-parse dari konten yang dikirim pengguna"
    description: >
      simplexml_load_string(), DOMDocument::loadXML(), atau XMLReader menerima XML dari pengguna tanpa menonaktifkan pemuatan external entity. Penyerang dapat membaca file lokal (/etc/passwd, /proc/self/environ, .env), melakukan SSRF ke layanan internal, atau menyebabkan denial of service (Billion Laughs / Quadratic Blowup attack).

    severity: critical
    confidence: high
    category: XXE
    tags: [xxe, owasp-a05, cwe-611, ssrf]
    cwe: "CWE-611"
    patterns:
      - type: regex
        target: php-files
        pattern: '(simplexml_load_string|simplexml_load_file|loadXML|DOMDocument)\s*\(\s*(\$request->|request\(|\$_POST|\$_GET)'
      - type: regex
        target: php-files
        pattern: 'simplexml_load_string\s*\('
        exclude_pattern: '(LIBXML_NONET|libxml_disable_entity_loader|LIBXML_NOENT\s*=\s*false|libxml_use_internal_errors)'
      - type: regex
        target: php-files
        pattern: 'new\s+DOMDocument\s*\([^)]*\)'
        exclude_pattern: '(LIBXML_NONET|libxml_disable_entity_loader|preserveWhiteSpace)'
    remediation: |
      Di PHP 8.0+ dengan libxml2 >= 2.9, external entity dinonaktifkan secara default.
      Untuk versi lama, nonaktifkan secara eksplisit:

        // PHP < 8.0 — nonaktifkan external entity loader
        $prev = libxml_disable_entity_loader(true);
        $prev_errors = libxml_use_internal_errors(true);

        $xml = simplexml_load_string(
            $input,
            'SimpleXMLElement',
            LIBXML_NONET | LIBXML_NOERR   // Tidak ada network, tidak ada error message
        );

        libxml_disable_entity_loader($prev);
        libxml_use_internal_errors($prev_errors);

        // Jangan pernah gunakan LIBXML_NOENT (merekurs entity) atau
        // LIBXML_DTDLOAD (memuat DTD eksternal) dengan input tidak tepercaya
    references:
      - "https://cwe.mitre.org/data/definitions/611.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html"
  - id: ADV-ID01
    title: "IDOR — Model::update() dengan payload request tidak difilter"
    description: >
      update() dipanggil dengan $request->all() tanpa terlebih dahulu mengotorisasi bahwa pengguna yang terautentikasi memiliki record tersebut. Penyerang mengubah resource ID dalam URL atau request body untuk menimpa data pengguna lain — pola ini adalah salah satu kerentanan IDOR yang paling umum.

    severity: high
    confidence: high
    category: IDOR
    tags: [idor, owasp-a01, cwe-639]
    cwe: "CWE-639"
    patterns:
      - type: regex
        target: php-files
        pattern: '->update\(\s*(\$request->all\(\)|request\(\)->all\(\))'
    remediation: |
      Selalu otorisasi kepemilikan sebelum update, gunakan ->only() untuk
      batasan field yang ketat:

        // ✅ BENAR
        $post = Post::findOrFail($id);
        $this->authorize('update', $post);  // Policy memverifikasi $user->id === $post->user_id
        $post->update($request->only(['title', 'body', 'category_id']));

        // ❌ SALAH
        // Post::findOrFail($id)->update($request->all());
    references:
      - "https://cwe.mitre.org/data/definitions/639.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html"
  - id: ADV-VJ01
    title: "Type Juggling — loose comparison pada nilai sensitif keamanan"
    description: >
      Operator persamaan loose (==) membandingkan hash, token, atau key. PHP type juggling menyebabkan '0e123' == '0e456' (magic hash collision — keduanya dievaluasi sebagai 0 dalam notasi saintifik), yang memungkinkan bypass autentikasi token atau verifikasi hash. Kerentanan ini klasik dan sering terlewat di code review.

    severity: high
    confidence: medium
    category: Type Juggling
    tags: [type-juggling, owasp-a07, cwe-697, auth-bypass]
    cwe: "CWE-697"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$\w*(hash|token|api_key|secret|signature|digest|hmac|otp|pin)\w*\s*(==|!=)\s*'
        exclude_pattern: '(===|!==|hash_equals|password_verify|Hash::check)'
    remediation: |
      Gunakan perbandingan constant-time untuk semua token dan hash.
      JANGAN gunakan == atau !=:

        // ✅ BENAR — constant-time, mencegah timing attack dan type juggling
        if (hash_equals($expectedToken, $receivedToken)) { ... }
        if (Hash::check($password, $user->password)) { ... }

        // ❌ SALAH — rentan terhadap timing attack dan magic hash
        // if ($token == $userToken) { ... }
    references:
      - "https://cwe.mitre.org/data/definitions/697.html"
      - "https://owasp.org/www-pdf-archive/PHPMagicTricks-TypeJuggling.pdf"
  - id: ADV-MA01
    title: "Model::unguard() menonaktifkan proteksi mass assignment secara global"
    description: >
      Model::unguard() menonaktifkan proteksi mass assignment untuk SEMUA model Eloquent dalam proses yang sedang berjalan. Memanggil ini dalam kode request-handling (controller, middleware, job, listener) berarti setiap Model::create() atau update() berikutnya menerima field arbitrer dari pengguna — termasuk is_admin, role, email_verified_at, password.

    severity: critical
    confidence: high
    category: Mass Assignment
    tags: [mass-assignment, owasp-a04, cwe-915, laravel]
    cwe: "CWE-915"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Model::(unguard|unguarded)\s*\('
        exclude_pattern: '(seed|Seed|test|Test|factory|Factory|tinker|DatabaseSeeder)'
    remediation: |
      Jangan pernah memanggil Model::unguard() dalam kode request-handling.
      Dalam seeder, gunakan blok terbatas dengan re-guard segera:

        // ✅ Di seeder saja
        Model::unguard();
        User::create(['email' => 'admin@example.com', 'is_admin' => true]);
        Model::reguard();  // ← WAJIB segera setelah blok seed

        // ✅ Alternatif — gunakan forceCreate() per-model
        User::forceCreate(['email' => 'admin@example.com']);
    references:
      - "https://cwe.mitre.org/data/definitions/915.html"
  - id: ADV-MA02
    title: "Model dengan $guarded = [] — mass assignment sepenuhnya dinonaktifkan"
    description: >
      Model mendefinisikan $guarded = [] yang mengizinkan SETIAP atribut diset via Model::create() atau Model::update(). Input yang dikendalikan penyerang dapat mengeset is_admin, role, email_verified_at, balance, dan field terproteksi lainnya jika controller menggunakan $request->all() atau fill($request->all()).

    severity: critical
    confidence: high
    category: Mass Assignment
    tags: [eloquent, mass-assignment, owasp-a04, cwe-915]
    cwe: "CWE-915"
    patterns:
      - type: regex
        target: model-files
        pattern: 'protected\s+\$guarded\s*=\s*\[\s*\]'
        exclude_pattern: '(seed|Seed|test|Test|factory|Factory)'
    remediation: |
      Gunakan whitelist $fillable eksplisit untuk setiap model:

        // ✅ BENAR — hanya field yang boleh diisi pengguna
        protected $fillable = ['name', 'email', 'bio', 'avatar'];

        // ✅ Atau proteksi field sensitif secara eksplisit
        protected $guarded = ['id', 'is_admin', 'role', 'email_verified_at',
                              'password', 'remember_token', 'balance'];
    references:
      - "https://cwe.mitre.org/data/definitions/915.html"
      - "https://laravel.com/docs/eloquent#mass-assignment"
  - id: ADV-WS01
    title: "Laravel Reverb/Broadcasting — channel private tanpa verifikasi kepemilikan"
    description: >
      Channel Reverb (Laravel 11+) atau Pusher private/presence didefinisikan tanpa autentikasi channel yang memverifikasi kepemilikan pengguna. Subscription channel yang tidak terautentikasi mengekspos data real-time sensitif (pesan, notifikasi, update order, status pembayaran) ke subscriber yang tidak berwenang.

    severity: high
    confidence: medium
    category: Authorization
    tags: [reverb, websocket, laravel11, owasp-a01, cwe-863, broadcasting]
    cwe: "CWE-863"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Broadcast::channel\s*\(\s*["'']private-'
        exclude_pattern: '(\$user->id\s*===|\$user->id\s*==|->is\(|->belongsTo|return\s+\$user->|find\()'
    remediation: |
      Selalu verifikasi kepemilikan di callback channel private dan
      kembalikan false (bukan null) jika akses ditolak:

        // ✅ BENAR
        Broadcast::channel('private-orders.{orderId}', function ($user, $orderId) {
            $order = Order::find($orderId);
            return $order && $user->id === $order->user_id;
        });

        // Untuk presence channel
        Broadcast::channel('presence-chat.{roomId}', function ($user, $roomId) {
            $room = ChatRoom::find($roomId);
            if (!$room || !$room->members()->where('user_id', $user->id)->exists()) {
                return false;
            }
            return ['id' => $user->id, 'name' => $user->name];
        });
    references:
      - "https://laravel.com/docs/broadcasting#authorizing-channels"
      - "https://cwe.mitre.org/data/definitions/863.html"
  - id: ADV-CSRF01
    title: "Form Blade tanpa direktif @csrf"
    description: >
      Template Blade mengandung elemen <form> dengan method non-GET tetapi tidak menyertakan direktif @csrf. Tanpa token CSRF, setiap website pihak ketiga dapat membuat form yang secara diam-diam mengirimkan request ke aplikasi Anda atas nama pengguna yang sedang login, memungkinkan perubahan data, transfer dana, atau penghapusan akun.

    severity: high
    confidence: high
    category: CSRF
    tags: [csrf, laravel, owasp-a05, cwe-352, blade]
    cwe: "CWE-352"
    condition: all
    patterns:
      - type: regex
        target: blade-files
        pattern: '<form[^>]+method\s*=\s*["'']?(POST|PUT|PATCH|DELETE)[^>]*>'
      - type: contains
        target: blade-files
        pattern: "@csrf"
        negative: true
    remediation: |
      Tambahkan @csrf sebagai elemen pertama di dalam setiap form non-GET:

        <form method="POST" action="{{ route('orders.store') }}">
            @csrf
            @method('POST')
            {{-- input fields --}}
        </form>

        {{-- Untuk AJAX, kirimkan token via header --}}
        <meta name="csrf-token" content="{{ csrf_token() }}">
        // JavaScript: axios.defaults.headers.common['X-CSRF-TOKEN'] = token;
    references:
      - "https://owasp.org/www-community/attacks/csrf"
      - "https://laravel.com/docs/csrf"
      - "https://cwe.mitre.org/data/definitions/352.html"
  - id: ADV-SSTI01
    title: "SSTI — nama view/template dari input pengguna"
    description: >
      view() atau View::make() me-resolve template menggunakan nama yang berasal langsung dari input pengguna. Penyerang dapat me-load template admin, mengekspos data konfigurasi sensitif, atau mengeksekusi kode PHP arbitrer via direktif @php yang ada di template target.

    severity: critical
    confidence: high
    category: SSTI
    tags: [ssti, owasp-a03, cwe-94, blade]
    cwe: "CWE-94"
    patterns:
      - type: regex
        target: php-files
        pattern: '(View::make|view)\(\s*(\$request->|request\(|\$_GET|\$_POST)'
    remediation: |
      Gunakan whitelist map yang ketat — jangan pernah teruskan input pengguna
      langsung ke view():

        $viewMap = [
            'home'    => 'pages.home',
            'about'   => 'pages.about',
            'contact' => 'pages.contact',
        ];

        $viewName = $viewMap[$request->input('page')] ?? null;
        abort_unless($viewName, 404);
        return view($viewName, $data);
    references:
      - "https://cwe.mitre.org/data/definitions/94.html"
  - id: ADV-DBG01
    title: "Kode debug (dd, dump, var_dump) tertinggal dalam kode production"
    description: >
      Pemanggilan dd(), dump(), atau var_dump() yang tertinggal dapat mengekspos data sensitif (payload request, record database, konfigurasi, nilai environment, state autentikasi) langsung ke browser setiap pengguna yang memicu code path tersebut. dd() juga menghentikan eksekusi request yang dapat menyebabkan DoS.

    severity: high
    confidence: high
    category: Debug Exposure
    tags: [debug, info-disclosure, owasp-a05, cwe-215, laravel]
    cwe: "CWE-215"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(dd|dump|var_dump|print_r|var_export)\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test|spec|hexdump|mysqldump|mongodump|pg_dump)'
      - type: regex
        target: blade-files
        pattern: '@(dd|dump)\s*\('
    remediation: |
      Hapus semua panggilan debug sebelum commit/deploy.
      Gunakan structured logging atau Laravel Telescope:

        // ✅ Gunakan logging terstruktur
        Log::debug('Order state', ['order_id' => $order->id, 'status' => $order->status]);

        // ✅ Gunakan Laravel Telescope untuk debugging development
        // telescope.laravel.com
    references:
      - "https://cwe.mitre.org/data/definitions/215.html"
  - id: ADV-DBG02
    title: "APP_DEBUG=true aktif (produksi atau staging)"
    description: >
      APP_DEBUG=true memaparkan stack trace lengkap, query database, nilai environment variable, konfigurasi PHP, dan nama kelas internal kepada semua pengguna yang memicu exception. Satu eksposur ini dapat memberikan penyerang informasi yang cukup untuk merencanakan serangan targeted.

    severity: critical
    confidence: high
    category: Configuration
    tags: [debug, config, owasp-a05, cwe-200, laravel]
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: env-files
        pattern: '^APP_DEBUG\s*=\s*true'
    remediation: |
      Set APP_DEBUG=false di SEMUA environment non-development:

        # .env.production
        APP_DEBUG=false

        # Pantau error dengan tools yang aman
        # - Laravel Telescope (development only, tidak di production)
        # - Flare: flareapp.io
        # - Sentry: sentry.io
        # - Bugsnag: bugsnag.com
    references:
      - "https://laravel.com/docs/configuration#debug-mode"
      - "https://cwe.mitre.org/data/definitions/200.html"
  - id: ADV-EVAL01
    title: "RCE — eval() atau fungsi exec dengan argumen dari input pengguna"
    description: >
      eval(), exec(), passthru(), system(), shell_exec(), atau proc_open() dipanggil dengan argumen yang berasal dari request atau variabel tidak tepercaya. Ini adalah kategori kerentanan paling serius — penyerang dapat mengeksekusi perintah OS arbitrer atau kode PHP di server.

    severity: critical
    confidence: high
    category: RCE
    tags: [rce, eval, cmd-injection, owasp-a03, cwe-94, cwe-78]
    cwe: "CWE-94"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(eval|exec|passthru|system|shell_exec)\s*\(.*(\$request->|\$_GET|\$_POST|request\()'
        exclude_pattern: '(escapeshellarg|escapeshellcmd)'
    remediation: |
      Hindari semua fungsi exec/eval dengan input pengguna.
      Gunakan Symfony Process dengan array (tidak ada shell interpolation):

        // ✅ BENAR — array argument, tidak ada shell
        $process = new Process(['convert', '-resize', '800x', $inputPath, $outputPath]);
        $process->setTimeout(30)->mustRun();

        // ❌ SALAH
        // exec("convert {$request->input('file')} output.jpg");
    references:
      - "https://cwe.mitre.org/data/definitions/94.html"
      - "https://cwe.mitre.org/data/definitions/78.html"
