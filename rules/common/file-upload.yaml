meta:
  category: File Upload Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: UPL-001
    title: "File Stored in Public Directory Without Validation"
    description: >
      Uploaded files are stored directly in the public directory without apparent validation. Files in public/ can be accessed directly via the web server, which can lead to the serving of malicious content or executable scripts.

    severity: high
    confidence: medium
    category: Unrestricted Upload
    tags: [file-upload, owasp-a04, cwe-434]
    owasp: "A04:2021"
    cwe: "CWE-434"
    patterns:
      - type: regex
        target: php-files
        pattern: '(storeAs|move|store)\s*\(\s*["'']?public'
        exclude_pattern: '(validate|mimes|mime_type|extension|image|max:)'
    remediation: |
      Store uploaded files outside of public/ and serve them through a controller:
        $path = $request->file('document')->store('uploads', 'private');
      If a file must be public, validate it thoroughly first:
        $request->validate(['file' => 'required|mimes:jpg,png,gif,webp|max:2048']);
    references:
      - "https://cwe.mitre.org/data/definitions/434.html"
      - "https://owasp.org/www-community/vulnerabilities/Unrestricted_File_Upload"
  - id: UPL-002
    title: "Original Filename Used for Storage"
    description: >
      getClientOriginalName() or getClientOriginalExtension() is used to determine the stored filename. An attacker can manipulate the original filename to include path traversal sequences (../../), null bytes, or dangerous extensions.

    severity: high
    confidence: high
    category: Path Traversal via Filename
    tags: [file-upload, path-traversal, owasp-a04, cwe-73]
    owasp: "A04:2021"
    cwe: "CWE-73"
    patterns:
      - type: regex
        target: php-files
        pattern: 'getClientOriginalName\s*\(\s*\)'
      - type: regex
        target: php-files
        pattern: 'getClientOriginalExtension\s*\(\s*\)'
    remediation: |
      Generate a secure filename instead of using the original one:
        $filename = Str::uuid() . '.' . $file->extension();   // extension from MIME type
        $file->storeAs('uploads', $filename);
        // Or use hashName() which generates a unique name:
        $file->storeAs('uploads', $file->hashName());
    references:
      - "https://cwe.mitre.org/data/definitions/73.html"
  - id: UPL-003
    title: "No MIME Type Validation on File Upload"
    description: >
      File upload is processed using store(), storeAs(), or move() without apparent MIME type validation. Without file type checks, users can upload executable files (PHP, HTML with scripts) that may be executed or served as active content by the server.

    severity: high
    confidence: medium
    category: Unrestricted Upload
    tags: [file-upload, owasp-a04, cwe-434]
    owasp: "A04:2021"
    cwe: "CWE-434"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$request->file\([^)]+\)->(store|storeAs|move)\s*\('
        exclude_pattern: '(validate|mimes|mimetypes|extensions|image|FormRequest)'
    remediation: |
      Always validate the MIME type before storing:
        $request->validate([
            'file' => 'required|file|mimes:jpg,jpeg,png,gif,pdf|max:10240',
        ]);
        $path = $request->file('file')->store('uploads', 'private');
    references:
      - "https://cwe.mitre.org/data/definitions/434.html"
  - id: UPL-004
    title: "Uploaded File Included or Required (RCE)"
    description: >
      The path of an uploaded file is passed to include, require, include_once, or require_once. This is an extremely dangerous pattern that allows remote code execution through file uploads.

    severity: critical
    confidence: high
    category: RCE via Upload
    tags: [file-upload, rce, owasp-a03, cwe-98]
    owasp: "A03:2021"
    cwe: "CWE-98"
    patterns:
      - type: regex
        target: php-files
        pattern: '(include|require|include_once|require_once)\s*\(?\s*\$.*\b(upload|file|tmp|temp|storage)\b'
    remediation: |
      Never include uploaded files. Process them separately:
        $content = Storage::get($uploadedFilePath);
        // Parse and validate content before use
    references:
      - "https://cwe.mitre.org/data/definitions/98.html"
  - id: UPL-005
    title: "Executable File Extensions Allowed in Upload Validation"
    description: >
      Upload validation includes executable extensions (php, phtml, phar, sh, exe, bat) in the whitelist. Files with these extensions reaching a web-served path can lead to remote code execution.

    severity: critical
    confidence: high
    category: Dangerous Extension
    tags: [file-upload, owasp-a04, cwe-434]
    owasp: "A04:2021"
    cwe: "CWE-434"
    patterns:
      - type: regex
        target: php-files
        pattern: 'mimes\s*:\s*[^"''`,\]]*\b(php[0-9]?|phtml|phar|sh|bash|exe|bat|cmd|cgi|pl|py|rb)\b'
    remediation: |
      Allow only explicitly safe MIME types and store outside the web root:
        'file' => 'required|mimes:jpg,jpeg,png,gif,webp,pdf,docx,xlsx|max:10240',
    references:
      - "https://cwe.mitre.org/data/definitions/434.html"
  - id: UPL-006
    title: "SVG File Upload Allowed (XSS Risk)"
    description: >
      SVG files are allowed in upload validation. SVG is an XML format that can contain inline JavaScript, event handlers, and even embedded HTML. When served from your domain, this creates a stored XSS vulnerability.

    severity: high
    confidence: high
    category: SVG XSS
    tags: [file-upload, xss, owasp-a07, cwe-79]
    owasp: "A07:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: php-files
        pattern: 'mimes\s*:[^"'']*\bsvg\b'
    remediation: |
      Do not allow SVG uploads, or sanitize them strictly:
        - Remove SVG from the allowed MIME types
        - If SVG is required, use the SVG Sanitizer library
        - Serve SVGs with a Content-Disposition: attachment header
        - Use Content-Security-Policy to prevent inline script execution
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://github.com/darylldoyle/svg-sanitizer"
  - id: UPL-007
    title: "No File Size Limit on Upload"
    description: >
      File upload validation rules do not include a maximum size limit. Without size limits, an attacker can exhaust disk space or memory with extremely large uploads, causing a denial of service.

    severity: medium
    confidence: medium
    category: DoS via Upload
    tags: [file-upload, dos, cwe-770]
    owasp: "A04:2021"
    cwe: "CWE-770"
    patterns:
      - type: regex
        target: php-files
        pattern: "'(file|image|document)'\\s*=>\\s*'required\\|(file|image)(\\|mimes:[^']*)?'"
        exclude_pattern: 'max:'
    remediation: |
      Always set a maximum file size in validation:
        'avatar'   => 'required|image|mimes:jpg,jpeg,png,webp|max:2048',    // 2MB
        'document' => 'required|file|mimes:pdf,docx,xlsx|max:10240',        // 10MB
    references:
      - "https://cwe.mitre.org/data/definitions/770.html"
  - id: UPL-009
    title: "Missing Disk Visibility Configuration for Uploaded Files"
    description: >
      Files are uploaded using store() or storeAs() without explicitly specifying the disk or visibility. If the default disk is configured as 'public', uploaded files become directly accessible via the web.

    severity: medium
    confidence: low
    category: Misconfigured Storage
    tags: [file-upload, configuration, cwe-732]
    owasp: "A05:2021"
    cwe: "CWE-732"
    patterns:
      - type: regex
        target: php-files
        pattern: '->store\s*\(\s*["''][^"'']+["'']\s*\)$'
        exclude_pattern: '(public|private|s3|local|minio|gcs)'
    remediation: |
      Specify disk and visibility explicitly:
        $path = $file->store('uploads', 'private');
      Or configure in config/filesystems.php:
        'uploads' => [
            'driver'     => 'local',
            'root'       => storage_path('app/uploads'),
            'visibility' => 'private',
        ],
    references:
      - "https://cwe.mitre.org/data/definitions/732.html"

