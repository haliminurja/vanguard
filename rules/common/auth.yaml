meta:
  category: Authentication & Authorization
  version: "3.0.0"
  updated: "2025"
rules:
  - id: AUTH-A01
    title: "Auth::loginUsingId() dengan input pengguna tidak tervalidasi"
    description: >
      Auth::loginUsingId() mengautentikasi hanya berdasarkan ID numerik, melewati semua pemeriksaan password. Jika ID berasal dari input yang dikendalikan pengguna, penyerang dapat mengautentikasi sebagai user manapun cukup dengan memasukkan ID mereka.

    severity: critical
    confidence: high
    category: Authentication Bypass
    tags: [auth, auth-bypass, owasp-a07, cwe-287]
    patterns:
      - type: regex
        target: php-files
        pattern: '(Auth::loginUsingId|auth\(\)->loginUsingId)\s*\(\s*\$'
        exclude_pattern: '(user|signed|ValidSignature|hasValidSignature|test|Test)'
    remediation: |
      Hanya gunakan loginUsingId() setelah memverifikasi signed URL atau nilai
      sistem tepercaya:
        abort_unless(URL::hasValidSignature($request), 403);
        Auth::loginUsingId($request->route('id'));
    references:
      - "https://cwe.mitre.org/data/definitions/287.html"
  - id: AUTH-A02
    title: "Session tidak di-regenerate setelah autentikasi"
    description: >
      Auth::attempt() atau Auth::login() dipanggil tanpa memanggil $request->session()->regenerate() setelahnya. Tanpa regenerasi session, aplikasi rentan terhadap session fixation — penyerang yang mengetahui session ID dapat membajak session setelah pengguna mengautentikasi.

    severity: high
    confidence: medium
    category: Session Fixation
    tags: [session, auth, owasp-a07, cwe-384]
    patterns:
      - type: regex
        target: php-files
        pattern: 'Auth::(attempt|login)\s*\('
        exclude_pattern: '(regenerate|invalidate|Fortify|Breeze|Jetstream|LoginResponse|test|Test)'
    remediation: |
      Selalu regenerasi session segera setelah autentikasi berhasil:
        if (Auth::attempt($credentials)) {
            $request->session()->regenerate();
            return redirect()->intended('dashboard');
        }
    references:
      - "https://cwe.mitre.org/data/definitions/384.html"
  - id: AUTH-A03
    title: "Weak password validation — tanpa aturan kompleksitas"
    description: >
      Field password hanya divalidasi dengan 'required' atau panjang minimum di bawah 8, tanpa persyaratan kompleksitas. Kebijakan lemah meninggalkan akun rentan terhadap serangan brute force dan dictionary.

    severity: medium
    confidence: high
    category: Weak Password Policy
    tags: [auth, password-policy, cwe-521]
    patterns:
      - type: regex
        target: php-files
        pattern: "'password'\\s*=>\\s*[\"']required(\\|min:[1-7])?[\"']"
        exclude_pattern: '(Password::min|password\.rule|confirmed|mixedCase|letters|numbers|symbols|uncompromised)'
    remediation: |
      Gunakan objek Password rule Laravel:
        'password' => ['required', 'confirmed',
            Password::min(12)->mixedCase()->numbers()->symbols()->uncompromised()],
    references:
      - "https://cwe.mitre.org/data/definitions/521.html"
      - "https://laravel.com/docs/validation#validating-passwords"
  - id: AUTH-A04
    title: "Token autentikasi dikirimkan via URL query parameter"
    description: >
      Token autentikasi atau API key dibaca dari URL query parameter. Parameter URL muncul di server access log, browser history, proxy cache, dan header Referer — mengekspos kredensial secara pasif.

    severity: high
    confidence: high
    category: Token Exposure
    tags: [auth, token-exposure, owasp-a02, cwe-598]
    patterns:
      - type: regex
        target: routes-files
        pattern: 'Route::(get|any)\s*\([^)]*\{(token|api_key|apiKey|secret_key|access_token)\}'
      - type: regex
        target: php-files
        pattern: '\$request->query\s*\(\s*["'']?(token|api_key|apiKey|secret_key|access_token)["'']?\s*\)'
    remediation: |
      Kirimkan token eksklusif di header Authorization:
        Authorization: Bearer <token>
        $token = $request->bearerToken();
    references:
      - "https://cwe.mitre.org/data/definitions/598.html"
  - id: AUTH-A05
    title: "Authentication failure tidak dicatat ke log"
    description: >
      Auth::attempt() digunakan tetapi tidak ada Log::warning/info atau event LoginFailed di file yang sama. Tanpa logging kegagalan login, serangan brute force dan credential stuffing tidak terdeteksi.

    severity: medium
    confidence: medium
    category: Missing Audit Log
    tags: [auth, logging, owasp-a09, cwe-778]
    condition: all
    patterns:
      - type: contains
        target: php-files
        pattern: "Auth::attempt("
      - type: regex
        target: php-files
        pattern: '(Log::(warning|error|info)|event\(.*LoginFailed|RateLimiter)'
        negative: true
    remediation: |
      Log percobaan autentikasi yang gagal dengan IP dan timestamp:
        if (!Auth::attempt($credentials)) {
            Log::warning('Failed login attempt', [
                'email'      => $request->input('email'),
                'ip'         => $request->ip(),
                'user_agent' => $request->userAgent(),
            ]);
            RateLimiter::hit($key);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/778.html"
  - id: AUTH-A06
    title: "Sanctum / Passport token dibuat tanpa abilities atau scopes"
    description: >
      createToken() dipanggil tanpa menentukan abilities (Sanctum) atau scopes (Passport). Token tanpa batasan memberikan akses ke semua endpoint API, melanggar prinsip least privilege.

    severity: medium
    confidence: high
    category: Over-Privileged Token
    tags: [auth, token, owasp-a01, cwe-269]
    patterns:
      - type: regex
        target: php-files
        pattern: "->createToken\\s*\\(\\s*[\"'][^\"']+[\"']\\s*\\)"
        exclude_pattern: '(\[|abilities|scopes)'
    remediation: |
      Tentukan abilities minimum yang diperlukan saat menerbitkan token:
        $token = $user->createToken('mobile-app', ['orders:read', 'profile:update']);
    references:
      - "https://cwe.mitre.org/data/definitions/269.html"
      - "https://laravel.com/docs/sanctum#token-abilities"
  - id: AUTH-R01
    title: "Route admin/dashboard/settings tanpa middleware auth"
    description: >
      Route dengan segmen path admin, dashboard, atau settings didaftarkan tanpa middleware auth. Route control-plane sensitif harus selalu menerapkan autentikasi dan pemeriksaan role.

    severity: high
    confidence: high
    category: Missing Authentication
    tags: [auth, routing, owasp-a07, cwe-306]
    patterns:
      - type: regex
        target: routes-files
        pattern: "Route::(get|post|put|patch|delete)\\s*\\(\\s*[\"'][^\"']*/(admin|dashboard|settings|manage|backoffice)[^\"']*[\"']"
        exclude_pattern: '(->middleware|middleware\(|->group.*auth)'
    remediation: |
      Bungkus route sensitif di dalam grup middleware authenticated:
        Route::middleware(['auth', 'verified', 'role:admin'])
            ->prefix('admin')
            ->group(function () {
                Route::get('/dashboard', [AdminController::class, 'index']);
            });
    references:
      - "https://cwe.mitre.org/data/definitions/306.html"
  - id: AUTH-R02
    title: "withoutMiddleware() menghapus middleware keamanan kritis"
    description: >
      Route memanggil withoutMiddleware() untuk menghapus auth, throttle, csrf, atau verified middleware. Menghapus perlindungan ini mengekspos aksi sensitif ke request yang tidak terautentikasi atau bebas rate-limit.

    severity: high
    confidence: high
    category: Missing Authentication
    tags: [auth, owasp-a07, cwe-306]
    patterns:
      - type: regex
        target: routes-files
        pattern: 'withoutMiddleware\s*\(\s*\[?\s*["'']?(auth|throttle|csrf|verified|signed)'
    remediation: |
      Definisikan route yang genuinely public di luar grup yang diproteksi,
      daripada menghapus middleware dari route individual.
    references:
      - "https://cwe.mitre.org/data/definitions/306.html"
  - id: AUTH-R03
    title: "Route email verification / magic-link tanpa middleware 'signed'"
    description: >
      Route yang menangani verifikasi email atau magic-link login tidak menggunakan middleware 'signed' Laravel. Tanpa verifikasi signed URL, penyerang dapat memanipulasi parameter route untuk memverifikasi akun arbitrer atau melewati konfirmasi email.

    severity: high
    confidence: medium
    category: URL Tampering
    tags: [auth, url-tampering, cwe-345]
    patterns:
      - type: regex
        target: routes-files
        pattern: "Route::(get|post)\\s*\\([^)]*\\b(verify|magic|confirm|activate|unsubscribe)\\b"
        exclude_pattern: '(signed|hasValidSignature|middleware.*signed)'
    remediation: |
      Lindungi route ini dengan middleware 'signed':
        Route::get('/email/verify/{id}/{hash}',
            [VerificationController::class, 'verify'])
            ->middleware(['auth', 'signed', 'throttle:6,1'])
            ->name('verification.verify');
    references:
      - "https://cwe.mitre.org/data/definitions/345.html"
  - id: AUTH-R04
    title: "Route nested parameters tanpa scopeBindings()"
    description: >
      Route dengan nested resource parameters ({user}/{post}) tidak memanggil ->scopeBindings(). Tanpa scoping, Laravel me-resolve setiap model secara independen berdasarkan primary key, memungkinkan pengguna mengakses resource milik pengguna lain.

    severity: high
    confidence: medium
    category: IDOR
    tags: [idor, owasp-a01, cwe-639, laravel]
    patterns:
      - type: regex
        target: routes-files
        pattern: 'Route::(get|put|patch|delete)\s*\([^)]*\{[a-z_]+\}[^)]*\{[a-z_]+\}'
        exclude_pattern: '(scopeBindings|scoped\(|ScopedBy)'
    remediation: |
      Terapkan parent-child scoping dengan ->scopeBindings():
        Route::get('/users/{user}/posts/{post}',
            [PostController::class, 'show'])->scopeBindings();
    references:
      - "https://cwe.mitre.org/data/definitions/639.html"
      - "https://laravel.com/docs/routing#implicit-model-binding-scoping"
  - id: AUTH-Z01
    title: "Gate::before() mengembalikan true tanpa syarat"
    description: >
      Callback Gate::before() mengembalikan true tanpa syarat, melewati setiap pemeriksaan Gate dan Policy berikutnya untuk semua pengguna. Ini memberikan akses super-admin ke semua pengguna yang terautentikasi.

    severity: critical
    confidence: high
    category: Authorization Bypass
    tags: [authz, owasp-a01, cwe-863]
    patterns:
      - type: regex
        target: php-files
        pattern: 'Gate::before\s*\(\s*function\s*\([^)]*\)\s*\{\s*return\s+true'
    remediation: |
      Batasi bypass ke role spesifik, kembalikan null untuk semua lainnya:
        Gate::before(function ($user, $ability) {
            if ($user->hasRole('super-admin')) {
                return true;
            }
            // null meneruskan ke pemeriksaan Gate/Policy normal
        });
    references:
      - "https://cwe.mitre.org/data/definitions/863.html"
  - id: AUTH-Z02
    title: "Resource controller action tanpa authorization check"
    description: >
      Resource controller mendefinisikan store, update, atau destroy tanpa pemeriksaan otorisasi apapun. Pengguna terautentikasi manapun dapat mengeksekusi aksi ini terhadap record apapun.

    severity: high
    confidence: medium
    category: Missing Authorization
    tags: [authz, owasp-a01, cwe-862]
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(store|update|destroy)\s*\(.*Request'
        exclude_pattern: '(authorize|authorizeResource|can\(|Gate::|this->authorize|policy|abort_unless)'
    remediation: |
      Daftarkan otorisasi di constructor atau di dalam setiap aksi:
        public function __construct()
        {
            $this->authorizeResource(Post::class, 'post');
        }
    references:
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://laravel.com/docs/authorization#authorizing-resource-controllers"
  - id: AUTH-Z03
    title: "Model::update() dengan payload request tidak difilter (IDOR)"
    description: >
      update() dipanggil dengan $request->all() tanpa terlebih dahulu mengotorisasi bahwa pengguna yang terautentikasi memiliki record tersebut. Penyerang mengubah resource ID untuk menimpa data pengguna lain.

    severity: high
    confidence: high
    category: IDOR
    tags: [idor, owasp-a01, cwe-639]
    patterns:
      - type: regex
        target: php-files
        pattern: '->update\(\s*(\$request->all\(\)|request\(\)->all\(\))'
    remediation: |
      Otorisasi kepemilikan sebelum update, gunakan ->only() untuk batasan field:
        $post = Post::findOrFail($id);
        $this->authorize('update', $post);
        $post->update($request->only(['title', 'body']));
    references:
      - "https://cwe.mitre.org/data/definitions/639.html"
  - id: AUTH-Z04
    title: "Broadcast channel authorization selalu return true"
    description: >
      Callback broadcast channel mengembalikan true tanpa syarat, mengizinkan pengguna terautentikasi manapun untuk subscribe ke channel manapun. Data channel private (order, pesan, notifikasi) terekspos ke semua pengguna yang login.

    severity: high
    confidence: high
    category: Authorization Bypass
    tags: [authz, websocket, owasp-a01, cwe-863, laravel]
    patterns:
      - type: regex
        target: php-files
        pattern: 'Broadcast::channel\s*\([^,]+,\s*function\s*\([^)]*\)\s*\{\s*return\s+true'
    remediation: |
      Verifikasi kepemilikan di callback channel:
        Broadcast::channel('orders.{orderId}', function ($user, $orderId) {
            $order = Order::find($orderId);
            return $order && $user->id === $order->user_id;
        });
    references:
      - "https://cwe.mitre.org/data/definitions/863.html"
