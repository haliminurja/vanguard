meta:
  category: Authentication & Authorization
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: AUTH-Z03
    title: "Model::update() with unfiltered request payload (IDOR)"
    description: >
      update() is called with $request->all() without first authorizing that the authenticated user owns that record. Attackers change the resource ID to overwrite other users' data.

    severity: high
    confidence: high
    category: IDOR
    tags: [idor, owasp-a01, cwe-639]
    owasp: "A01:2021"
    cwe: "CWE-639"
    patterns:
      - type: regex
        target: php-files
        pattern: '->update\(\s*(\$request->all\(\)|request\(\)->all\(\))'
    remediation: |
      Authorize ownership before updating, use ->only() for field limitations:
        $post = Post::findOrFail($id);
        $this->authorize('update', $post);
        $post->update($request->only(['title', 'body']));
    references:
      - "https://cwe.mitre.org/data/definitions/639.html"
