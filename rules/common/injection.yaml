meta:
  category: Injection
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: INJ-E02
    title: "Code Injection - preg_replace() with /e modifier (removed in PHP 7.0+)"
    description: >
      preg_replace() uses the /e modifier which evaluates the replacement as PHP code. This modifier was removed in PHP 7.0 - remaining usage causes a fatal error in PHP 7.0+ and is always an RCE vector in older PHP versions.

    severity: critical
    confidence: high
    category: Code Injection
    tags: [code-injection, rce, owasp-a03, cwe-95, legacy]
    owasp: "A03:2021"
    cwe: "CWE-95"
    patterns:
      - type: regex
        target: php-files
        pattern: 'preg_replace\s*\(\s*["''][^"'']*\/[a-z]*e[a-z]*["'']'
    remediation: |
      Replace with preg_replace_callback():

        // - INCORRECT (PHP < 7.0 - RCE vector)
        // $result = preg_replace('/(\w+)/e', 'strtoupper("$1")', $subject);

        // - CORRECT
        $result = preg_replace_callback('/(\w+)/', function ($matches) {
            return strtoupper($matches[0]);
        }, $subject);
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
  - id: INJ-E03
    title: "Code Injection - create_function() removed in PHP 8.0 (RCE vector)"
    description: >
      create_function() was removed in PHP 8.0. Internally it uses eval() to create dynamic closures, making it a remote code execution vector. Remaining usage causes a fatal error in PHP 8.0+ and potentially exposes RCE in PHP < 8.0 if arguments originate from users.

    severity: critical
    confidence: high
    category: Code Injection
    tags: [code-injection, rce, php80, cwe-95, removed-function]
    owasp: "A03:2021"
    cwe: "CWE-95"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bcreate_function\s*\('
    remediation: |
      Replace with arrow functions or anonymous functions:

        // - INCORRECT (removed in PHP 8.0)
        // $fn = create_function('$a, $b', 'return $a + $b;');

        // - CORRECT - arrow function (PHP 7.4+)
        $fn = fn($a, $b) => $a + $b;

        // - CORRECT - anonymous function
        $fn = function ($a, $b) { return $a + $b; };
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
      - "https://www.php.net/manual/en/migration80.incompatible.php"
  - id: INJ-D01
    title: "Unsafe Deserialization - unserialize() on untrusted data"
    description: >
      unserialize() is called with data that may be user-controlled. Deserializing attacker-manipulated payloads triggers magic methods (__wakeup, __destruct, __toString) via POP (Property-Oriented Programming) chains, which can lead to RCE, arbitrary file deletion, SSRF, or privilege escalation depending on the classes available in the autoloader.

    severity: critical
    confidence: high
    category: Deserialization
    tags: [deserialization, rce, owasp-a08, cwe-502]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bunserialize\s*\(\s*\$'
        exclude_pattern: '(config\(|env\(|test|Test|allowed_classes\s*=>)'
    remediation: |
      Use JSON for data exchange - no magic methods are called:

        // - CORRECT - JSON is safe from deserialization attacks
        $data = json_decode($input, true, 512, JSON_THROW_ON_ERROR);

        // - If unserialize() is absolutely necessary (legacy cache),
        //    restrict allowed classes:
        $obj = unserialize($data, ['allowed_classes' => [SafeValueObject::class]]);

        // - INCORRECT
        // $obj = unserialize($_POST['data']);
        // $obj = unserialize(base64_decode($request->input('payload')));
    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://www.php.net/manual/en/function.unserialize.php"
  - id: INJ-V01
    title: "Variable Injection - extract() with User Input"
    description: >
      extract() imports array keys as PHP variables into the current scope. When called with $_GET, $_POST, or $request->all(), an attacker can overwrite any variable within the scope: $isAdmin, $user, $authenticated, $config, or even variables used for security flow control.

    severity: high
    confidence: high
    category: Variable Injection
    tags: [variable-injection, owasp-a03, cwe-621]
    owasp: "A03:2021"
    cwe: "CWE-621"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bextract\s*\(\s*(\$_GET|\$_POST|\$_REQUEST|\$request->all)'
    remediation: |
      Never use extract() on user input.
      Access values explicitly and validate them one by one:

        // - CORRECT
        $name  = $request->string('name')->trim()->limit(100)->value();
        $email = $request->string('email')->lower()->value();

        // - INCORRECT
        // extract($request->all());  // $isAdmin could now be set from the outside!
    references:
      - "https://cwe.mitre.org/data/definitions/621.html"
  - id: INJ-V02
    title: "Variable Injection - parse_str() without Output Array"
    description: >
      parse_str() without a second parameter imports parsed keys directly into the current PHP scope - equivalent to the long-deprecated register_globals. An attacker can overwrite any variable within the current scope by manipulating the query string or request body.

    severity: critical
    confidence: high
    category: Variable Injection
    tags: [variable-injection, owasp-a03, cwe-621, register-globals]
    owasp: "A03:2021"
    cwe: "CWE-621"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bparse_str\s*\(\s*\$\w+\s*\)\s*;'
    remediation: |
      Always provide an output array as the second parameter:

        // - CORRECT
        parse_str($queryString, $params);
        $name = filter_var($params['name'] ?? '', FILTER_SANITIZE_SPECIAL_CHARS);

        // - INCORRECT
        // parse_str($queryString);  // Imports into the current scope!
    references:
      - "https://cwe.mitre.org/data/definitions/621.html"
  - id: INJ-M02
    title: "CSV Formula Injection in Exported Data"
    description: >
      User data is written to CSV or XLSX without sanitization of formula characters (=, +, -, @, TAB, CR). Cells starting with these characters are executed as formulas by Excel/LibreOffice/Google Sheets. An attacker can exfiltrate data via DDE, create links to external resources, or execute macros when the file is opened by the recipient.

    severity: medium
    confidence: medium
    category: CSV Injection
    tags: [csv-injection, owasp-a03, cwe-1236, spreadsheet]
    owasp: "A03:2021"
    cwe: "CWE-1236"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bfputcsv\s*\('
        exclude_pattern: '(sanitize|escapeFormula|preg_replace|ltrim.*[=+\-@])'
    remediation: |
      Prefix formula trigger characters with a single quote before
      writing to CSV. Do this for ALL user fields:

        function sanitizeCsvCell(mixed $value): string
        {
            $str = (string) $value;
            // Prefix if starts with a formula character
            if (preg_match('/^[=+\-@\t\r\|%]/', $str)) {
                return "'" . $str;  // Excel/LibreOffice treats this as text
            }
            return $str;
        }

        $row = array_map('sanitizeCsvCell', $rowData);
        fputcsv($handle, $row);
    references:
      - "https://cwe.mitre.org/data/definitions/1236.html"
      - "https://owasp.org/www-community/attacks/CSV_Injection"
  - id: INJ-F01
    title: "RFI - PHP Protocol Wrapper in include/require or File Functions"
    description: >
      include, require, file_get_contents, or fopen use PHP stream wrappers (php://input, php://filter, data://, phar://, expect://). PHP filter chains allow code execution via base64-decode + phar even when allow_url_include is disabled. The Phar wrapper enables deserialization gadget chains.

    severity: critical
    confidence: high
    category: RFI
    tags: [rfi, lfi, owasp-a03, cwe-98, php-wrappers]
    owasp: "A03:2021"
    cwe: "CWE-98"
    patterns:
      - type: regex
        target: php-files
        pattern: '(include|require|include_once|require_once|file_get_contents|fopen)\s*\(?[^;]*(php://|data://|phar://|expect://|zip://|glob://)'
    remediation: |
      Disable dangerous stream wrappers in php.ini:

        ; php.ini - production
        allow_url_include = Off
        allow_url_fopen   = Off   ; if not needed for external downloads

      Never construct include paths from user input or external sources.
      Validate paths with realpath() and ensure they reside within allowed directories.
    references:
      - "https://cwe.mitre.org/data/definitions/98.html"
      - "https://www.php.net/manual/en/wrappers.php"

  - id: INJ-L01
    title: "LDAP Injection - unescaped parameters in LDAP search/modify"
    description: >
      LDAP queries (ldap_search, ldap_add, ldap_modify) are constructed using raw user input without escaping LDAP control characters. Attackers can alter the logical structure of the LDAP filter (e.g., using `)(|(uid=*))`) to bypass authentication, elevate privileges, or extract directory information.
    severity: critical
    confidence: high
    category: Injection
    tags: [ldap-injection, owasp-a03, cwe-90]
    owasp: "A03:2021"
    cwe: "CWE-90"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bldap_(search|add|modify|delete|compare)_?\w*\s*\([^,]+,[^,]*(\$_GET|\$_POST|\$_REQUEST|\$request->)'
        exclude_pattern: '(ldap_escape|preg_replace|str_replace)'
    remediation: |
      Always escape user input using `ldap_escape($input, '', LDAP_ESCAPE_FILTER)` before inserting it into LDAP filters or DNs.
    references:
      - "https://cwe.mitre.org/data/definitions/90.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html"

  - id: INJ-N01
    title: "NoSQL Injection - uncast array payloads passed to MongoDB queries"
    description: >
      MongoDB queries receive raw user input via arrays (like `$_GET` or `$request->all()`). If PHP associative arrays are passed directly into MongoDB query builders without type-casting to strings, attackers can inject operator objects (e.g., `?username[$ne]=null`) to bypass authentication or extract sensitive data.
    severity: critical
    confidence: high
    category: Injection
    tags: [nosql-injection, mongodb, owasp-a03, cwe-943]
    owasp: "A03:2021"
    cwe: "CWE-943"
    patterns:
      - type: regex
        target: php-files
        pattern: '->(find|findOne|where|orWhere)\(\s*\[\s*[''"]\w+[''"]\s*=>\s*(\$_GET|\$_POST|\$request->)'
        exclude_pattern: '(intval|strval|\(string\)|filter_var|sanitize|cast)'
    remediation: |
      Strictly type-cast user input to strings or integers before using them in NoSQL queries:
      `$user = User::where('username', (string) $request->input('username'))->first();`
    references:
      - "https://cwe.mitre.org/data/definitions/943.html"
      - "https://www.php.net/manual/en/mongodb.security.injection.php"
