meta:
  category: Injection
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: INJ-E02
    title: "Code Injection - preg_replace() dengan modifier /e (dihapus PHP 7.0+)"
    description: >
      preg_replace() menggunakan modifier /e yang mengevaluasi penggantian sebagai kode PHP. Modifier ini dihapus sejak PHP 7.0 - penggunaan yang tersisa menyebabkan fatal error di PHP 7.0+ dan selalu merupakan vektor RCE pada versi PHP yang lebih lama.

    severity: critical
    confidence: high
    category: Code Injection
    tags: [code-injection, rce, owasp-a03, cwe-95, legacy]
    owasp: "A03:2021"
    cwe: "CWE-95"
    patterns:
      - type: regex
        target: php-files
        pattern: 'preg_replace\s*\(\s*["''][^"'']*\/[a-z]*e[a-z]*["'']'
    remediation: |
      Ganti dengan preg_replace_callback():

        // - SALAH (PHP 7.0 ke bawah - vektor RCE)
        // $result = preg_replace('/(\w+)/e', 'strtoupper("$1")', $subject);

        // - BENAR
        $result = preg_replace_callback('/(\w+)/', function ($matches) {
            return strtoupper($matches[0]);
        }, $subject);
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
  - id: INJ-E03
    title: "Code Injection - create_function() dihapus di PHP 8.0 (vektor RCE)"
    description: >
      create_function() dihapus di PHP 8.0. Secara internal menggunakan eval() untuk membuat closure dinamis, menjadikannya vektor remote code execution. Penggunaan yang tersisa menyebabkan fatal error di PHP 8.0+ dan berpotensi mengekspos RCE di PHP < 8.0 jika argumen berasal dari pengguna.

    severity: critical
    confidence: high
    category: Code Injection
    tags: [code-injection, rce, php80, cwe-95, removed-function]
    owasp: "A03:2021"
    cwe: "CWE-95"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bcreate_function\s*\('
    remediation: |
      Ganti dengan arrow function atau anonymous function:

        // - SALAH (dihapus di PHP 8.0)
        // $fn = create_function('$a, $b', 'return $a + $b;');

        // - BENAR - arrow function (PHP 7.4+)
        $fn = fn($a, $b) => $a + $b;

        // - BENAR - anonymous function
        $fn = function ($a, $b) { return $a + $b; };
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
      - "https://www.php.net/manual/en/migration80.incompatible.php"
  - id: INJ-D01
    title: "Unsafe Deserialization - unserialize() pada data tidak tepercaya"
    description: >
      unserialize() dipanggil dengan data yang mungkin dikontrol pengguna. Mendeserialkan payload yang dimanipulasi penyerang memicu magic methods (__wakeup, __destruct, __toString) via rantai POP (Property-Oriented Programming), yang dapat menyebabkan RCE, arbitrary file deletion, SSRF, atau privilege escalation tergantung kelas yang tersedia di autoloader.

    severity: critical
    confidence: high
    category: Deserialization
    tags: [deserialization, rce, owasp-a08, cwe-502]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bunserialize\s*\(\s*\$'
        exclude_pattern: '(config\(|env\(|test|Test|allowed_classes\s*=>)'
    remediation: |
      Gunakan JSON untuk pertukaran data - tidak ada magic method yang dipanggil:

        // - BENAR - JSON aman dari deserialization attack
        $data = json_decode($input, true, 512, JSON_THROW_ON_ERROR);

        // - Jika unserialize() mutlak diperlukan (cache legacy),
        //    batasi kelas yang diizinkan:
        $obj = unserialize($data, ['allowed_classes' => [SafeValueObject::class]]);

        // - SALAH
        // $obj = unserialize($_POST['data']);
        // $obj = unserialize(base64_decode($request->input('payload')));
    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://www.php.net/manual/en/function.unserialize.php"
  - id: INJ-V01
    title: "Variable Injection - extract() dengan input pengguna"
    description: >
      extract() mengimpor kunci array sebagai variabel PHP ke scope saat ini. Ketika dipanggil dengan $_GET, $_POST, atau $request->all(), penyerang dapat menimpa variabel apapun dalam scope: $isAdmin, $user, $authenticated, $config, bahkan variabel yang digunakan untuk kontrol flow keamanan.

    severity: high
    confidence: high
    category: Variable Injection
    tags: [variable-injection, owasp-a03, cwe-621]
    owasp: "A03:2021"
    cwe: "CWE-621"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bextract\s*\(\s*(\$_GET|\$_POST|\$_REQUEST|\$request->all)'
    remediation: |
      Jangan pernah gunakan extract() pada input pengguna.
      Akses nilai secara eksplisit dan validasi satu per satu:

        // - BENAR
        $name  = $request->string('name')->trim()->limit(100)->value();
        $email = $request->string('email')->lower()->value();

        // - SALAH
        // extract($request->all());  // $isAdmin sekarang bisa diset dari luar!
    references:
      - "https://cwe.mitre.org/data/definitions/621.html"
  - id: INJ-V02
    title: "Variable Injection - parse_str() tanpa output array"
    description: >
      parse_str() tanpa parameter kedua mengimpor kunci yang diparse langsung ke scope PHP saat ini - setara dengan register_globals yang sudah lama dihapus. Penyerang dapat menimpa variabel apapun dalam scope saat ini dengan memanipulasi query string atau request body.

    severity: critical
    confidence: high
    category: Variable Injection
    tags: [variable-injection, owasp-a03, cwe-621, register-globals]
    owasp: "A03:2021"
    cwe: "CWE-621"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bparse_str\s*\(\s*\$\w+\s*\)\s*;'
    remediation: |
      Selalu sediakan output array sebagai parameter kedua:

        // - BENAR
        parse_str($queryString, $params);
        $name = filter_var($params['name'] ?? '', FILTER_SANITIZE_SPECIAL_CHARS);

        // - SALAH
        // parse_str($queryString);  // Mengimpor ke scope saat ini!
    references:
      - "https://cwe.mitre.org/data/definitions/621.html"
  - id: INJ-M02
    title: "CSV Formula Injection dalam data yang diekspor"
    description: >
      Data dari pengguna ditulis ke CSV atau XLSX tanpa sanitasi karakter formula (=, +, -, @, TAB, CR). Sel yang dimulai karakter ini dieksekusi sebagai formula oleh Excel/LibreOffice/Google Sheets. Penyerang dapat mengeksfiltrasi data via DDE, membuat link ke resource eksternal, atau mengeksekusi makro saat file dibuka oleh penerima.

    severity: medium
    confidence: medium
    category: CSV Injection
    tags: [csv-injection, owasp-a03, cwe-1236, spreadsheet]
    owasp: "A03:2021"
    cwe: "CWE-1236"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bfputcsv\s*\('
        exclude_pattern: '(sanitize|escapeFormula|preg_replace|ltrim.*[=+\-@])'
    remediation: |
      Prefix karakter pemicu formula dengan tanda kutip tunggal sebelum
      menulis ke CSV. Lakukan ini pada SEMUA field dari pengguna:

        function sanitizeCsvCell(mixed $value): string
        {
            $str = (string) $value;
            // Prefix jika dimulai dengan karakter formula
            if (preg_match('/^[=+\-@\t\r\|%]/', $str)) {
                return "'" . $str;  // Excel/LibreOffice memperlakukan ini sebagai text
            }
            return $str;
        }

        $row = array_map('sanitizeCsvCell', $rowData);
        fputcsv($handle, $row);
    references:
      - "https://cwe.mitre.org/data/definitions/1236.html"
      - "https://owasp.org/www-community/attacks/CSV_Injection"
  - id: INJ-F01
    title: "RFI - PHP protocol wrapper dalam include/require atau file functions"
    description: >
      include, require, file_get_contents, atau fopen menggunakan PHP stream wrapper (php://input, php://filter, data://, phar://, expect://). PHP filter chains memungkinkan eksekusi kode via base64-decode + phar bahkan ketika allow_url_include dinonaktifkan. Phar wrapper mengaktifkan deserialization gadget chain.

    severity: critical
    confidence: high
    category: RFI
    tags: [rfi, lfi, owasp-a03, cwe-98, php-wrappers]
    owasp: "A03:2021"
    cwe: "CWE-98"
    patterns:
      - type: regex
        target: php-files
        pattern: '(include|require|include_once|require_once|file_get_contents|fopen)\s*\(?[^;]*(php://|data://|phar://|expect://|zip://|glob://)'
    remediation: |
      Nonaktifkan stream wrapper berbahaya di php.ini:

        ; php.ini - production
        allow_url_include = Off
        allow_url_fopen   = Off   ; jika tidak dibutuhkan untuk download eksternal

      Jangan pernah membuat path include dari input pengguna atau sumber eksternal.
      Validasi path dengan realpath() dan pastikan berada dalam direktori yang diizinkan.
    references:
      - "https://cwe.mitre.org/data/definitions/98.html"
      - "https://www.php.net/manual/en/wrappers.php"

  - id: INJ-L01
    title: "LDAP Injection - unescaped parameters in LDAP search/modify"
    description: >
      LDAP queries (ldap_search, ldap_add, ldap_modify) are constructed using raw user input without escaping LDAP control characters. Attackers can alter the logical structure of the LDAP filter (e.g., using `)(|(uid=*))`) to bypass authentication, elevate privileges, or extract directory information.
    severity: critical
    confidence: high
    category: Injection
    tags: [ldap-injection, owasp-a03, cwe-90]
    owasp: "A03:2021"
    cwe: "CWE-90"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bldap_(search|add|modify|delete|compare)_?\w*\s*\([^,]+,[^,]*(\$_GET|\$_POST|\$_REQUEST|\$request->)'
        exclude_pattern: '(ldap_escape|preg_replace|str_replace)'
    remediation: |
      Always escape user input using `ldap_escape($input, '', LDAP_ESCAPE_FILTER)` before inserting it into LDAP filters or DNs.
    references:
      - "https://cwe.mitre.org/data/definitions/90.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html"

  - id: INJ-N01
    title: "NoSQL Injection - uncast array payloads passed to MongoDB queries"
    description: >
      MongoDB queries receive raw user input via arrays (like `$_GET` or `$request->all()`). If PHP associative arrays are passed directly into MongoDB query builders without type-casting to strings, attackers can inject operator objects (e.g., `?username[$ne]=null`) to bypass authentication or extract sensitive data.
    severity: critical
    confidence: high
    category: Injection
    tags: [nosql-injection, mongodb, owasp-a03, cwe-943]
    owasp: "A03:2021"
    cwe: "CWE-943"
    patterns:
      - type: regex
        target: php-files
        pattern: '->(find|findOne|where|orWhere)\(\s*\[\s*[''"]\w+[''"]\s*=>\s*(\$_GET|\$_POST|\$request->)'
        exclude_pattern: '(intval|string|strval|\(string\)|sanitize)'
    remediation: |
      Strictly type-cast user input to strings or integers before using them in NoSQL queries:
      `$user = User::where('username', (string) $request->input('username'))->first();`
    references:
      - "https://cwe.mitre.org/data/definitions/943.html"
      - "https://www.php.net/manual/en/mongodb.security.injection.php"
