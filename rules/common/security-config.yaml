meta:
  category: Security Configuration
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: CFG-CORS01
    title: "CORS wildcard HTTP methods"
    description: >
      Konfigurasi CORS mengizinkan semua HTTP method ('*'), memungkinkan cross-origin DELETE, PATCH, dan request mutasi lainnya dari origin manapun.

    severity: medium
    confidence: high
    category: CORS Misconfiguration
    tags: [cors, owasp-a05, cwe-942]
    owasp: "A05:2021"
    cwe: "CWE-942"
    patterns:
      - type: regex
        target: config-files
        pattern: "'allowed_methods'\\s*=>\\s*\\[?\\s*[\"']?\\*[\"']?\\s*\\]?"
    remediation: |
      Daftarkan hanya HTTP method yang diperlukan API Anda:
        'allowed_methods' => ['GET', 'POST', 'PUT', 'DELETE'],
    references:
      - "https://cwe.mitre.org/data/definitions/942.html"
  - id: CFG-CORS02
    title: "CORS supports_credentials=true - verifikasi origin dibatasi"
    description: >
      Konfigurasi CORS memiliki supports_credentials=true. Dikombinasikan dengan allowed_origins yang wildcard atau luas, ini mengizinkan website manapun membuat request API cross-origin yang sepenuhnya terautentikasi.

    severity: critical
    confidence: high
    category: CORS Misconfiguration
    tags: [cors, owasp-a05, cwe-942]
    owasp: "A05:2021"
    cwe: "CWE-942"
    patterns:
      - type: regex
        target: config-files
        pattern: "'supports_credentials'\\s*=>\\s*true"
    remediation: |
      Ketika kredensial diperlukan, selalu tentukan origin yang diizinkan secara eksplisit:
        'allowed_origins'      => ['https://myapp.com'],
        'supports_credentials' => true,
      Jangan pernah menggabungkan supports_credentials=true dengan allowed_origins=['*'].
    references:
      - "https://cwe.mitre.org/data/definitions/942.html"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS#requests_with_credentials"
