meta:
  category: Security Configuration
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: CFG-CORS01
    title: "CORS wildcard HTTP methods"
    description: >
      CORS configuration allows all HTTP methods ('*'), enabling cross-origin DELETE, PATCH, and other mutation requests from any origin.

    severity: medium
    confidence: high
    category: CORS Misconfiguration
    tags: [cors, owasp-a05, cwe-942]
    owasp: "A05:2021"
    cwe: "CWE-942"
    patterns:
      - type: regex
        target: config-files
        pattern: "'allowed_methods'\\s*=>\\s*\\[?\\s*[\"']?\\*[\"']?\\s*\\]?"
    remediation: |
      List only the HTTP methods required by your API:
        'allowed_methods' => ['GET', 'POST', 'PUT', 'DELETE'],
    references:
      - "https://cwe.mitre.org/data/definitions/942.html"
  - id: CFG-CORS02
    title: "CORS supports_credentials=true - restricted origin verification"
    description: >
      CORS configuration has supports_credentials=true. Combined with wildcard or broad allowed_origins, this allows any website to make fully authenticated cross-origin API requests.

    severity: critical
    confidence: high
    category: CORS Misconfiguration
    tags: [cors, owasp-a05, cwe-942]
    owasp: "A05:2021"
    cwe: "CWE-942"
    patterns:
      - type: regex
        target: config-files
        pattern: "'supports_credentials'\\s*=>\\s*true"
    remediation: |
      When credentials are required, always specify allowed origins explicitly:
        'allowed_origins'      => ['https://myapp.com'],
        'supports_credentials' => true,
      Never combine supports_credentials=true with allowed_origins=['*'].
    references:
      - "https://cwe.mitre.org/data/definitions/942.html"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS#requests_with_credentials"
