meta:
  category: Logging & Monitoring
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: LOG-001
    title: "Sensitive data passed to application logs"
    description: >
      Logging calls include variables or keys that look like passwords, tokens,
      API keys, or card data. Log sinks are usually wider and longer-lived than
      transactional databases, so secret exposure in logs materially increases
      blast radius.
    severity: high
    confidence: high
    category: Sensitive Data in Logs
    tags: [logging, info-disclosure, owasp-a09, cwe-532]
    cwe: "CWE-532"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '(Log::|logger\s*\(|error_log\s*\(|\$[A-Za-z_][A-Za-z0-9_]*->(info|debug|warning|error|critical|notice|alert))[^;]*\$(password|passwd|secret|token|credit_card|ssn|cvv|card_number|api_key|private_key|pin|otp)'
      - type: regex
        target: php-files
        pattern: '(Log::|logger\s*\(|error_log\s*\(|\$[A-Za-z_][A-Za-z0-9_]*->(info|debug|warning|error|critical|notice|alert))[^;]*["''](password|passwd|secret|token|credit_card|ssn|cvv|card_number|api_key|private_key|pin|otp)["'']'
    remediation: |
      Redact or omit secrets before they enter logs. Keep only the minimum
      identifiers needed for incident response and correlate sensitive actions
      with stable request or user IDs instead of raw credentials.
    references:
      - "https://cwe.mitre.org/data/definitions/532.html"
      - "https://owasp.org/www-project-logging-vocabulary/"

  - id: LOG-002
    title: "Raw user input logged without sanitization"
    description: >
      User-controlled request bodies or parameter collections are written
      directly to the log sink. This enables log injection, leaks PII, and can
      create XSS risk in web-based log viewers.
    severity: medium
    confidence: high
    category: Log Injection
    tags: [logging, log-injection, owasp-a09, cwe-117]
    cwe: "CWE-117"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '(Log::|logger\s*\(|\$[A-Za-z_][A-Za-z0-9_]*->(info|debug|warning|error))[^;]*(\$request->(all|getContent)\(\)|\$_(?:GET|POST|REQUEST)|filter_input\s*\(|php://input)'
    remediation: |
      Log only bounded, sanitized, and context-specific fields such as path,
      request ID, actor ID, and normalized error codes.
    references:
      - "https://cwe.mitre.org/data/definitions/117.html"

  - id: LOG-006
    title: "Exception handler displays detailed error to user instead of logging"
    description: >
      Exception handlers return detailed messages or traces to the client
      without clear evidence that the event is recorded on the server. This
      leaks internals and weakens investigation capability.
    severity: high
    confidence: high
    category: Error Handling
    tags: [logging, exception-handling, owasp-a09, cwe-209]
    cwe: "CWE-209"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*return\s+.*\$e->(getMessage|getTraceAsString)\(\)'
        exclude_pattern: '(Log::|logger\(|report\(|error_log\s*\()'
    remediation: |
      Record full exception details on the server and return only generic
      messages to users and API clients.
    references:
      - "https://cwe.mitre.org/data/definitions/209.html"

  - id: LOG-007
    title: "Changes to financial or payment data not logged"
    description: >
      Code modifies financial balances, refunds, or payouts without clear audit
      logging nearby. These events need durable telemetry for fraud detection,
      reconciliation, and incident response.
    severity: high
    confidence: medium
    category: Financial Audit Trail
    tags: [logging, financial, audit, compliance, owasp-a09, cwe-778]
    cwe: "CWE-778"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '(->refund|->adjustBalance|->credit|->debit|->withdraw|->transfer|->payout)\s*\('
        exclude_pattern: '(Log::|logger\(|error_log\s*\(|event\(|audit|activity|ActivityLog|dispatch\(.*Audit)'
    remediation: |
      Emit structured audit logs for every financial mutation with actor,
      object, amount, reason, correlation ID, and request origin details.
    references:
      - "https://cwe.mitre.org/data/definitions/778.html"

  - id: LOG-008
    title: "Privilege or identity state changes lack audit logging"
    description: >
      Code changes roles, permissions, password-like fields, or account status
      without clear audit logging nearby. These operations are high-value from
      both incident response and insider-risk perspectives.
    severity: high
    confidence: medium
    category: Audit Trail
    tags: [logging, audit, authz, owasp-a09, cwe-778]
    cwe: "CWE-778"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '(assignRole|syncRoles|removeRole|givePermissionTo|revokePermissionTo|syncPermissions)\s*\('
        exclude_pattern: '(Log::|logger\(|error_log\s*\(|audit|activity|event\()'
      - type: regex
        target: php-files
        pattern: '->update\s*\(\s*\[[^\]]*["''](email|password|is_admin|role|status|two_factor_secret|mfa_secret)["'']'
        exclude_pattern: '(Log::|logger\(|error_log\s*\(|audit|activity|event\()'
    remediation: |
      Record role, permission, password, MFA, and account-status changes in a
      structured audit trail with actor ID, target ID, source IP, and reason.
    references:
      - "https://cwe.mitre.org/data/definitions/778.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
