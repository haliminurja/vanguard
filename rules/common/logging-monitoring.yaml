meta:
  category: Logging & Monitoring
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: LOG-001
    title: "Sensitive data passed to Log facade"
    description: >
      Log::* calls include variables named password, secret, token, credit_card, or similar. Log files are often less protected than databases and can be accessed by support staff, log aggregators, and attackers with filesystem access. Credentials in logs persist for the full log retention period.
    severity: high
    confidence: high
    category: Sensitive Data in Logs
    tags: [logging, info-disclosure, owasp-a09, cwe-532]
    cwe: "CWE-532"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Log::(info|debug|warning|error|critical|notice|alert)\s*\([^;]*\$(password|passwd|secret|token|credit_card|ssn|cvv|card_number|api_key|private_key|pin|otp)'
    remediation: |
      Redact or remove sensitive fields before logging:
        Log::info('User authenticated', [
            'email'    => $email,
            'password' => '[REDACTED]',
        ]);
        // Or use redact helper:
        Log::info('Payment', Arr::except($data, ['card_number', 'cvv']));
    references:
      - "https://cwe.mitre.org/data/definitions/532.html"
      - "https://owasp.org/www-project-logging-vocabulary/"

  - id: LOG-002
    title: "Raw user input logged without sanitization"
    description: >
      User input from $request->all() or $request->getContent() is passed directly to the Log facade. Unsanitized log entries enable log injection (fake log lines via CRLF) and XSS in web-based log viewers.
    severity: medium
    confidence: high
    category: Log Injection
    tags: [logging, log-injection, owasp-a09, cwe-117]
    cwe: "CWE-117"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Log::(info|debug|warning|error)\s*\(\s*[^,]*,\s*\[?\s*[^\]]*\$request->(all|getContent)\(\)'
    remediation: |
      Log only sanitized and limited fields:
        Log::info('Request', [
            'path'  => $request->path(),
            'query' => Str::limit(strip_tags($request->query('q', '')), 200),
            'ip'    => $request->ip(),
        ]);
    references:
      - "https://cwe.mitre.org/data/definitions/117.html"

  - id: LOG-006
    title: "Exception handler displays detailed error to user instead of logging"
    description: >
      Exception handler returns detailed error messages ($e->getMessage()) or stack traces to HTTP responses instead of logging to the server. This exposes internal information to users and fails to store information necessary for debugging and monitoring.
    severity: high
    confidence: high
    category: Error Handling
    tags: [logging, exception-handling, owasp-a09, cwe-209]
    cwe: "CWE-209"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*return\s+.*\$e->getMessage\(\)'
        exclude_pattern: '(Log::|logger\(|report\()'
    remediation: |
      Log detailed errors on the server and return generic messages to the client:
        catch (\Throwable $e) {
            Log::error('Operation failed', [
                'exception' => $e->getMessage(),
                'trace'     => $e->getTraceAsString(),
                'user_id'   => auth()->id(),
            ]);
            return response()->json(['error' => 'An internal error occurred.'], 500);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/209.html"

  - id: LOG-007
    title: "Changes to financial/payment data not logged"
    description: >
      Operations that modify financial data (refunds, balance adjustments, price changes, order modifications) lack audit logging. Without logging, internal fraud, successful attacks, and operational errors on financial data go undetected.
    severity: high
    confidence: medium
    category: Financial Audit Trail
    tags: [logging, financial, audit, compliance, owasp-a09, cwe-778]
    cwe: "CWE-778"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '(->refund|->adjustBalance|->credit|->debit|->withdraw|->transfer|->payout)\s*\('
        exclude_pattern: '(Log::|event\(|audit|activity|ActivityLog|dispatch\(.*Audit)'
    remediation: |
      Log all financial operations with complete details:
        Log::info('Financial operation', [
            'type'       => 'refund',
            'amount'     => $amount,
            'currency'   => $currency,
            'order_id'   => $order->id,
            'user_id'    => auth()->id(),
            'ip'         => request()->ip(),
            'reason'     => $reason,
            'timestamp'  => now()->toIso8601String(),
        ]);
    references:
      - "https://cwe.mitre.org/data/definitions/778.html"
