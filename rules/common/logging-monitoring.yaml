meta:
  category: Logging & Monitoring
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: LOG-001
    title: "Data sensitif diteruskan ke Log facade"
    description: >
      Pemanggilan Log::* menyertakan variabel bernama password, secret, token, credit_card, atau serupa. File log sering kurang terlindungi dibandingkan database dan dapat diakses oleh staf support, log aggregator, dan penyerang dengan akses filesystem. Kredensial dalam log bertahan selama periode retensi log penuh.
    severity: high
    confidence: high
    category: Sensitive Data in Logs
    tags: [logging, info-disclosure, owasp-a09, cwe-532]
    cwe: "CWE-532"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Log::(info|debug|warning|error|critical|notice|alert)\s*\([^;]*\$(password|passwd|secret|token|credit_card|ssn|cvv|card_number|api_key|private_key|pin|otp)'
    remediation: |
      Redact atau hilangkan field sensitif sebelum logging:
        Log::info('User authenticated', [
            'email'    => $email,
            'password' => '[REDACTED]',
        ]);
        // Atau gunakan helper redact:
        Log::info('Payment', Arr::except($data, ['card_number', 'cvv']));
    references:
      - "https://cwe.mitre.org/data/definitions/532.html"
      - "https://owasp.org/www-project-logging-vocabulary/"

  - id: LOG-002
    title: "Input pengguna mentah dicatat tanpa sanitasi"
    description: >
      Input pengguna dari $request->all() atau $request->getContent() diteruskan langsung ke Log facade. Entri log yang tidak disanitasi mengaktifkan log injection (baris log palsu via CRLF) dan XSS dalam log viewer berbasis web.
    severity: medium
    confidence: high
    category: Log Injection
    tags: [logging, log-injection, owasp-a09, cwe-117]
    cwe: "CWE-117"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Log::(info|debug|warning|error)\s*\(\s*[^,]*,\s*\[?\s*[^\]]*\$request->(all|getContent)\(\)'
    remediation: |
      Log hanya field yang disanitasi dan dibatasi:
        Log::info('Request', [
            'path'  => $request->path(),
            'query' => Str::limit(strip_tags($request->query('q', '')), 200),
            'ip'    => $request->ip(),
        ]);
    references:
      - "https://cwe.mitre.org/data/definitions/117.html"

  - id: LOG-003
    title: "Kegagalan autentikasi tidak dicatat"
    description: >
      Auth::attempt() digunakan tetapi tidak ada Log::warning/info atau event autentikasi gagal dalam file yang sama. Tanpa mencatat login yang gagal, serangan brute force dan credential stuffing tidak terlihat oleh monitoring, SIEM, dan incident response team.
    severity: medium
    confidence: medium
    category: Missing Audit Log
    tags: [logging, monitoring, owasp-a09, cwe-778]
    cwe: "CWE-778"
    owasp: "A09:2021"
    condition: all
    patterns:
      - type: contains
        target: php-files
        pattern: "Auth::attempt("
      - type: regex
        target: php-files
        pattern: '(Log::(warning|error|info)|event\(.*LoginFailed|RateLimiter::hit)'
        negative: true
    remediation: |
      Log percobaan autentikasi yang gagal dengan IP dan timestamp:
        if (!Auth::attempt($credentials)) {
            Log::warning('Failed login attempt', [
                'email'      => $request->input('email'),
                'ip'         => $request->ip(),
                'user_agent' => $request->userAgent(),
                'timestamp'  => now()->toIso8601String(),
            ]);
            RateLimiter::hit('login:'.$request->ip(), 60);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/778.html"

  - id: LOG-004
    title: "Laravel Context facade (Laravel 11+) menyimpan data sensitif"
    description: >
      Laravel 11 memperkenalkan Context facade untuk logging context terstruktur. Menyimpan password, token, atau PII dalam Context::add() mempertahankan nilai tersebut di semua pemanggilan log berikutnya dalam lifecycle request yang sama, termasuk error handler dan agen monitoring.
    severity: high
    confidence: high
    category: Sensitive Data in Logs
    tags: [logging, laravel11, context, cwe-532, owasp-a09]
    cwe: "CWE-532"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Context::add\s*\(\s*["'']?(password|token|secret|api_key|credit_card|ssn|cvv|private_key)["'']?'
    remediation: |
      Jangan pernah menyimpan nilai sensitif dalam logging context:
        // BURUK
        Context::add('password', $password);
        // BAIK - simpan hanya identifier non-sensitif
        Context::add('user_id', $user->id);
        Context::add('request_id', $requestId);
    references:
      - "https://laravel.com/docs/context"
      - "https://cwe.mitre.org/data/definitions/532.html"

  - id: LOG-005
    title: "Operasi administratif tidak tercatat (audit trail missing)"
    description: >
      Aksi administratif (delete, update role, reset password user lain, impersonate) dilakukan tanpa audit logging. Tanpa audit trail, investigasi insiden keamanan, pelanggaran data, dan compliance audit (SOC2, PCI-DSS, ISO 27001) tidak dapat dilakukan.
    severity: high
    confidence: medium
    category: Missing Audit Trail
    tags: [logging, audit, compliance, owasp-a09, cwe-778]
    cwe: "CWE-778"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'function\s+(destroy|forceDelete|delete|ban|suspend|impersonate|resetPassword|changeRole|assignRole|removeRole)\s*\('
        exclude_pattern: '(Log::|event\(|audit|activity|ActivityLog|Auditable|LogsActivity)'
    remediation: |
      Log semua operasi administratif dengan detail konteks:
        public function destroy(User $user): RedirectResponse
        {
            $this->authorize('delete', $user);
            Log::warning('Admin action: user deleted', [
                'admin_id'   => auth()->id(),
                'target_id'  => $user->id,
                'target_email' => $user->email,
                'ip'         => request()->ip(),
                'timestamp'  => now()->toIso8601String(),
            ]);
            $user->delete();
            return redirect()->route('users.index');
        }
      Pertimbangkan menggunakan package audit logging: spatie/laravel-activitylog
    references:
      - "https://cwe.mitre.org/data/definitions/778.html"
      - "https://github.com/spatie/laravel-activitylog"

  - id: LOG-006
    title: "Exception handler menampilkan detail error ke user alih-alih logging"
    description: >
      Exception handler mengembalikan pesan error detail ($e->getMessage()) atau stack trace ke HTTP response alih-alih melakukan logging ke server. Ini mengekspos informasi internal ke pengguna dan gagal menyimpan informasi yang diperlukan untuk debugging dan monitoring.
    severity: high
    confidence: high
    category: Error Handling
    tags: [logging, exception-handling, owasp-a09, cwe-209]
    cwe: "CWE-209"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*return\s+.*\$e->getMessage\(\)'
        exclude_pattern: '(Log::|logger\(|report\()'
    remediation: |
      Log error detail di server dan kembalikan pesan generik ke klien:
        catch (\Throwable $e) {
            Log::error('Operation failed', [
                'exception' => $e->getMessage(),
                'trace'     => $e->getTraceAsString(),
                'user_id'   => auth()->id(),
            ]);
            return response()->json(['error' => 'Terjadi kesalahan internal.'], 500);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/209.html"

  - id: LOG-007
    title: "Perubahan pada data keuangan/pembayaran tidak dicatat"
    description: >
      Operasi yang mengubah data keuangan (refund, penyesuaian saldo, perubahan harga, modifikasi order) tidak memiliki audit logging. Tanpa pencatatan, penipuan internal, serangan yang berhasil, dan kesalahan operasional pada data keuangan tidak terdeteksi.
    severity: high
    confidence: medium
    category: Financial Audit Trail
    tags: [logging, financial, audit, compliance, owasp-a09, cwe-778]
    cwe: "CWE-778"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '(->refund|->adjustBalance|->credit|->debit|->withdraw|->transfer|->payout)\s*\('
        exclude_pattern: '(Log::|event\(|audit|activity|ActivityLog|dispatch\(.*Audit)'
    remediation: |
      Log semua operasi keuangan dengan detail yang lengkap:
        Log::info('Financial operation', [
            'type'       => 'refund',
            'amount'     => $amount,
            'currency'   => $currency,
            'order_id'   => $order->id,
            'user_id'    => auth()->id(),
            'ip'         => request()->ip(),
            'reason'     => $reason,
            'timestamp'  => now()->toIso8601String(),
        ]);
    references:
      - "https://cwe.mitre.org/data/definitions/778.html"

  - id: LOG-008
    title: "Log channel menggunakan 'single' file tanpa rotasi"
    description: >
      Konfigurasi logging menggunakan channel 'single' yang menulis ke satu file tanpa rotasi. File log akan tumbuh tanpa batas, menyebabkan disk space exhaustion (DoS), dan file log yang sangat besar sulit dianalisis untuk incident response.
    severity: medium
    confidence: medium
    category: Log Configuration
    tags: [logging, config, dos, owasp-a09, cwe-779]
    cwe: "CWE-779"
    owasp: "A09:2021"
    patterns:
      - type: regex
        target: config-files
        pattern: "'default'\\s*=>\\s*env\\s*\\(\\s*'LOG_CHANNEL'\\s*,\\s*'single'\\s*\\)"
      - type: regex
        target: env-files
        pattern: 'LOG_CHANNEL\s*=\s*single'
    remediation: |
      Gunakan channel 'daily' atau 'stack' dengan rotasi:
        LOG_CHANNEL=daily
        LOG_DEPRECATIONS_CHANNEL=null

        // config/logging.php
        'daily' => [
            'driver' => 'daily',
            'path'   => storage_path('logs/laravel.log'),
            'level'  => 'info',
            'days'   => 14,  // Rotasi setiap hari, simpan 14 hari
        ],
    references:
      - "https://cwe.mitre.org/data/definitions/779.html"
      - "https://laravel.com/docs/logging"
