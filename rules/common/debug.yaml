meta:
  category: Debug & Information Disclosure
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: DBG-003
    title: "var_dump() / print_r() / var_export() in source code"
    description: >
      var_dump(), print_r(), or var_export() output raw PHP variable contents directly to the HTTP response. In an API context, this pollutes JSON/XML responses. In a web context, it exposes internal data structures and database records to the user.

    severity: medium
    confidence: high
    category: Debug Exposure
    tags: [debug, info-disclosure, owasp-a05, cwe-215]
    owasp: "A05:2021"
    cwe: "CWE-215"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(var_dump|print_r|var_export)\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test|spec)'
    remediation: |
      Replace with structured logging:
        Log::debug('Variable state', ['data' => $variable]);
    references:
      - "https://cwe.mitre.org/data/definitions/215.html"
  - id: DBG-004
    title: "phpinfo() exposed in web-accessible code"
    description: >
      phpinfo() outputs complete PHP configuration, loaded extensions, all $_SERVER variables, and compiled paths. A single call to this function exposes more server internals than almost any other information disclosure vulnerability.

    severity: critical
    confidence: high
    category: Info Disclosure
    tags: [debug, info-disclosure, owasp-a05, cwe-200]
    owasp: "A05:2021"
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bphpinfo\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test)'
    remediation: |
      Remove phpinfo() entirely. Use php -i on the command line for
      diagnostics during provisioning if needed.
    references:
      - "https://cwe.mitre.org/data/definitions/200.html"
