meta:
  category: Session Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:

  - id: SES-002
    title: "Sensitive data stored directly in session"
    description: >
      Raw passwords, tokens, or payment card data are stored directly in the session via session()->put(). Even with encrypted sessions, storing raw secrets expands the attack surface and may violate PCI-DSS, GDPR, or HIPAA.
    severity: high
    confidence: high
    category: Sensitive Data in Session
    tags: [session, info-disclosure, owasp-a02, cwe-312]
    cwe: "CWE-312"
    owasp: "A02:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'session\(\)->put\s*\(\s*["'']?(password|passwd|secret|credit_card|cvv|card_number|ssn|social_security|private_key|api_key|token)'
      - type: regex
        target: php-files
        pattern: '\$request->session\(\)->put\s*\(\s*["'']?(password|passwd|credit_card|cvv|card_number|ssn)'
    remediation: |
      Do not store raw secrets in the session. For short-term temporary values,
      use an encrypted cache with a short TTL:
        Cache::put("payment:{$userId}", encrypt($token), now()->addMinutes(5));
    references:
      - "https://cwe.mitre.org/data/definitions/312.html"

  - id: SES-003
    title: "Cookie created without Secure and HttpOnly flags"
    description: >
      Cookie created with Secure or HttpOnly explicitly set to false. Without Secure, the cookie is sent over HTTP. Without HttpOnly, JavaScript can steal it - enabling theft via XSS even when HTTPS is implemented.
    severity: high
    confidence: high
    category: Insecure Cookie
    tags: [cookies, owasp-a05, cwe-614]
    cwe: "CWE-614"
    owasp: "A05:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'setcookie\s*\([^)]*,\s*(false|0)\s*,\s*(false|0)'
      - type: regex
        target: php-files
        pattern: 'Cookie::(make|queue)\s*\([^,]+,[^,]+,[^,]+,[^,]+,[^,]+,\s*(false|null)'
    remediation: |
      Set both flags on all sensitive cookies:
        cookie('name', 'value', $minutes, '/', null, true, true, false, 'Strict');
      Global configuration in config/session.php:
        'secure'    => env('SESSION_SECURE_COOKIE', true),
        'http_only' => true,
        'same_site' => 'lax',
    references:
      - "https://cwe.mitre.org/data/definitions/614.html"
      - "https://owasp.org/www-community/controls/SecureCookieAttribute"

  - id: SES-004
    title: "Session cookie SameSite not configured or set to 'none'"
    description: >
      Session cookie configuration does not set the SameSite attribute or sets it to 'none'. Without SameSite restriction, the session cookie is sent on all cross-site requests, enabling CSRF attacks even without a specific exploit. SameSite=none explicitly allows cross-site cookie transmission.
    severity: high
    confidence: high
    category: CSRF via Cookie
    tags: [session, csrf, cookies, owasp-a05, cwe-1275]
    cwe: "CWE-1275"
    owasp: "A05:2021"
    patterns:
      - type: regex
        target: config-files
        pattern: "'same_site'\\s*=>\\s*('none'|\"none\"|null)"
      - type: regex
        target: env-files
        pattern: 'SESSION_SAME_SITE\s*=\s*(none|null)'
    remediation: |
      Set SameSite to 'lax' (good compatibility) or 'strict' (more secure):
        // config/session.php
        'same_site' => 'lax',
    references:
      - "https://cwe.mitre.org/data/definitions/1275.html"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie/SameSite"

  - id: SES-005
    title: "Session lifetime too long (>24 hours)"
    description: >
      Session lifetime is configured for more than 1440 minutes (24 hours). An excessively long session lifetime increases the attack window if a session token is stolen - the attacker has more time to exploit the hijacked session before it expires.
    severity: medium
    confidence: medium
    category: Session Misconfiguration
    tags: [session, owasp-a07, cwe-613]
    cwe: "CWE-613"
    owasp: "A07:2021"
    patterns:
      - type: regex
        target: config-files
        pattern: "'lifetime'\\s*=>\\s*(1[5-9][0-9]{2}|[2-9][0-9]{3}|[0-9]{5,})"
      - type: regex
        target: env-files
        pattern: 'SESSION_LIFETIME\s*=\s*(1[5-9][0-9]{2}|[2-9][0-9]{3}|[0-9]{5,})'
    remediation: |
      Set a reasonable session lifetime based on the application type:
        // config/session.php
        'lifetime' => 120,          // 2 hours - general application
        'expire_on_close' => true,   // session ends when browser is closed
      For banking/financial applications, use 15-30 minutes with an inactivity timeout.
    references:
      - "https://cwe.mitre.org/data/definitions/613.html"
