meta:
  category: Session Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: SES-001
    title: "Session identifier accepted directly from request input"
    description: >
      The application sets or propagates the session ID from query, form, or
      cookie input. This expands session fixation exposure by letting attackers
      influence the identifier before authentication is complete.
    severity: high
    confidence: high
    category: Session Fixation
    tags: [session, fixation, owasp-a07, cwe-384]
    cwe: "CWE-384"
    owasp: "A07:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'session_id\s*\(\s*(\$_(?:GET|POST|REQUEST|COOKIE)|filter_input\s*\()'
      - type: regex
        target: php-files
        pattern: '["''][^"'']*(PHPSESSID|SID)='
    remediation: |
      Accept session identifiers only from secure cookies. Reject any attempt to
      source them from user-controlled input and regenerate the session after
      successful authentication or privilege changes.
    references:
      - "https://cwe.mitre.org/data/definitions/384.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"

  - id: SES-002
    title: "Sensitive data stored directly in session"
    description: >
      Raw passwords, tokens, or payment card data are stored directly in the
      session. Even with encrypted sessions, storing raw secrets expands the
      attack surface and can violate PCI-DSS or privacy obligations.
    severity: high
    confidence: high
    category: Sensitive Data in Session
    tags: [session, info-disclosure, owasp-a02, cwe-312]
    cwe: "CWE-312"
    owasp: "A02:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'session\(\)->put\s*\(\s*["'']?(password|passwd|secret|credit_card|cvv|card_number|ssn|social_security|private_key|api_key|token)'
      - type: regex
        target: php-files
        pattern: '\$request->session\(\)->put\s*\(\s*["'']?(password|passwd|credit_card|cvv|card_number|ssn)'
      - type: regex
        target: php-files
        pattern: '\$_SESSION\s*\[\s*["''](password|passwd|secret|credit_card|cvv|card_number|ssn|social_security|private_key|api_key|token)["'']\s*\]'
    remediation: |
      Do not store raw secrets in session state. Prefer short-lived encrypted
      cache entries or server-side references that point to protected data.
    references:
      - "https://cwe.mitre.org/data/definitions/312.html"

  - id: SES-003
    title: "Sensitive cookie created with Secure or HttpOnly disabled"
    description: >
      Application code creates cookies with Secure or HttpOnly explicitly
      disabled. This increases exposure to session theft via plaintext transport
      paths and browser-side script access.
    severity: high
    confidence: high
    category: Insecure Cookie
    tags: [cookies, session, owasp-a05, cwe-614]
    cwe: "CWE-614"
    owasp: "A05:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'setcookie\s*\([^,]+,[^,]+,[^,]+,[^,]+,[^,]+,\s*(false|0|null)\s*,\s*(true|1|false|0|null)'
      - type: regex
        target: php-files
        pattern: 'setcookie\s*\([^,]+,[^,]+,[^,]+,[^,]+,[^,]+,\s*(true|1)\s*,\s*(false|0|null)'
      - type: regex
        target: php-files
        pattern: 'session_set_cookie_params\s*\(\s*\[[^\]]*["'']secure["'']\s*=>\s*(false|0)[^\]]*\]'
      - type: regex
        target: php-files
        pattern: 'session_set_cookie_params\s*\(\s*\[[^\]]*["'']httponly["'']\s*=>\s*(false|0)[^\]]*\]'
    remediation: |
      Keep Secure and HttpOnly enabled on every session or authentication
      cookie. Pair that with SameSite and full HTTPS enforcement.
    references:
      - "https://cwe.mitre.org/data/definitions/614.html"
      - "https://owasp.org/www-community/controls/SecureCookieAttribute"

  - id: SES-004
    title: "Session ID regeneration preserves the old session"
    description: >
      `session_regenerate_id(false)` keeps the old session alongside the new
      identifier. When used on authentication or privilege changes, this weakens
      the expected session fixation protection.
    severity: medium
    confidence: high
    category: Session Fixation
    tags: [session, fixation, owasp-a07, cwe-384]
    cwe: "CWE-384"
    owasp: "A07:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'session_regenerate_id\s*\(\s*(false|0)\s*\)'
    remediation: |
      Destroy the old session when rotating the identifier after login or other
      privilege changes:
        session_regenerate_id(true);
    references:
      - "https://cwe.mitre.org/data/definitions/384.html"
      - "https://www.php.net/manual/en/function.session-regenerate-id.php"

  - id: SES-005
    title: "Session cookie SameSite not configured or set to none"
    description: >
      Session cookie configuration does not set SameSite or explicitly sets it
      to `none`. That allows broader cross-site cookie transmission and raises
      CSRF exposure.
    severity: high
    confidence: high
    category: CSRF via Cookie
    tags: [session, csrf, cookies, owasp-a05, cwe-1275]
    cwe: "CWE-1275"
    owasp: "A05:2021"
    patterns:
      - type: regex
        target: config-files
        pattern: '''same_site''\s*=>\s*(''none''|"none"|null)'
      - type: regex
        target: env-files
        pattern: 'SESSION_SAME_SITE\s*=\s*(none|null)'
      - type: regex
        target: php-files
        pattern: 'session_set_cookie_params\s*\(\s*\[[^\]]*["'']samesite["'']\s*=>\s*["'']?none["'']?[^\]]*\]'
    remediation: |
      Set SameSite to `lax` for general compatibility or `strict` for higher
      assurance flows that do not rely on cross-site navigation.
    references:
      - "https://cwe.mitre.org/data/definitions/1275.html"
      - "https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Set-Cookie/SameSite"

  - id: SES-006
    title: "Session lifetime too long (>24 hours)"
    description: >
      Session lifetime exceeds 24 hours. Excessively long sessions widen the
      exploitation window if a session token is stolen or reused from an
      unmanaged device.
    severity: medium
    confidence: medium
    category: Session Misconfiguration
    tags: [session, owasp-a07, cwe-613]
    cwe: "CWE-613"
    owasp: "A07:2021"
    patterns:
      - type: regex
        target: config-files
        pattern: '''lifetime''\s*=>\s*(1[5-9][0-9]{2}|[2-9][0-9]{3}|[0-9]{5,})'
      - type: regex
        target: env-files
        pattern: 'SESSION_LIFETIME\s*=\s*(1[5-9][0-9]{2}|[2-9][0-9]{3}|[0-9]{5,})'
    remediation: |
      Keep session lifetime aligned with the application risk profile. Use short
      inactivity timeouts for privileged or regulated workflows and consider
      `expire_on_close` where appropriate.
    references:
      - "https://cwe.mitre.org/data/definitions/613.html"
