meta:
  category: JWT Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:

  - id: JWT-006
    title: "JWT secret key too short (<32 characters)"
    description: >
      JWT HMAC secret keys shorter than 32 characters (256 bits) are vulnerable to brute-force attacks. With modern computing power, short secrets can be cracked within hours or days, allowing an attacker to forge arbitrary tokens.
    severity: high
    confidence: medium
    category: Weak Key
    tags: [jwt, weak-key, cwe-326, owasp-a02]
    cwe: "CWE-326"
    owasp: "A02:2021"
    patterns:
      - type: regex
        target: env-files
        pattern: "JWT_SECRET\\s*=\\s*[^\\s#]{1,31}$"
      - type: regex
        target: config-files
        pattern: "['\"](jwt_secret|JWT_SECRET)['\"]\\s*=>\\s*['\"][^'\"]{1,31}['\"]"
        exclude_pattern: '(env\(|getenv)'
    remediation: |
      Use a secret of at least 64 characters (512 bits) for HMAC:
        JWT_SECRET=$(openssl rand -base64 64)
      Or use RSA/EC key pairs for better security:
        openssl genpkey -algorithm RSA -out private.key -pkeyopt rsa_keygen_bits:2048
    references:
      - "https://cwe.mitre.org/data/definitions/326.html"
