meta:
  category: Enterprise Security Standards
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - OWASP-API-Security-2023
    - CWE-Top25-2024
    - OWASP-ASVS
    - NIST-SP-800-53r5
    - NIST-CSF-2.0
    - NIST-SSDF-1.1
    - CIS-Controls-v8
    - PCI-DSS-v4.0.1
    - SLSA-v1.0
rules:
  - id: ENT-NET-001
    title: "TLS certificate verification disabled for outbound connections"
    description: >
      Outbound HTTPS requests disable peer or host certificate verification
      through cURL or SSL stream context options. This allows man-in-the-middle
      attacks, forged upstream responses, and silent downgrade of transport trust.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    enabled: true
    tags: [tls, mitm, crypto, owasp-a02-2021, cwe-295, asvs-9.1.1, nist-sc-8]
    owasp: "A02:2021"
    cwe: "CWE-295"
    patterns:
      - type: regex
        target: php-files
        pattern: 'CURLOPT_SSL_VERIFYPEER\s*,\s*(false|0)\b'
      - type: regex
        target: php-files
        pattern: 'CURLOPT_SSL_VERIFYHOST\s*,\s*(false|0|1)\b'
      - type: regex
        target: php-files
        pattern: '["'']verify_peer(_name)?["'']\s*=>\s*(false|0)\b'
    remediation: |
      Keep certificate and hostname verification enabled for every outbound TLS
      connection. Use a valid trust store and rotate broken certificates instead
      of suppressing verification failures.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://www.php.net/manual/en/function.curl-setopt.php"
      - "https://www.php.net/manual/en/context.ssl.php"



  - id: ENT-SES-005
    title: "session.use_strict_mode disabled"
    description: >
      PHP session strict mode is disabled in configuration or at runtime. This
      weakens protection against session fixation by allowing the application to
      accept attacker-supplied session IDs more readily than necessary.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Session Security
    enabled: true
    tags: [session, fixation, owasp-a07-2021, cwe-384, asvs-3.3.2]
    owasp: "A07:2021"
    cwe: "CWE-384"
    patterns:
      - type: regex
        target: config-files
        pattern: 'session\.use_strict_mode\s*=\s*(0|Off|off|false|FALSE)\b'
      - type: regex
        target: php-files
        pattern: 'ini_set\s*\(\s*["'']session\.use_strict_mode["'']\s*,\s*["'']?(0|off|false)["'']?\s*\)'
    remediation: |
      Enable strict mode globally:
        session.use_strict_mode = 1
      Regenerate the session ID after authentication and major privilege changes.
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/384.html"
      - "https://www.php.net/manual/en/session.configuration.php"

  - id: ENT-CONF-006
    title: "display_errors enabled in runtime or PHP configuration"
    description: >
      Error display is enabled through php.ini or ini_set(). Stack traces,
      filesystem paths, SQL messages, and secret-bearing variables can leak to
      browsers and API clients, materially improving attacker reconnaissance.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Information Disclosure
    enabled: true
    tags: [debug, disclosure, owasp-a05-2021, cwe-209, asvs-14.3.2]
    owasp: "A05:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: config-files
        pattern: 'display_errors\s*=\s*(On|1|true|TRUE)\b'
      - type: regex
        target: php-files
        pattern: 'ini_set\s*\(\s*["'']display_errors["'']\s*,\s*["'']?(1|on|true)["'']?\s*\)'
        exclude_pattern: '(test|Test|local|dev)'
    remediation: |
      Disable error display in production and route full details to protected
      logs and monitoring systems:
        display_errors = Off
      Return generic error responses to users and API clients.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/209.html"
      - "https://www.php.net/manual/en/errorfunc.configuration.php"

  - id: ENT-CONF-007
    title: "allow_url_include enabled"
    description: >
      PHP configuration enables allow_url_include, allowing include/require to
      fetch code from URL wrappers. This dramatically increases remote file
      inclusion and remote code execution risk if any path handling is exposed.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Security Misconfiguration
    enabled: true
    tags: [rfi, configuration, owasp-a05-2021, cwe-98, asvs-14.1.1]
    owasp: "A05:2021"
    cwe: "CWE-98"
    patterns:
      - type: regex
        target: config-files
        pattern: 'allow_url_include\s*=\s*(On|1|true|TRUE)\b'
    remediation: |
      Disable allow_url_include in every non-test environment:
        allow_url_include = Off
      Load code only from local, reviewed sources and avoid dynamic include paths.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/98.html"
      - "https://www.php.net/manual/en/filesystem.configuration.php"

