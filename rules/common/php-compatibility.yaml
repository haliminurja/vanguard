meta:
  category: PHP Compatibility & Version-Specific Risks
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: PHP-080-01
    title: "create_function() dihapus di PHP 8.0 - vektor RCE"
    description: >
      create_function() dihapus di PHP 8.0. Secara internal menggunakan eval(), menjadikannya vektor remote code execution. Penggunaan yang tersisa menyebabkan fatal error di PHP 8.0+.

    severity: critical
    confidence: high
    category: Removed Function
    tags: [php80, removed, rce, cwe-95]
    owasp: "A05:2021"
    cwe: "CWE-95"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bcreate_function\s*\('
    remediation: |
      Ganti dengan anonymous function:
        $fn = fn($a) => $a * 2;
        $fn = function ($a) { return $a * 2; };
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
      - "https://www.php.net/manual/en/migration80.incompatible.php"
  - id: PHP-082-01
    title: "utf8_encode() / utf8_decode() deprecated di PHP 8.2"
    description: >
      utf8_encode() dan utf8_decode() dideprecasi di PHP 8.2 dan dihapus di PHP 9.0. Konversi encoding yang salah dapat menyebabkan kerentanan filter-bypass dimana payload dalam satu encoding lolos dari sanitizer yang mengharapkan UTF-8.

    severity: medium
    confidence: high
    category: Deprecated Function
    tags: [php82, deprecated, encoding, cwe-838]
    owasp: "A05:2021"
    cwe: "CWE-838"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(utf8_encode|utf8_decode)\s*\('
    remediation: |
      Gunakan mb_convert_encoding() dengan charset sumber dan target yang eksplisit:
        $utf8  = mb_convert_encoding($str, 'UTF-8', 'ISO-8859-1');
        $latin = mb_convert_encoding($str, 'ISO-8859-1', 'UTF-8');
    references:
      - "https://wiki.php.net/rfc/remove_utf8_decode_and_utf8_encode"
      - "https://cwe.mitre.org/data/definitions/838.html"
  - id: PHP-082-02
    title: "Parameter sensitif tanpa #[SensitiveParameter] (PHP 8.2+)"
    description: >
      PHP 8.2 memperkenalkan atribut #[SensitiveParameter] untuk menyamarkan nilai parameter
      sensitif pada stack trace. Fungsi yang menerima password, token, secret, atau API key tanpa
      atribut ini berisiko membocorkan kredensial ke log error dan monitoring system.

    severity: medium
    confidence: medium
    category: Information Disclosure
    tags: [php82, info-disclosure, cwe-532]
    owasp: "A07:2021"
    cwe: "CWE-532"
    patterns:
      - type: regex
        target: php-files
        pattern: 'function\s+\w+\s*\([^)]*\$(password|passwd|secret|token|api_key|apiKey|private_key|pin)\b[^)]*\)'
        exclude_pattern: '(SensitiveParameter|#\[|\btest\b|\bTest\b)'
    remediation: |
      Tambahkan atribut #[SensitiveParameter] pada parameter sensitif:
        function authenticate(
            string $email,
            #[SensitiveParameter] string $password
        ): bool { ... }
    references:
      - "https://wiki.php.net/rfc/redact_parameters_in_back_traces"
      - "https://cwe.mitre.org/data/definitions/532.html"
  - id: PHP-082-03
    title: "Dynamic property pada non-stdClass object (PHP 8.2 deprecated)"
    description: >
      PHP 8.2 mendeprecasi pembuatan dynamic property pada objek non-stdClass. Di PHP 9.0 ini menjadi fatal error. Kode keamanan yang mendeteksi atau menyetel property secara dinamis akan gagal diam-diam di PHP 8.2 dan break sepenuhnya di PHP 9.0.

    severity: medium
    confidence: medium
    category: Deprecated Behavior
    tags: [php82, dynamic-properties, cwe-670]
    owasp: "A05:2021"
    cwe: "CWE-670"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$\w+->\$\w+\s*='
        exclude_pattern: '(stdClass|AllowDynamicProperties|test|Test|//|#\s)'
    remediation: |
      Deklarasikan semua property secara eksplisit atau tambahkan
        class UserContext {
            public string $role = '';    // deklarasi eksplisit
        }
      Atau untuk value-object legacy yang memerlukan dynamic property:
        class LegacyData {}
    references:
      - "https://wiki.php.net/rfc/deprecate_dynamic_properties"
      - "https://cwe.mitre.org/data/definitions/670.html"
  - id: PHP-084-01
    title: "Property hooks PHP 8.4 mengekspos data sensitif via get hook"
    description: >
      PHP 8.4 property hooks (get/set) digunakan pada model atau DTO property yang mengandung logika bisnis yang dapat membocorkan state internal atau melewati validasi. Get hook yang menurunkan nilai dari property lain atau melakukan type coercion implisit dapat mengekspos data sensitif dalam konteks serialisasi.

    severity: medium
    confidence: low
    category: Data Exposure
    tags: [php84, property-hooks, owasp-a02, cwe-200]
    owasp: "A02:2021"
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: php-files
        pattern: 'public\s+\w+\s+\$\w+\s*\{[^}]*get\s*\{'
        exclude_pattern: '(e\(|htmlspecialchars|htmlentities|encrypt\(|hash\(|mask\()'
    remediation: |
      Pastikan get hook tidak mengekspos data sensitif mentah. Terapkan
      escaping atau masking di dalam hook:
        public string $email {
            get => strtolower($this->email);
        }
        public string $cardNumber {
            get => '****' . substr($this->rawCardNumber, -4);
        }
    references:
      - "https://wiki.php.net/rfc/property-hooks"
      - "https://cwe.mitre.org/data/definitions/200.html"
