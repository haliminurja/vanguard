meta:
  category: PHP Compatibility & Version-Specific Risks
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: PHP-080-01
    title: "create_function() removed in PHP 8.0 - RCE vector"
    description: >
      create_function() was removed in PHP 8.0. Internally it uses eval(), making it a remote code execution vector. Remaining usage causes a fatal error in PHP 8.0+.

    severity: critical
    confidence: high
    category: Removed Function
    tags: [php80, removed, rce, cwe-95]
    owasp: "A05:2021"
    cwe: "CWE-95"
    patterns:
      - type: regex
        target: php-files
        pattern: '\bcreate_function\s*\('
    remediation: |
      Replace with anonymous functions:
        $fn = fn($a) => $a * 2;
        $fn = function ($a) { return $a * 2; };
    references:
      - "https://cwe.mitre.org/data/definitions/95.html"
      - "https://www.php.net/manual/en/migration80.incompatible.php"
  - id: PHP-082-01
    title: "utf8_encode() / utf8_decode() deprecated in PHP 8.2"
    description: >
      utf8_encode() and utf8_decode() were deprecated in PHP 8.2 and removed in PHP 9.0. Incorrect encoding conversions can lead to filter-bypass vulnerabilities where payloads in one encoding escape sanitizers expecting UTF-8.

    severity: medium
    confidence: high
    category: Deprecated Function
    tags: [php82, deprecated, encoding, cwe-838]
    owasp: "A05:2021"
    cwe: "CWE-838"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(utf8_encode|utf8_decode)\s*\('
    remediation: |
      Use mb_convert_encoding() with explicit source and target charsets:
        $utf8  = mb_convert_encoding($str, 'UTF-8', 'ISO-8859-1');
        $latin = mb_convert_encoding($str, 'ISO-8859-1', 'UTF-8');
    references:
      - "https://wiki.php.net/rfc/remove_utf8_decode_and_utf8_encode"
      - "https://cwe.mitre.org/data/definitions/838.html"
  - id: PHP-082-02
    title: "Sensitive parameters without #[SensitiveParameter] (PHP 8.2+)"
    description: >
      PHP 8.2 introduced the #[SensitiveParameter] attribute to redact sensitive parameter values in stack traces. Functions that accept passwords, tokens, secrets, or API keys without this attribute risk leaking credentials into error logs and monitoring systems.

    severity: medium
    confidence: medium
    category: Information Disclosure
    tags: [php82, info-disclosure, cwe-532]
    owasp: "A07:2021"
    cwe: "CWE-532"
    patterns:
      - type: regex
        target: php-files
        pattern: 'function\s+\w+\s*\([^)]*\$(password|passwd|secret|token|api_key|apiKey|private_key|pin)\b[^)]*\)'
        exclude_pattern: '(SensitiveParameter|#\[|\btest\b|\bTest\b)'
    remediation: |
      Add the #[SensitiveParameter] attribute to sensitive parameters:
        function authenticate(
            string $email,
            #[SensitiveParameter] string $password
        ): bool { ... }
    references:
      - "https://wiki.php.net/rfc/redact_parameters_in_back_traces"
      - "https://cwe.mitre.org/data/definitions/532.html"
  - id: PHP-082-03
    title: "Dynamic property on non-stdClass object (PHP 8.2 deprecated)"
    description: >
      PHP 8.2 deprecated the creation of dynamic properties on non-stdClass objects. In PHP 9.0 this becomes a fatal error. Security code that dynamicly detects or sets properties will fail silently in PHP 8.2 and break completely in PHP 9.0.

    severity: medium
    confidence: medium
    category: Deprecated Behavior
    tags: [php82, dynamic-properties, cwe-670]
    owasp: "A05:2021"
    cwe: "CWE-670"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$\w+->\$\w+\s*='
        exclude_pattern: '(stdClass|AllowDynamicProperties|test|Test|//|#\s)'
    remediation: |
      Declare all properties explicitly or add
        class UserContext {
            public string $role = '';    // explicit declaration
        }
      Or for legacy value-objects that require dynamic properties:
        #[AllowDynamicProperties]
        class LegacyData {}
    references:
      - "https://wiki.php.net/rfc/deprecate_dynamic_properties"
      - "https://cwe.mitre.org/data/definitions/670.html"
  - id: PHP-084-01
    title: "PHP 8.4 property hooks expose sensitive data via get hook"
    description: >
      PHP 8.4 property hooks (get/set) are used on model or DTO properties containing business logic that can leak internal state or bypass validation. Get hooks that derive values from other properties or perform implicit type coercion can expose sensitive data in a serialization context.

    severity: medium
    confidence: low
    category: Data Exposure
    tags: [php84, property-hooks, owasp-a02, cwe-200]
    owasp: "A02:2021"
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: php-files
        pattern: 'public\s+\w+\s+\$\w+\s*\{[^}]*get\s*\{'
        exclude_pattern: '(e\(|htmlspecialchars|htmlentities|encrypt\(|hash\(|mask\()'
    remediation: |
      Ensure get hooks do not expose raw sensitive data. Apply
      escaping or masking inside the hook:
        public string $email {
            get => strtolower($this->email);
        }
        public string $cardNumber {
            get => '****' . substr($this->rawCardNumber, -4);
        }
    references:
      - "https://wiki.php.net/rfc/property-hooks"
      - "https://cwe.mitre.org/data/definitions/200.html"
