meta:
  category: API Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: API-001
    title: "Unbounded query - API returns all records without pagination"
    description: >
      API controller calls ::all() or a query chain ending with ->get() without pagination or row limits. This allows an attacker to extract the entire table in a single request (data exfiltration) and can cause out-of-memory denial of service on large tables.

    severity: high
    confidence: medium
    category: Unbounded Result Set
    tags: [api, dos, data-exfiltration, owasp-a04, cwe-770]
    cwe: "CWE-770"
    owasp: "A04:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '\breturn\s+\w+::all\s*\(\s*\)'
        exclude_pattern: '(paginate|limit|take|simplePaginate|cursorPaginate|first|find|count)'
      - type: regex
        target: php-files
        pattern: 'return\s+\$\w+->get\s*\(\s*\)\s*;'
        exclude_pattern: '(paginate|limit|take|where|find|first|count|->chunk|->each)'
    remediation: |
      Always paginate or limit API responses:
        return User::latest()->cursorPaginate(25);
        return User::paginate(min($request->integer('per_page', 25), 100));
    references:
      - "https://cwe.mitre.org/data/definitions/770.html"
      - "https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/"
  - id: API-004
    title: "GraphQL introspection enabled in production"
    description: >
      GraphQL introspection is not disabled in production. This exposes the complete API schema - all types, queries, mutations, and arguments - to anyone without requiring credentials.

    severity: medium
    confidence: high
    category: GraphQL Misconfiguration
    tags: [api, graphql, info-disclosure, cwe-200, schema-exposure]
    owasp: "A05:2021"
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: config-files
        pattern: "'introspection'\\s*=>\\s*(true|env\\([^)]*,\\s*true\\))"
    remediation: |
      Disable introspection in production:
        'introspection' => env('GRAPHQL_INTROSPECTION', false),
      Set GRAPHQL_INTROSPECTION=false in all production .env files.
    references:
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://www.apollographql.com/blog/graphql/security/why-you-should-disable-graphql-introspection-in-production/"
  - id: API-004b
    title: "GraphQL - no query depth or complexity limits"
    description: >
      The GraphQL endpoint does not limit query depth or complexity. Attackers can craft deeply nested queries that exponentially increase database queries, causing a denial of service (GraphQL query abuse).

    severity: high
    confidence: medium
    category: GraphQL DoS
    tags: [api, graphql, dos, owasp-a04, cwe-770]
    owasp: "A04:2021"
    cwe: "CWE-770"
    patterns:
      - type: regex
        target: config-files
        pattern: "'max_query_depth'\\s*=>\\s*(null|0)"
    remediation: |
      Limit query depth and complexity:
        // config/lighthouse.php
        'security' => [
            'max_query_depth'      => 7,
            'max_query_complexity' => 200,
        ],
    references:
      - "https://cwe.mitre.org/data/definitions/770.html"
  - id: API-005
    title: "API response contains stack trace or debug info"
    description: >
      API response includes debug information, stack traces, or internal error messages. Stack traces expose file paths, class names, SQL queries, and method signatures - providing attackers with a detailed map of the internal architecture.

    severity: high
    confidence: medium
    category: Information Disclosure
    tags: [api, info-disclosure, owasp-a05, cwe-209]
    owasp: "A05:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: php-files
        pattern: "response\\(\\)->json\\s*\\(\\s*\\[\\s*[\"']?(debug|trace|error_detail|stack_trace|exception)"
        exclude_pattern: '(APP_DEBUG|app\.debug|isLocal|test|Test)'
      - type: regex
        target: php-files
        pattern: '\$e->getTraceAsString\s*\(\s*\)'
        exclude_pattern: '(Log::|logger\(|isLocal|test|Test)'
    remediation: |
      Log details on the server and return generic error messages to the client:
        catch (\Throwable $e) {
            Log::error('API error', ['exception' => $e->getMessage(), 'trace' => $e->getTraceAsString()]);
            return response()->json(['message' => 'An internal error occurred.'], 500);
        }
    references:
      - "https://cwe.mitre.org/data/definitions/209.html"
  - id: API-006
    title: "GraphQL developer IDE or playground enabled"
    description: >
      A GraphQL interactive IDE such as GraphiQL or Playground is enabled in
      configuration. These tools are useful for development but expose schema
      discovery, query experimentation, and endpoint behavior to unauthorized
      parties when left available outside controlled environments.

    severity: medium
    confidence: high
    category: GraphQL Exposure
    tags: [api, graphql, graphiql, playground, owasp-a05, cwe-200]
    owasp: "A05:2021"
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: config-files
        pattern: "['\"](playground|graphiql)['\"]\\s*=>\\s*(true|env\\([^)]*,\\s*true\\))"
    remediation: |
      Disable GraphQL IDE tooling in production and expose it only in local or
      tightly controlled development environments.
    references:
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/"

  - id: API-007
    title: "Webhook or callback endpoint without signature verification evidence"
    description: >
      A function that appears to process webhook, callback, or notification
      traffic reads request body input but no signature or HMAC verification
      indicators are present in the same file. This can allow attackers to forge
      trusted upstream events and trigger unauthorized state changes.

    severity: high
    confidence: medium
    category: Webhook Authentication
    tags: [api, webhook, callback, integrity, owasp-a08, cwe-345]
    owasp: "A08:2021"
    cwe: "CWE-345"
    condition: all
    patterns:
      - type: regex
        target: php-files
        pattern: '(function|public\s+function)\s+\w*(webhook|callback|notify|notification)\w*\s*\('
      - type: regex
        target: php-files
        pattern: '(\$request->getContent\s*\(\)|file_get_contents\s*\(\s*["'']php://input["'']\s*\)|\$request->all\s*\(\)|\$_POST|\$_REQUEST)'
      - type: regex
        target: php-files
        pattern: '(hash_equals|hash_hmac|signature|x-signature|x-hub-signature|webhook_secret|shared_secret)'
        negative: true
    remediation: |
      Verify webhook authenticity using a shared secret or asymmetric signature,
      compare signatures with hash_equals(), and reject unsigned or stale events.
    references:
      - "https://cwe.mitre.org/data/definitions/345.html"
      - "https://owasp.org/API-Security/editions/2023/en/0xa8-security-misconfiguration/"
