meta:
  category: Supply Chain & Dependency Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
rules:
  - id: SUPPLY-002
    title: "Composer - minimum-stability set to 'dev'"
    description: >
      composer.json sets minimum-stability to 'dev', allowing the installation of packages that have not been officially reviewed or tagged. Dev packages are often less tested and may contain unpatched vulnerabilities.

    severity: medium
    confidence: high
    category: Dependency Management
    tags: [supply-chain, composer, owasp-a06, cwe-829]
    cwe: "CWE-829"
    owasp: "A06:2021"
    patterns:
      - type: regex
        target: any
        scope: project
        pattern: '"minimum-stability"\s*:\s*"dev"'
        exclude_pattern: '"prefer-stable"\s*:\s*true'
    remediation: |
      Use minimum-stability 'stable' for production:
        {
            "minimum-stability": "stable",
            "prefer-stable": true
        }
    references:
      - "https://cwe.mitre.org/data/definitions/829.html"
  - id: SUPPLY-003
    title: "Package uses source code loaded from external URL at runtime"
    description: >
      PHP code performs file_get_contents() or cURL requests to an external URL and then evaluates the results via eval(), include, or preg_replace() with the /e flag. This is a command & control (C2) pattern - code from an external server is executed directly on the application server without review or validation.

    severity: critical
    confidence: high
    category: Remote Code Loading
    tags: [supply-chain, remote-code-loading, c2, owasp-a08, cwe-829]
    cwe: "CWE-829"
    owasp: "A08:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'eval\s*\(\s*(file_get_contents|curl_exec|Http::get|Guzzle)'
      - type: regex
        target: php-files
        pattern: '(include|require|include_once|require_once)\s*\(\s*["''](https?://|ftp://)'
    remediation: |
      NEVER load and execute code from an external URL at runtime.
      All dependencies must be managed through Composer and reviewed before installation.
    references:
      - "https://cwe.mitre.org/data/definitions/829.html"
