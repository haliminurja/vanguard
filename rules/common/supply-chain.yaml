meta:
  category: Supply Chain & Dependency Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
rules:
  - id: SUPPLY-001
    title: "Composer - dependensi dengan versi wildcard (*) tanpa lock file"
    description: >
      composer.json mendefinisikan dependensi dengan constraint versi wildcard (*) atau terlalu luas. Tanpa composer.lock yang di-commit, setiap install atau update dapat menarik versi yang berbeda, termasuk versi yang mungkin mengandung backdoor atau vulnerability baru.

    severity: high
    confidence: medium
    category: Dependency Management
    tags: [supply-chain, composer, owasp-a06, cwe-829]
    cwe: "CWE-829"
    owasp: "A06:2021"
    patterns:
      - type: regex
        target: any
        scope: project
        pattern: '"require"[^}]*"\\*"'
    remediation: |
      Gunakan constraint versi yang spesifik dan commit composer.lock:
        // composer.json
        "require": {
            "laravel/framework": "^11.0",     // Bukan "*"
            "stripe/stripe-php": "^13.0"
        }
      Selalu commit composer.lock ke version control:
        git add composer.lock
    references:
      - "https://cwe.mitre.org/data/definitions/829.html"
      - "https://getcomposer.org/doc/01-basic-usage.md#commit-your-composer-lock-file-to-version-control"
  - id: SUPPLY-002
    title: "Composer - minimum-stability disetel ke 'dev'"
    description: >
      composer.json menyetel minimum-stability ke 'dev', mengizinkan instalasi package yang belum di-review atau di-tag secara resmi. Package dev sering kali kurang teruji dan mungkin mengandung kerentanan yang belum diperbaiki.

    severity: medium
    confidence: high
    category: Dependency Management
    tags: [supply-chain, composer, owasp-a06, cwe-829]
    cwe: "CWE-829"
    owasp: "A06:2021"
    patterns:
      - type: regex
        target: any
        scope: project
        pattern: '"minimum-stability"\s*:\s*"dev"'
        exclude_pattern: '"prefer-stable"\s*:\s*true'
    remediation: |
      Gunakan minimum-stability 'stable' untuk production:
        {
            "minimum-stability": "stable",
            "prefer-stable": true
        }
    references:
      - "https://cwe.mitre.org/data/definitions/829.html"
  - id: SUPPLY-003
    title: "Package menggunakan source code yang di-load dari URL eksternal saat runtime"
    description: >
      Kode PHP melakukan file_get_contents() atau cURL request ke URL eksternal dan kemudian men-evaluate hasilnya via eval(), include, atau preg_replace() dengan flag /e. Ini adalah pattern command & control (C2) - kode dari server eksternal dieksekusi langsung di server aplikasi tanpa review atau validasi.

    severity: critical
    confidence: high
    category: Remote Code Loading
    tags: [supply-chain, remote-code-loading, c2, owasp-a08, cwe-829]
    cwe: "CWE-829"
    owasp: "A08:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: 'eval\s*\(\s*(file_get_contents|curl_exec|Http::get|Guzzle)'
      - type: regex
        target: php-files
        pattern: '(include|require|include_once|require_once)\s*\(\s*["''](https?://|ftp://)'
    remediation: |
      JANGAN PERNAH memuat dan mengeksekusi kode dari URL eksternal saat runtime.
      Semua dependensi harus dikelola melalui Composer dan di-review sebelum instalasi.
    references:
      - "https://cwe.mitre.org/data/definitions/829.html"
  - id: SUPPLY-004
    title: "Composer post-install/post-update script menjalankan command arbitrary"
    description: >
      composer.json mendefinisikan post-install-cmd atau post-update-cmd script yang menjalankan command shell arbitrer. Jika package dependency yang terkompromi memodifikasi script ini, command berbahaya akan dieksekusi secara otomatis saat developer menjalankan composer install atau composer update.

    severity: high
    confidence: medium
    category: Build Pipeline
    tags: [supply-chain, composer, build-security, owasp-a08, cwe-829]
    cwe: "CWE-829"
    owasp: "A08:2021"
    patterns:
      - type: regex
        target: any
        scope: project
        pattern: '"(post-install-cmd|post-update-cmd)"[^}]*(curl|wget|bash|sh\s+-c|exec|system)'
    remediation: |
      Review semua Composer script dan batasi ke command yang dikenal:
        "scripts": {
            "post-install-cmd": [
                "@php artisan package:discover"
            ],
            "post-update-cmd": [
                "@php artisan vendor:publish -tag=laravel-assets -ansi -force"
            ]
        }
    references:
      - "https://cwe.mitre.org/data/definitions/829.html"
