meta:
  category: Secrets & Hardcoded Credentials
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: SEC-G01
    title: "Password hardcoded dalam source PHP"
    description: >
      Password tampaknya di-hardcode sebagai string literal. Terlihat oleh siapa saja yang memiliki akses repository dan tidak dapat dirotasi tanpa deploy ulang.

    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, cwe-798]
    cwe: "CWE-798"
    owasp: "A02:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$pass(word|wd)?\s*=\s*["''][a-zA-Z0-9!@#$%^&*_.@\-]{6,}["'']'
        exclude_pattern: '(env\(|config\(|getenv\(|test|Test|spec|fake|//|#\s|/\*|example|placeholder)'
    remediation: |
      Gunakan environment variable:
        $password = env('DB_PASSWORD');
        $password = config('database.connections.mysql.password');
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-G02
    title: "API key atau secret hardcoded dalam source PHP"
    description: >
      Variabel api_key, api_secret, secret_key, atau serupa ditetapkan dengan string literal. Eksposur key ini memberikan akses ke layanan pihak ketiga.

    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, cwe-798]
    owasp: "A01:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(api_key|api_secret|secret_key|access_key|app_secret|client_secret)\s*[=:]\s*["''][a-zA-Z0-9_\-]{8,}["'']'
        exclude_pattern: '(env\(|config\(|getenv\(|test|Test|spec|fake|//|#\s|/\*|example|your-)'
    remediation: |
      Simpan API key di .env:
        $apiKey = env('SERVICE_API_KEY');
        $apiKey = config('services.stripe.secret');
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-G03
    title: "Private key PEM tertanam dalam source code"
    description: >
      Header private key PEM ditemukan. Private key yang tersimpan di source code memberikan kemampuan mendekripsi data, memalsukan token JWT, atau autentikasi ke layanan.

    severity: critical
    confidence: high
    category: Exposed Private Key
    tags: [secrets, crypto, cwe-321]
    owasp: "A02:2021"
    cwe: "CWE-321"
    patterns:
      - type: regex
        target: php-files
        pattern: '-BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-'
    remediation: |
      Simpan private key di luar repository:
        $key = file_get_contents(env('PRIVATE_KEY_PATH'));
        // Atau gunakan AWS Secrets Manager, HashiCorp Vault
        // SEGERA rotasi key yang terekspos.
    references:
      - "https://cwe.mitre.org/data/definitions/321.html"
  - id: SEC-G04
    title: "Bearer token hardcoded dalam source"
    description: >
      Literal Bearer token dalam source code tidak dapat dirotasi tanpa deploy ulang dan terekspos ke seluruh tim yang memiliki akses repository.

    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, cwe-798]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '["'']Bearer\s+[a-zA-Z0-9._\-]{20,}["'']'
        exclude_pattern: '(env\(|config\(|test|Test|spec|fake|//|#\s|/\*|example)'
    remediation: |
      $token = env('SERVICE_BEARER_TOKEN');
      Http::withToken(config('services.api.token'))->get($url);
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-G05
    title: "JWT secret hardcoded dalam source"
    description: >
      JWT secret di-hardcode. Jika dikompromikan, penyerang dapat memalsukan token autentikasi untuk pengguna manapun termasuk admin.

    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, jwt, cwe-798]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(jwt_secret|jwt_key|JWT_SECRET|jwtSecret)\s*[=:>]\s*["''][a-zA-Z0-9!@#$%^&*_.]{12,}["'']'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s|/\*|example)'
    remediation: |
      JWT_SECRET=<openssl rand -base64 64>
      'secret' => env('JWT_SECRET'),
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-G06
    title: "Laravel APP_KEY atau encryption key hardcoded dalam source"
    description: >
      APP_KEY di-hardcode dalam source PHP. Ini mengkompromikan semua data terenkripsi dan memungkinkan pemalsuan cookie session.

    severity: critical
    confidence: high
    category: Hardcoded Encryption Key
    tags: [secrets, encryption, cwe-798, laravel]
    owasp: "A07:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(APP_KEY|app_key|encryption_key)\s*[=:>]\s*["'']base64:[A-Za-z0-9+/=]{40,}["'']'
    remediation: |
      APP_KEY hanya di .env, tidak pernah di-commit:
        php artisan key:generate
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://laravel.com/docs/encryption"
  - id: SEC-G07
    title: "Database credentials hardcoded langsung dalam PHP"
    description: >
      Kredensial koneksi database di-hardcode dalam source PHP menggunakan mysqli_connect(), PDO(), dll. alih-alih menggunakan konfigurasi database Laravel.

    severity: high
    confidence: medium
    category: Hardcoded Credentials
    tags: [secrets, database, cwe-798]
    owasp: "A03:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(mysqli?_connect|new\s+PDO|new\s+mysqli)\s*\(\s*["''][^"'']+["'']'
        exclude_pattern: '(env\(|config\(|test|Test|spec)'
    remediation: |
      Gunakan konfigurasi database Laravel dengan env():
        DB_HOST=localhost
        DB_PASSWORD=strong-password
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-T01
    title: "AWS credentials hardcoded dalam source"
    description: >
      AWS access key ID (AKIA/ASIA/AROA) atau secret access key ditemukan. Memberikan akses ke semua resource AWS - S3, EC2, RDS, Lambda.

    severity: critical
    confidence: high
    category: Cloud Credentials
    tags: [secrets, aws, cwe-798, cloud]
    owasp: "A01:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(AKIA|ASIA|AROA)[0-9A-Z]{16}'
      - type: regex
        target: php-files
        pattern: 'aws_secret_access_key\s*[=:]\s*["''][A-Za-z0-9/+=]{30,}["'']'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      Gunakan IAM roles atau environment variable:
        AWS_ACCESS_KEY_ID=AKIA...
        AWS_SECRET_ACCESS_KEY=...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"
  - id: SEC-T02
    title: "Stripe API key hardcoded dalam source"
    description: >
      Stripe secret key (sk_live_/sk_test_) ditemukan. Memberikan akses penuh ke akun Stripe: charge, refund, data pelanggan, payout.

    severity: critical
    confidence: high
    category: Payment Credentials
    tags: [secrets, stripe, cwe-798, payment]
    owasp: "A05:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'sk_(live|test)_[a-zA-Z0-9]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s|pk_)'
    remediation: |
      STRIPE_SECRET=sk_live_...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://stripe.com/docs/keys"
  - id: SEC-T03
    title: "Google API key hardcoded dalam source"
    description: >
      Google API key (prefix AIza) ditemukan. Dapat digunakan untuk mengakses layanan GCP dan menimbulkan biaya pada billing account.

    severity: high
    confidence: high
    category: Cloud Credentials
    tags: [secrets, google, cwe-798, gcp]
    owasp: "A05:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'AIza[0-9A-Za-z_\-]{35}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      GOOGLE_API_KEY=AIza...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-T04
    title: "Twilio credentials hardcoded dalam source"
    description: >
      Twilio Account SID (AC prefix) atau Auth Token ditemukan. Memberikan akses penuh ke Twilio API untuk SMS dan panggilan telepon.

    severity: high
    confidence: high
    category: Service Credentials
    tags: [secrets, twilio, cwe-798]
    owasp: "A07:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'AC[a-f0-9]{32}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      TWILIO_SID=AC...
      TWILIO_TOKEN=...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-T05
    title: "SendGrid / Mailgun / Postmark API key hardcoded"
    description: >
      API key layanan email transaksional ditemukan. Memungkinkan pengiriman email atas nama domain Anda - risiko spam atau phishing.

    severity: high
    confidence: high
    category: Service Credentials
    tags: [secrets, email-service, cwe-798]
    owasp: "A05:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'SG\.[a-zA-Z0-9_\-]{20,}\.[a-zA-Z0-9_\-]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
      - type: regex
        target: php-files
        pattern: 'key-[a-f0-9]{32}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      MAIL_USERNAME=apikey
      MAIL_PASSWORD=SG.xxx...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-T06
    title: "GitHub / GitLab / Bitbucket personal access token hardcoded"
    description: >
      GitHub (ghp_/gho_/ghs_), GitLab (glpat-), atau Bitbucket token ditemukan. Dapat memberikan akses baca/tulis ke repository private dan secret.

    severity: critical
    confidence: high
    category: Version Control Credentials
    tags: [secrets, github, gitlab, cwe-798, vcs]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'gh[pousr]_[a-zA-Z0-9]{36,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
      - type: regex
        target: php-files
        pattern: 'glpat-[a-zA-Z0-9_\-]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      GITHUB_TOKEN=ghp_...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-E01
    title: "File .env production/staging ter-commit ke repository"
    description: >
      File .env spesifik environment ter-commit ke version control. Mengandung semua kredensial production - jika repository bocor, seluruh infrastruktur terkompromi.

    severity: critical
    confidence: high
    category: Exposed Config File
    tags: [secrets, cwe-538, env-file]
    owasp: "A05:2021"
    cwe: "CWE-538"
    patterns:
      - type: file-exists
        pattern: ".env.production"
      - type: file-exists
        pattern: ".env.staging"
      - type: file-exists
        pattern: ".env.backup"
      - type: file-exists
        pattern: ".env.live"
      - type: file-exists
        pattern: ".env.prod"
    remediation: |
      .env
      .env.*
      !.env.example

      git rm -cached .env.production
    references:
      - "https://cwe.mitre.org/data/definitions/538.html"
  - id: SEC-E02
    title: "APP_DEBUG=true dalam file .env"
    description: >
      APP_DEBUG=true memaparkan stack trace lengkap, query database, nilai environment, dan konfigurasi PHP di browser response setiap exception.

    severity: critical
    confidence: high
    category: Debug Exposure
    tags: [debug, info-disclosure, owasp-a05, cwe-215]
    owasp: "A05:2021"
    cwe: "CWE-215"
    patterns:
      - type: regex
        target: env-files
        pattern: 'APP_DEBUG\s*=\s*true'
    remediation: |
      APP_DEBUG=false  
    references:
      - "https://cwe.mitre.org/data/definitions/215.html"
      - "https://laravel.com/docs/configuration#debug-mode"
  - id: SEC-E03
    title: "APP_URL menggunakan HTTP di environment non-lokal"
    description: >
      APP_URL=http:// di environment non-lokal. Laravel menggunakan APP_URL untuk link reset password, verifikasi email, dan signed URL - HTTP mengirimkan token melalui koneksi tidak terenkripsi.

    severity: high
    confidence: medium
    category: Insecure Transport
    tags: [ssl, owasp-a05, cwe-319]
    owasp: "A05:2021"
    cwe: "CWE-319"
    patterns:
      - type: regex
        target: env-files
        pattern: 'APP_URL\s*=\s*http://'
        exclude_pattern: '(localhost|127\.0\.0\.1|::1|\.test|\.local|\.dev|0\.0\.0\.0)'
    remediation: |
      APP_URL=https://myapp.com
    references:
      - "https://cwe.mitre.org/data/definitions/319.html"
  - id: SEC-ENT-001
    title: "High Entropy String Terdeteksi (Kemungkinan Secret Key)"
    description: >
      Engine Vanguard mendeteksi string dengan level entropy (keacakan matematis) yang sangat tinggi (>4.5).
      Ini biasanya mengindikasikan adanya cryptographic key, salt, JWT secret acak, atau token autentikasi panjang yang di-hardcode dalam kode alih-alih diload dari environment variables.
    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, entropy, cwe-798]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: entropy
        target: php-files
        pattern: "4.5"
    remediation: |
      Pindahkan secret key atau token yang teredeteksi ke dalam file .env 
      dan gunakan helper `env()` atau `config()` untuk memanggilnya.
      Contoh: $secret = env('CUSTOM_API_SECRET');
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
