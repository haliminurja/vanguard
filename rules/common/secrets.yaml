meta:
  category: Secrets & Hardcoded Credentials
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "PHP native 8.0-8.4 (framework-agnostic baseline)"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
rules:
  - id: SEC-G01
    title: "Hardcoded password in PHP source"
    description: >
      Passwords appear to be hardcoded as string literals. Visible to anyone with repository access and cannot be rotated without a redeploy.

    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, cwe-798]
    cwe: "CWE-798"
    owasp: "A02:2021"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$pass(word|wd)?\s*=\s*["''][a-zA-Z0-9!@#$%^&*_.@\-]{6,}["'']'
        exclude_pattern: '(env\(|config\(|getenv\(|test|Test|spec|fake|//|#\s|/\*|example|placeholder)'
    remediation: |
      Use environment variables:
        $password = env('DB_PASSWORD');
        $password = config('database.connections.mysql.password');
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-G02
    title: "Hardcoded API key or secret in PHP source"
    description: >
      api_key, api_secret, secret_key, or similar variables are assigned string literals. Exposure of these keys grants access to third-party services.

    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, cwe-798]
    owasp: "A01:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(api_key|api_secret|secret_key|access_key|app_secret|client_secret)\s*[=:]\s*["''][a-zA-Z0-9_\-]{8,}["'']'
        exclude_pattern: '(env\(|config\(|getenv\(|test|Test|spec|fake|//|#\s|/\*|example|your-)'
    remediation: |
      Store API keys in .env:
        $apiKey = env('SERVICE_API_KEY');
        $apiKey = config('services.stripe.secret');
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-G03
    title: "PEM private key embedded in source code"
    description: >
      PEM private key headers found. Private keys stored in source code allow data decryption, forging JWT tokens, or service authentication.

    severity: critical
    confidence: high
    category: Exposed Private Key
    tags: [secrets, crypto, cwe-321]
    owasp: "A02:2021"
    cwe: "CWE-321"
    patterns:
      - type: regex
        target: php-files
        pattern: '-BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-'
    remediation: |
      Store private keys outside of the repository:
        $key = file_get_contents(env('PRIVATE_KEY_PATH'));
        // Or use AWS Secrets Manager, HashiCorp Vault
        // IMMEDIATELY rotate exposed keys.
    references:
      - "https://cwe.mitre.org/data/definitions/321.html"
  - id: SEC-G04
    title: "Hardcoded Bearer token in source"
    description: >
      Literal Bearer tokens in source code cannot be rotated without a redeploy and are exposed to the entire team with repository access.

    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, cwe-798]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '["'']Bearer\s+[a-zA-Z0-9._\-]{20,}["'']'
        exclude_pattern: '(env\(|config\(|test|Test|spec|fake|//|#\s|/\*|example)'
    remediation: |
      $token = env('SERVICE_BEARER_TOKEN');
      Http::withToken(config('services.api.token'))->get($url);
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-G05
    title: "Hardcoded JWT secret in source"
    description: >
      JWT secret is hardcoded. If compromised, an attacker can forge authentication tokens for any user including admins.

    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, jwt, cwe-798]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(jwt_secret|jwt_key|JWT_SECRET|jwtSecret)\s*[=:>]\s*["''][a-zA-Z0-9!@#$%^&*_.]{12,}["'']'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s|/\*|example)'
    remediation: |
      JWT_SECRET=<openssl rand -base64 64>
      'secret' => env('JWT_SECRET'),
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-T01
    title: "Hardcoded AWS credentials in source"
    description: >
      AWS access key ID (AKIA/ASIA/AROA) or secret access key found. Grants access to all AWS resources - S3, EC2, RDS, Lambda.

    severity: critical
    confidence: high
    category: Cloud Credentials
    tags: [secrets, aws, cwe-798, cloud]
    owasp: "A01:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(AKIA|ASIA|AROA)[0-9A-Z]{16}'
      - type: regex
        target: php-files
        pattern: 'aws_secret_access_key\s*[=:]\s*["''][A-Za-z0-9/+=]{30,}["'']'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      Use IAM roles or environment variables:
        AWS_ACCESS_KEY_ID=AKIA...
        AWS_SECRET_ACCESS_KEY=...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html"
  - id: SEC-T02
    title: "Hardcoded Stripe API key in source"
    description: >
      Stripe secret key (sk_live_/sk_test_) found. Grants full access to Stripe account: charges, refunds, customer data, payouts.

    severity: critical
    confidence: high
    category: Payment Credentials
    tags: [secrets, stripe, cwe-798, payment]
    owasp: "A05:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'sk_(live|test)_[a-zA-Z0-9]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s|pk_)'
    remediation: |
      STRIPE_SECRET=sk_live_...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://stripe.com/docs/keys"
  - id: SEC-T03
    title: "Hardcoded Google API key in source"
    description: >
      Google API key (AIza prefix) found. Can be used to access GCP services and incur charges on the billing account.

    severity: high
    confidence: high
    category: Cloud Credentials
    tags: [secrets, google, cwe-798, gcp]
    owasp: "A05:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'AIza[0-9A-Za-z_\-]{35}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      GOOGLE_API_KEY=AIza...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-T04
    title: "Hardcoded Twilio credentials in source"
    description: >
      Twilio Account SID (AC prefix) or Auth Token found. Grants full access to Twilio API for SMS and calls.

    severity: high
    confidence: high
    category: Service Credentials
    tags: [secrets, twilio, cwe-798]
    owasp: "A07:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'AC[a-f0-9]{32}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      TWILIO_SID=AC...
      TWILIO_TOKEN=...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-T05
    title: "Hardcoded SendGrid / Mailgun / Postmark API key"
    description: >
      Transactional email service API key found. Allows sending emails on behalf of your domain - risk of spam or phishing.

    severity: high
    confidence: high
    category: Service Credentials
    tags: [secrets, email-service, cwe-798]
    owasp: "A05:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: 'SG\.[a-zA-Z0-9_\-]{20,}\.[a-zA-Z0-9_\-]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
      - type: regex
        target: php-files
        pattern: 'key-[a-f0-9]{32}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s)'
    remediation: |
      MAIL_USERNAME=apikey
      MAIL_PASSWORD=SG.xxx...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: SEC-T06
    title: "Hardcoded GitHub / GitLab personal access token"
    description: >
      GitHub (ghp_/gho_/ghs_/github_pat_) or GitLab token (glpat-) found.
      This token can grant read/write access to private repositories, secrets, or CI pipelines.

    severity: critical
    confidence: high
    category: Version Control Credentials
    tags: [secrets, github, gitlab, cwe-798, vcs]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: any
        pattern: 'gh[pousr]_[a-zA-Z0-9]{36,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s|README|CHANGELOG|docs?|example|sample|dummy)'
      - type: regex
        target: any
        pattern: 'github_pat_[A-Za-z0-9_]{70,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s|README|CHANGELOG|docs?|example|sample|dummy)'
      - type: regex
        target: any
        pattern: 'glpat-[a-zA-Z0-9_\-]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|//|#\s|README|CHANGELOG|docs?|example|sample|dummy)'
    remediation: |
      GITHUB_TOKEN=ghp_...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"

  - id: SEC-T07
    title: "Hardcoded OpenAI / Anthropic API key"
    description: >
      AI provider API key found directly in source/config. These keys can be
      misused to access models, sensitive data, and incur high costs.
    severity: critical
    confidence: medium
    category: AI Service Credentials
    tags: [secrets, openai, anthropic, ai, cwe-798]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: any
        pattern: 'sk-proj-[A-Za-z0-9_\-]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|example|placeholder|dummy|sample|README|CHANGELOG|docs?)'
      - type: regex
        target: any
        pattern: 'sk-ant-[A-Za-z0-9_\-]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|example|placeholder|dummy|sample|README|CHANGELOG|docs?)'
      - type: regex
        target: any
        pattern: 'sk-[A-Za-z0-9]{40,}'
        exclude_pattern: '(sk_(live|test)_|pk_(live|test)_|env\(|config\(|test|Test|example|placeholder|dummy|sample|README|CHANGELOG|docs?)'
    remediation: |
      Store AI provider keys in secret managers / environment variables:
        OPENAI_API_KEY=sk-proj-...
        ANTHROPIC_API_KEY=sk-ant-...
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://platform.openai.com/docs/guides/production-best-practices/api-key-safety"

  - id: SEC-T08
    title: "Hardcoded Slack token (xox*/xapp*)"
    description: >
      Slack bot/user/app token found in source. Can be used to access the workspace, read channels, or send messages on behalf of the application.
    severity: high
    confidence: high
    category: Service Credentials
    tags: [secrets, slack, cwe-798]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: any
        pattern: 'xox[baprs]-[0-9A-Za-z\-]{10,}'
        exclude_pattern: '(env\(|config\(|test|Test|example|placeholder|dummy|sample|README|CHANGELOG|docs?)'
      - type: regex
        target: any
        pattern: 'xapp-[0-9A-Za-z\-]{20,}'
        exclude_pattern: '(env\(|config\(|test|Test|example|placeholder|dummy|sample|README|CHANGELOG|docs?)'
    remediation: |
      Store Slack tokens in a secret manager and rotate immediately if committed.
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://api.slack.com/authentication/token-types"
  - id: SEC-E01
    title: "Production/staging .env file committed to repository"
    description: >
      Environment-specific .env files committed to version control. Contains all production credentials - if the repository is leaked, the entire infrastructure is compromised.

    severity: critical
    confidence: high
    category: Exposed Config File
    tags: [secrets, cwe-538, env-file]
    owasp: "A05:2021"
    cwe: "CWE-538"
    patterns:
      - type: file-exists
        pattern: ".env.production"
      - type: file-exists
        pattern: ".env.staging"
      - type: file-exists
        pattern: ".env.backup"
      - type: file-exists
        pattern: ".env.live"
      - type: file-exists
        pattern: ".env.prod"
    remediation: |
      Add these to .gitignore:
        .env
        .env.*
        !.env.example

      Remove from repository:
        git rm -cached .env.production
    references:
      - "https://cwe.mitre.org/data/definitions/538.html"
  - id: SEC-ENT-001
    title: "High Entropy String Detected (Likely Secret Key)"
    description: >
      The Vanguard engine detected a string with a very high entropy level (mathematical randomness) (>4.5).
      This usually indicates a cryptographic key, salt, random JWT secret, or a long authentication token hardcoded in the code instead of being loaded from environment variables.
    severity: high
    confidence: medium
    category: Hardcoded Secret
    tags: [secrets, entropy, cwe-798]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: entropy
        target: php-files
        pattern: "4.5"
    remediation: |
      Move the detected secret key or token into a .env file 
      and use the `env()` or `config()` helper to call it.
      Example: $secret = env('CUSTOM_API_SECRET');
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
