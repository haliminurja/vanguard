
meta:
  category: WordPress Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "WordPress 5.0-6.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001

rules:

  - id: WP-ENT-001
    title: "Privilege Escalation via Unguarded update_option() / update_user_meta()"
    description: >
      WordPress saves core site configurations and user roles via the `options` and `usermeta` tables. If the $option_name and $option_value are driven directly from user input (e.g. `$_POST['key']`), an attacker can update `default_role` to administrator, or change `siteurl` to hijack the deployment.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
    category: Privilege Escalation / Mass Assignment
    enabled: true
    tags: [privesc, mass-assignment, wordpress, owasp-a01-2021, cwe-269, cwe-284, cwe-915]
    owasp: "A01:2021"
    cwe: "CWE-269"
    patterns:
      - type: regex
        target: php-files
        pattern: '(update_option|update_user_meta)\s*\(\s*(\$_POST|\$_GET|\$_REQUEST|\$request_data)\[[^\]]+\]\s*,'
      - type: regex
        target: php-files
        pattern: '(update_option|update_user_meta)\s*\([^,]+,\s*(\$_POST|\$_GET|\$_REQUEST)\[[^\]]+\]\)'
        exclude_pattern: '(sanitize_text_field|sanitize_key|intval|absint|wp_verify_nonce|check_admin_referer)'
      - type: regex
        target: php-files
        pattern: 'foreach\s*\(\s*\$_POST\s+as\s+\$key\s*=>\s*\$val\s*\)\s*\{[^}]*update_option'
    remediation: |
      Always strictly whitelist which options can be updated and check capabilities/nonces:
      `if ($key === 'custom_plugin_settings') update_option($key, sanitize_text_field($value));`

    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/269.html"
  - id: WP-ENT-002
    title: "SQL Injection via $wpdb Unprepared Operations"
    description: >
      WordPress `$wpdb` accepts raw SQL statements. If `$wpdb->query()`, `$wpdb->get_results()`, or `$wpdb->get_col()` are called with string concatenation rather than enforcing `$wpdb->prepare()`, the database is completely open to catastrophic SQL injection (exfiltration of `wp_users` keys).
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: SQL Injection
    enabled: true
    tags: [sqli, wordpress, owasp-a03-2021, cwe-89, pci-dss-6.2]
    owasp: "A03:2021"
    cwe: "CWE-89"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$wpdb->(query|get_results|get_col|get_row|get_var)\s*\(\s*["''].*\.\s*\$'
        exclude_pattern: '(\$wpdb->prepare|intval|absint|sanitize_key)'
      - type: regex
        target: php-files
        pattern: '\$wpdb->(query|get_results|get_col|get_row|get_var)\s*\(\s*[''"][^''"]*\$_(?:GET|POST|REQUEST)'
      - type: regex
        target: php-files
        pattern: 'ORDER\s+BY\s*[''"][^''"]*\.\s*\$(?:_GET|_POST|_REQUEST|order|orderby)'
        exclude_pattern: 'wpdb->prepare'
    remediation: |
      Wrap all SQL strings containing dynamic variables inside `$wpdb->prepare()`:
      `$wpdb->query($wpdb->prepare("SELECT * FROM {$wpdb->prefix}table WHERE id = %d", $id));`

    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/89.html"
  - id: WP-ENT-003
    title: "Unauthenticated Admin-Ajax Hooks Performing Privileged Actions"
    description: >
      Hooks defined with `add_action('wp_ajax_nopriv_*', ...)` bypass authentication and execute actions for guest users. If a developer uses a `wp_ajax_nopriv_` hook to perform a sensitive CRUD action intended only for admins, any unauthenticated attacker can execute it.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authentication Bypass
    enabled: true
    tags: [auth-bypass, wordpress, owasp-a01-2021, cwe-285, cwe-306]
    owasp: "A01:2021"
    cwe: "CWE-285"
    patterns:
      - type: regex
        target: php-files
        pattern: 'add_action\s*\(\s*["'']wp_ajax_nopriv_(update|delete|insert|save|edit|admin|remove|set|create|upload)[^"'']*["'']'
      - type: regex
        target: php-files
        pattern: 'wp_ajax_nopriv_[^\s]+[^}]*(wp_update_user|wp_set_current_user|wp_set_auth_cookie|add_user_to_blog)'
    remediation: |
      Ensure administrative or destructive tasks are only ever bound to `wp_ajax_` hooks (which require the user to be logged in) AND the handler function calls `current_user_can()`.

    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/285.html"
  - id: WP-ENT-004
    title: "CSRF - State-Changing Request Without wp_verify_nonce() Validation"
    description: >
      Updates, Deletions, or Modifying endpoints are receiving raw data but the WordPress handler never validates `$_POST['_wpnonce']` via `wp_verify_nonce()` or `check_ajax_referer()`. This allows attackers to formulate CSRF payloads forcing a victim to unwittingly execute destructive behavior.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: CSRF
    enabled: true
    tags: [csrf, wordpress, owasp-a05-2021, cwe-352]
    owasp: "A05:2021"
    cwe: "CWE-352"
    patterns:
      - type: regex
        target: php-files
        pattern: '(wp_update_post|wp_insert_post|wp_delete_post)\s*\([^;]*\)'
        exclude_pattern: '(wp_verify_nonce|check_admin_referer)'
    remediation: |
      Every destructive custom API or Plugin Options save block must verify its unique nonce:
      `if (!isset($_POST['_wpnonce']) || !wp_verify_nonce($_POST['_wpnonce'], 'my_action')) { wp_die(); }`

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/352.html"
  - id: WP-ENT-005
    title: "Stored / Reflected XSS via Missing Output Escaping in Plugin Templates"
    description: >
      When plugin or theme templates echo raw database values or user input without escaping,
      attackers can inject persistent JavaScript payloads.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H"
    category: Cross-Site Scripting (XSS)
    enabled: true
    tags: [xss, stored-xss, wordpress, owasp-a03-2021, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: php-files
        pattern: 'echo\s+(get_option|get_post_meta|get_user_meta)\s*\('
        exclude_pattern: '(esc_html|esc_attr|esc_url|wp_kses|intval|absint)'
      - type: regex
        target: php-files
        pattern: 'echo\s+\$_(?:GET|POST|REQUEST)\['
    remediation: |
      Always escape at the point of output, not at the point of storage using functions like `esc_html()`, `esc_attr()`, `esc_url()`, or `wp_kses_post()`.

    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: WP-ENT-006
    title: "Server-Side Request Forgery (SSRF) via Unvalidated wp_remote_get()"
    description: >
      Calling `wp_remote_get()`, `wp_remote_post()`, or `wp_safe_remote_get()` using a
      user-provided URL without sufficient validation allows an attacker to
      make the server send HTTP requests to internal networks or cloud metadata APIs.
      Note: `wp_safe_remote_get()` only drops redirects, it does not prevent all SSRF!
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.3
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N"
    category: Server-Side Request Forgery (SSRF)
    enabled: true
    tags: [ssrf, wordpress, owasp-a10-2021, cwe-918]
    owasp: "A10:2021"
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: php-files
        pattern: 'wp_remote_(get|post|request)\s*\(\s*(\$_(GET|POST|REQUEST)\[|\$request_data\[)'
        exclude_pattern: '(esc_url_raw|wp_http_validate_url)'
    remediation: |
      Always use `wp_http_validate_url( $url )` which rejects local IP addresses,
      `127.0.0.1`, and validates hostnames before making the outbound request.

    references:
      - "https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_(SSRF)/"
      - "https://cwe.mitre.org/data/definitions/918.html"
  - id: WP-ENT-007
    title: "XML-RPC Enabled (Bruteforce & Pingback SSRF)"
    description: >
      The legacy xmlrpc.php endpoint allows attackers to perform massive, amplified
      bruteforce attacks against `wp_users` via the `system.multicall` method. It
      also enables Pingback SSRF (`pingback.ping`).
    severity: medium
    confidence: medium
    cvss_v3:
      score: 6.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:L/A:L"
    category: Configuration / SSRF
    enabled: true
    tags: [xmlrpc, bruteforce, ssrf, pingback, wordpress]
    owasp: "A10:2021"
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: php-files
        pattern: 'add_filter\s*\(\s*[''"]xmlrpc_enabled[''"]\s*,\s*[''"]__return_true[''"]'
    remediation: |
      Disable XML-RPC entirely if not actively used by an external app (like the WordPress mobile app).
      ```php
      add_filter('xmlrpc_enabled', '__return_false');
      ```
      Also configure the WAF/WebServer to block requests to `/xmlrpc.php`.

    references:
      - "https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_(SSRF)/"
      - "https://cwe.mitre.org/data/definitions/918.html"
  - id: WP-ENT-008
    title: "Potensial Ekspor Konfigurasi Sensitif via wp-config.php Path Disclosure"
    description: >
      File `wp-config.php` mengandung kredensial database dan keys salt. Jika server diklasifikasikan salah atau mengizinkan directory listing, file ini bisa bocor. Secara spesifik, aturan ini mencari manipulasi path yang mungkin menargetkan file konfigurasi ini.
    severity: critical
    confidence: high
    category: Information Disclosure
    tags: [config-exposure, wordpress, cwe-200]
    owasp: "A05:2021"
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: php-files
        pattern: 'include(_once)?\s*\(?.*wp-config\.php'
        exclude_pattern: 'ABSPATH'
    remediation: |
      Pastikan `wp-config.php` berada di luar root publik jika didukung oleh instalasi, atau pastikan izin file diset ke 600 atau 640.

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/200.html"
  - id: WP-ENT-009
    title: "FORCE_SSL_ADMIN Tidak Diaktifkan"
    description: >
      Tanpa `FORCE_SSL_ADMIN` diset ke true di `wp-config.php`, kredensial admin WordPress dikirim melalui HTTP yang tidak terenkripsi pada beberapa konfigurasi, memungkinkan sniffing kata sandi dan pembajakan sesi.
    severity: high
    confidence: high
    category: Insecure Configuration
    tags: [ssl, wordpress, cwe-319]
    owasp: "A05:2021"
    cwe: "CWE-319"
    patterns:
      - type: regex
        target: php-files
        pattern: "define\\(\\s*['\"]FORCE_SSL_ADMIN['\"]\\s*,\\s*false\\s*\\)"
    remediation: |
      Set `define('FORCE_SSL_ADMIN', true);` di file `wp-config.php` Anda.

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/319.html"
  - id: WP-ENT-010
    title: "File Editing Diaktifkan di Dashboard (DISALLOW_FILE_EDIT)"
    description: >
      Jika `DISALLOW_FILE_EDIT` tidak diset ke true, admin dapat mengedit file PHP langsung dari dashboard WordPress. Jika akun admin terkompromi, ini memberikan penyerang akses RCE instan untuk menanam backdoor di server.
    severity: medium
    confidence: medium
    category: Hardening
    tags: [rce, hardening, wordpress]
    owasp: "A05:2021"
    cwe: "CWE-20"
    patterns:
      - type: regex
        target: php-files
        pattern: "define\\(\\s*['\"]DISALLOW_FILE_EDIT['\"]\\s*,\\s*false\\s*\\)"
    remediation: |
      Tambahkan `define('DISALLOW_FILE_EDIT', true);` ke `wp-config.php` untuk menonaktifkan editor file dashboard.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/20.html"
