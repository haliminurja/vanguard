meta:
  category: WordPress - Business Logic
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "WordPress 5.0-6.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: WP-BIZ-001
    title: "Privileged WordPress business mutation without clear capability check"
    description: >
      WordPress code performs privileged content, option, user, or refund
      mutations without nearby evidence of `current_user_can()` or equivalent
      capability enforcement.
    severity: high
    confidence: medium
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [wordpress, business-logic, access-control, owasp-a01-2021, cwe-840, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: '(update_option|update_user_meta|wp_update_post|wp_delete_post|wc_create_refund)\s*\('
        exclude_pattern: '(current_user_can\s*\(|user_can\s*\(|map_meta_cap|manage_options|edit_post)'
    remediation: |
      Enforce capability checks before every business-critical mutation and keep
      object ownership validation close to the write path.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://developer.wordpress.org/reference/functions/current_user_can/"

  - id: WP-BIZ-002
    title: "Sensitive business fields assigned from raw WordPress request input"
    description: >
      Price, role, status, or similar privileged values are copied directly from
      raw request input into WordPress persistence functions.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [wordpress, business-logic, pricing, owasp-a04-2021, cwe-840, asvs-4.2.4]
    owasp: "A04:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: 'wp_update_user\s*\(\s*\[[^\]]*["'']role["'']\s*=>\s*(\$_(?:GET|POST|REQUEST)|sanitize_text_field\s*\(\s*\$_(?:GET|POST|REQUEST))'
      - type: regex
        target: php-files
        pattern: '(update_option|update_user_meta|update_post_meta)\s*\([^,]+,\s*["''](price|_price|amount|discount|status|role|is_admin)["'']\s*,\s*(\$_(?:GET|POST|REQUEST)|sanitize_text_field\s*\(\s*\$_(?:GET|POST|REQUEST))'
    remediation: |
      Derive privileged business values server-side or constrain them with
      strict allowlists, capability checks, and workflow validation.
    references:
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://developer.wordpress.org/reference/functions/wp_update_user/"

  - id: WP-BIZ-003
    title: "WordPress pricing, stock, or refund logic uses raw request amounts"
    description: >
      WooCommerce or custom business logic feeds raw request values directly
      into refund, price, or stock adjustment operations.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [wordpress, business-logic, finance, owasp-a04-2021, cwe-840, asvs-4.2.4]
    owasp: "A04:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: '(wc_create_refund|set_(regular_price|sale_price|price|stock_quantity)|update_post_meta\s*\([^,]+,\s*["'']_(regular_price|sale_price|stock|price)["''])[^;]*(\$_(?:GET|POST|REQUEST)|filter_input\s*\()'
    remediation: |
      Normalize and bound monetary or quantity input before use and re-check
      business invariants such as ownership, state, and allowed adjustment size.
    references:
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://owasp.org/www-project-top-ten/"
