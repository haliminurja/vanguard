meta:
  category: WordPress - Information Disclosure
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "WordPress 5.0-6.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: WP-DEBUG-001
    title: "Debug Mode or Verbose Diagnostic Exposure"
    description: >
      Debug functionality appears enabled in application or runtime configuration. Production exposure can leak internals and accelerate exploitation.
    severity: medium
    confidence: high
    cvss_v3:
      score: 5.9
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [wordpress, debug, diagnostics, owasp-a05-2021, cwe-489, nist-si-11]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: any
        pattern: 'define\(\s*[\"]WP_DEBUG[\"]\s*,\s*true'
    remediation: |
      Disable debug features in production and route diagnostics into secure observability tooling with strict access controls.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/489.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
      - "https://developer.wordpress.org"
  - id: WP-DEBUG-002
    title: "WordPress SCRIPT_DEBUG enabled"
    description: >
      `SCRIPT_DEBUG` forces WordPress to load non-minified assets and is a
      strong indicator that development-oriented diagnostics are enabled in a
      non-production context.
    severity: medium
    confidence: high
    cvss_v3:
      score: 5.3
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [wordpress, debug, script-debug, owasp-a05-2021, cwe-489, asvs-14.3.1]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: php-files
        pattern: "define\\(\\s*['\"]SCRIPT_DEBUG['\"]\\s*,\\s*true\\s*\\)"
    remediation: |
      Disable SCRIPT_DEBUG outside local development and serve production
      minified assets from controlled build outputs.
    references:
      - "https://developer.wordpress.org/advanced-administration/debug/debug-wordpress/"
      - "https://cwe.mitre.org/data/definitions/489.html"
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
