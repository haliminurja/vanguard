meta:
  category: WordPress - API Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "WordPress 5.0-6.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: WP-API-001
    title: "WordPress REST route explicitly public via permission_callback __return_true"
    description: >
      A WordPress REST route declares `permission_callback => '__return_true'`,
      making the endpoint publicly callable. This is especially dangerous when
      the route handles state-changing or sensitive application data.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: API Security
    tags: [wordpress, api-security, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: php-files
        pattern: 'register_rest_route\s*\([^;]*(permission_callback)\s*=>\s*[''"]__return_true[''"]'
    remediation: |
      Replace `__return_true` with a callback that enforces capability or
      ownership checks, and scope public access only to endpoints that are
      intentionally public and read-only.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/"
      - "https://developer.wordpress.org/rest-api/extending-the-rest-api/adding-custom-endpoints/"

  - id: WP-API-002
    title: "WordPress authentication REST route without clear access control evidence"
    description: >
      A WordPress REST route appears to implement login, token, OTP, or password
      reset behavior without clear access-control or auth-validation indicators
      nearby. These routes are common abuse targets for brute-force and account
      takeover attempts.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: API Security
    tags: [wordpress, api-security, auth, bruteforce, owasp-a07-2021, cwe-307, asvs-2.2.4]
    owasp: "A07:2021"
    cwe: "CWE-307"
    patterns:
      - type: regex
        target: php-files
        pattern: 'register_rest_route\s*\([^;]*[''"]/(login|token|auth|otp|password|forgot|reset)[^''"]*[''"]'
        exclude_pattern: '(permission_callback|current_user_can|rest_cookie_check_errors|wp_authenticate|application_password|jwt_auth|bearer)'
    remediation: |
      Add explicit permission callbacks and authentication or anti-abuse
      controls for authentication-related REST routes.
    references:
      - "https://owasp.org/API-Security/editions/2023/en/0xa2-broken-authentication/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://developer.wordpress.org/rest-api/extending-the-rest-api/adding-custom-endpoints/"
