meta:
  category: WordPress - Cryptographic Failure
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "WordPress 5.0-6.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: WP-CRYPTO-001
    title: "Weak hash used for WordPress password or token material"
    description: >
      Plugin or theme code derives password-like values, auth tokens, or reset
      secrets with MD5 or SHA-1 instead of modern password hashing or random
      token generation.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    tags: [wordpress, crypto, hashing, owasp-a02-2021, cwe-327, asvs-2.4.4]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$(user_pass|password|passwd|token|resetToken|reset_token|secret|apiKey|api_key)[A-Za-z0-9_]*\s*=\s*(md5|sha1|hash\s*\(\s*["''](md5|sha1)["''])'
      - type: regex
        target: php-files
        pattern: '["''](user_pass|password|token|reset_token|secret|api_key)["'']\s*=>\s*(md5|sha1|hash\s*\(\s*["''](md5|sha1)["''])'
    remediation: |
      Use WordPress-native password hashing for credentials and CSPRNG-backed
      token generation for auth or reset flows.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/327.html"
      - "https://developer.wordpress.org/reference/functions/wp_hash_password/"

  - id: WP-CRYPTO-002
    title: "WordPress outbound HTTP disables TLS verification"
    description: >
      WordPress HTTP API or cURL code disables TLS certificate validation,
      allowing man-in-the-middle attacks against upstream connections.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    tags: [wordpress, crypto, tls, owasp-a02-2021, cwe-295, asvs-9.1.1]
    owasp: "A02:2021"
    cwe: "CWE-295"
    patterns:
      - type: regex
        target: php-files
        pattern: 'wp_remote_(get|post|request)\s*\([^;]*["'']sslverify["'']\s*=>\s*false'
      - type: regex
        target: php-files
        pattern: 'CURLOPT_SSL_VERIFYPEER\s*,\s*false|CURLOPT_SSL_VERIFYHOST\s*,\s*0'
    remediation: |
      Keep `sslverify` enabled for WordPress HTTP API calls and fix trust-store
      issues instead of suppressing certificate checks.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://developer.wordpress.org/reference/functions/wp_remote_get/"

  - id: WP-CRYPTO-003
    title: "WordPress plugin code uses ECB mode or hardcoded IV/nonce"
    description: >
      Plugin or theme code uses insecure ECB mode or static IV/nonce values in
      custom cryptography routines.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.9
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    tags: [wordpress, crypto, encryption, owasp-a02-2021, cwe-327, asvs-6.2.5]
    owasp: "A02:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: php-files
        pattern: 'openssl_(encrypt|decrypt)\s*\([^,]+,\s*["'']AES-(128|192|256)-ECB["'']'
      - type: regex
        target: php-files
        pattern: '\$(iv|nonce|salt)[A-Za-z0-9_]*\s*=\s*["''][^"''\$]{8,}["'']'
        exclude_pattern: '(random_bytes|bin2hex|base64_decode\s*\()'
    remediation: |
      Use modern AEAD encryption and generate a fresh random IV or nonce for
      every encryption operation.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/327.html"
