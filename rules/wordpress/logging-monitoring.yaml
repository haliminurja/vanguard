meta:
  category: WordPress - Logging and Monitoring
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "WordPress 5.0-6.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: WP-LOG-001
    title: "Sensitive data written to WordPress logs"
    description: >
      Plugin or theme code logs passwords, tokens, API keys, or authorization
      material using `error_log()` or WordPress logger integrations.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
    category: Logging and Monitoring
    tags: [wordpress, logging, monitoring, owasp-a09-2021, cwe-532, asvs-9.3.3]
    owasp: "A09:2021"
    cwe: "CWE-532"
    patterns:
      - type: regex
        target: php-files
        pattern: '(error_log|wc_get_logger\s*\(\)->(debug|info|warning|error)|do_action\s*\(\s*[''"]qm/debug[''"])[^;]*(password|token|secret|authorization|api_key|private_key|otp)'
    remediation: |
      Redact secret-bearing fields before they reach plugin, WooCommerce, or
      PHP error logs.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/532.html"

  - id: WP-LOG-002
    title: "WordPress exception details returned to users without clear logging"
    description: >
      AJAX, REST, or admin handlers return raw exception messages without a
      nearby logging call. This leaks internal details and removes audit value.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Logging and Monitoring
    tags: [wordpress, logging, exception-handling, owasp-a09-2021, cwe-209, asvs-9.1.1]
    owasp: "A09:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*\b(wp_send_json_error|wp_die|wp_send_json)\s*\([^}]*\$e->(getMessage|getTraceAsString)\(\)'
        exclude_pattern: '(error_log|wc_get_logger|do_action\s*\(\s*[''"]qm/debug[''"])'
    remediation: |
      Record the exception server-side and return generic user-facing error
      responses for AJAX and REST handlers.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/209.html"

  - id: WP-LOG-003
    title: "WordPress privilege or account changes without audit logging"
    description: >
      Code changes roles, capabilities, passwords, or user status without clear
      evidence of audit logging nearby.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Logging and Monitoring
    tags: [wordpress, logging, audit, owasp-a09-2021, cwe-778, asvs-9.2.1]
    owasp: "A09:2021"
    cwe: "CWE-778"
    patterns:
      - type: regex
        target: php-files
        pattern: '(->set_role\s*\(|add_role\s*\(|remove_role\s*\()'
        exclude_pattern: '(error_log|wc_get_logger|audit|activity|do_action\s*\(\s*[''"]qm/debug[''"]|event)'
      - type: regex
        target: php-files
        pattern: 'wp_update_user\s*\(\s*\[[^\]]*[''"](user_pass|user_email|role|user_status)[''"]'
        exclude_pattern: '(error_log|wc_get_logger|audit|activity|event)'
    remediation: |
      Emit structured audit records for WordPress identity and privilege changes
      with actor, target, origin IP, and reason metadata.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/778.html"
