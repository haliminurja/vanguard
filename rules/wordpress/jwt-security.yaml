meta:
  category: WordPress - JWT Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "WordPress 5.0-6.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: WP-JWT-001
    title: "JWT Verification Weakness or Insecure Secret Handling"
    description: >
      JWT processing appears to allow weak key material or unsafe algorithm handling. This can enable token forgery and privilege escalation.
    severity: high
    confidence: medium
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: JWT Security
    tags: [wordpress, jwt, token, owasp-a07-2021, cwe-347, asvs-2.1.7]
    owasp: "A07:2021"
    cwe: "CWE-347"
    patterns:
      - type: regex
        target: any
        pattern: 'JWT::decode\s*\([^)]*[\"](secret|changeme|test)[\"]'
    remediation: |
      Pin strong algorithms, validate issuer and audience claims, and store JWT secrets in dedicated secret management with rotation policies.
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/347.html"
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://developer.wordpress.org"

  - id: WP-JWT-002
    title: "Insecure JWT Algorithm or Verification Controls"
    description: >
      JWT configuration may allow weak algorithm settings or bypass expected token validation guarantees.
    severity: high
    confidence: medium
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: JWT Security
    tags: [wordpress, jwt, owasp-a07-2021, cwe-347, asvs-2.1.7]
    owasp: "A07:2021"
    cwe: "CWE-347"
    patterns:
      - type: regex
        target: any
        pattern: 'alg[''"]\s*=>\s*[''"]none[''"]'
    remediation: |
      Pin strong JWT algorithms and enforce complete signature/claim validation with key rotation and strict issuer/audience checks.
    references:
      - "https://cwe.mitre.org/data/definitions/347.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_for_Java_Cheat_Sheet.html"
      - "https://developer.wordpress.org"
