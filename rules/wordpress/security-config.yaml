meta:
  category: WordPress - Security Configuration
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "WordPress 5.0-6.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: WP-SECCFG-001
    title: "WordPress file modifications allowed from the dashboard"
    description: >
      `DISALLOW_FILE_MODS` is explicitly disabled, allowing plugin, theme, or
      core file modifications from the administrative interface. If an admin
      session is compromised, this materially lowers the path to persistent code
      execution.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Security Configuration
    tags: [wordpress, security-config, hardening, owasp-a05-2021, cwe-16, cis-control-4]
    owasp: "A05:2021"
    cwe: "CWE-16"
    patterns:
      - type: regex
        target: php-files
        pattern: "define\\(\\s*['\"]DISALLOW_FILE_MODS['\"]\\s*,\\s*false\\s*\\)"
    remediation: |
      Disable dashboard-driven file modifications in hardened environments:
      `define('DISALLOW_FILE_MODS', true);`
    references:
      - "https://developer.wordpress.org/advanced-administration/security/hardening/"
      - "https://cwe.mitre.org/data/definitions/16.html"
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
  - id: WP-SECCFG-002
    title: "Overly Permissive CORS Policy Indicator"
    description: >
      CORS configuration appears overly permissive and may expose authenticated data across origins.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Configuration
    tags: [wordpress, security-config, cors, owasp-a05-2021, cwe-346, asvs-14.2.5]
    owasp: "A05:2021"
    cwe: "CWE-346"
    patterns:
      - type: regex
        target: any
        pattern: 'header\s*\(\s*[''"]Access-Control-Allow-Origin:\s*\*'
    remediation: |
      Use strict origin allowlists and avoid wildcard origins for sensitive or credentialed endpoints.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://developer.wordpress.org"
