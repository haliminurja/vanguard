rules:
  - id: LARAVEL-001
    title: "Route::any() — overly permissive HTTP method binding"
    description: >
      Route::any() accepts all HTTP methods (GET, POST, PUT, DELETE, PATCH, OPTIONS, HEAD), exposing the route to method calls that may trigger unexpected behavior or bypass method-based access controls.

    severity: low
    category: Configuration
    enabled: true
    tags: [routing, owasp-a04, cwe-749]
    patterns:
      - type: regex
        target: routes-files
        pattern: 'Route::any\s*\('
    remediation: |
      Use specific HTTP verbs or Route::match() for a controlled subset:
        Route::match(['get', 'post'], '/resource', [ResourceController::class, 'handle']);
    references:
      - https://cwe.mitre.org/data/definitions/749.html
  - id: LARAVEL-002
    title: "Blade form missing @csrf directive"
    description: >
      A <form> with a non-GET method in a Blade template does not include @csrf. Without CSRF token validation, the form is vulnerable to cross-site request forgery from any origin that can trick a logged-in user into a click.

    severity: high
    category: Security
    enabled: true
    tags: [csrf, owasp-a05, cwe-352]
    condition: all
    patterns:
      - type: regex
        target: blade-files
        pattern: '<form[^>]+method\s*=\s*[''"]?(POST|PUT|PATCH|DELETE)[^>]*>'
      - type: contains
        target: blade-files
        pattern: "@csrf"
        negative: true
    remediation: |
      Add @csrf inside every non-GET Blade form:
        <form method="POST" action="{{ route('profile.update') }}">
            @csrf
            @method('PUT')
    references:
      - https://cwe.mitre.org/data/definitions/352.html
  - id: LARAVEL-006
    title: "Schema::drop() called outside a migration file"
    description: >
      Schema::drop() or Schema::dropIfExists() is invoked outside a migration. DDL DROP operations in controllers, services, or commands are a destructive risk — one misconfiguration or injection can wipe a production table.

    severity: critical
    category: Data Safety
    enabled: true
    tags: [destructive, cwe-912]
    patterns:
      - type: regex
        target: php-files
        pattern: 'Schema::(drop|dropIfExists)\s*\('
        exclude_pattern: '(migration|Migration|database/migrations|test|Test|seed|Seed)'
    remediation: |
      Restrict Schema::drop() to migration files under database/migrations/.
    references:
      - https://cwe.mitre.org/data/definitions/912.html
  - id: LARAVEL-007
    title: "Artisan::call() with user-supplied command"
    description: >
      Artisan::call() is invoked with a command name or argument from user input. Attackers can trigger migrate:fresh, db:wipe, storage:clear, queue:flush, or any other registered command.

    severity: critical
    category: Injection
    enabled: true
    tags: [command-injection, owasp-a03, cwe-78]
    patterns:
      - type: regex
        target: php-files
        pattern: 'Artisan::call\s*\(\s*\$(_GET|_POST|_REQUEST|request)'
    remediation: |
      Whitelist permitted commands before calling:
        $allowed = ['cache:clear', 'queue:restart'];
        abort_unless(in_array($command, $allowed), 400);
        Artisan::call($command);
    references:
      - https://cwe.mitre.org/data/definitions/78.html
  - id: LARAVEL-010
    title: "Broadcast channel authorization always returning true"
    description: >
      A broadcast channel callback unconditionally returns true, allowing any authenticated user to subscribe to any channel. Private channel data (orders, messages, notifications) is exposed to every logged-in user.

    severity: medium
    category: Authorization
    enabled: true
    tags: [authz, websocket, cwe-863]
    patterns:
      - type: regex
        target: php-files
        pattern: 'Broadcast::channel\s*\([^,]+,\s*function\s*\([^)]*\)\s*\{\s*return\s+true'
    remediation: |
      Verify ownership in the channel callback:
        Broadcast::channel('orders.{orderId}', function ($user, $orderId) {
            $order = Order::find($orderId);
            return $order && $user->id === $order->user_id;
        });
    references:
      - https://cwe.mitre.org/data/definitions/863.html
  - id: LARAVEL-011
    title: "Queued job dispatched with unvalidated request data"
    description: >
      A queued job is dispatched with raw $request->all() or $request->input(). The unvalidated data is serialized into the queue payload, bypassing validation and potentially including oversized or malicious fields.

    severity: medium
    category: Input Validation
    enabled: true
    tags: [queue, input-validation, cwe-20]
    patterns:
      - type: regex
        target: php-files
        pattern: '(dispatch|::dispatch)\s*\(\s*new\s+\w+\s*\(\s*\$request->(all|input)\s*\('
    remediation: |
      Pass only validated data to queued jobs:
        $validated = $request->validated();
        ProcessOrder::dispatch($validated['order_id'], $validated['notes']);
    references:
      - https://cwe.mitre.org/data/definitions/20.html
  - id: LARAVEL-013
    title: "Nested route parameters without scopeBindings()"
    description: >
      A route with nested resource parameters ({user}/{post}) does not call ->scopeBindings(). Without scoping, Laravel resolves each model independently by primary key, allowing users to access resources belonging to other users.

    severity: high
    category: Access Control
    enabled: true
    tags: [idor, multi-tenant, owasp-a01, cwe-639]
    patterns:
      - type: regex
        target: routes-files
        pattern: 'Route::(get|put|patch|delete)\s*\([^)]*\{[a-z_]+\}[^)]*\{[a-z_]+\}'
        exclude_pattern: '(scopeBindings|scoped\(|ScopedBy)'
    remediation: |
      Enforce parent-child scoping with ->scopeBindings():
        Route::get('/users/{user}/posts/{post}', [PostController::class, 'show'])
            ->scopeBindings();
    references:
      - https://cwe.mitre.org/data/definitions/639.html
  - id: LARAVEL-014
    title: "Model::unguard() disabling mass assignment protection globally"
    description: >
      Model::unguard() disables mass assignment protection for all Eloquent models for the duration of the process. In request-handling code this removes all $fillable/$guarded protection from every subsequent model operation.

    severity: critical
    category: Mass Assignment
    enabled: true
    tags: [mass-assignment, owasp-a04, cwe-915]
    patterns:
      - type: regex
        target: php-files
        pattern: 'Model::(unguard|unguarded)\s*\('
        exclude_pattern: '(seed|Seed|test|Test|factory|Factory|tinker)'
    remediation: |
      Never call Model::unguard() in request-handling code.
      In seeders, re-guard immediately after the block:
        Model::unguard();
        // ... seed ...
        Model::reguard();
    references:
      - https://cwe.mitre.org/data/definitions/915.html
  - id: LARAVEL-016
    title: "DB::unprepared() with variable SQL"
    description: >
      DB::unprepared() executes raw SQL with no parameter binding support. Unlike DB::statement(), it provides zero injection protection and should only ever be used for static DDL statements.

    severity: critical
    category: Injection
    enabled: true
    tags: [sqli, owasp-a03, cwe-89]
    patterns:
      - type: regex
        target: php-files
        pattern: 'DB::unprepared\s*\(\s*[''"].*\$'
      - type: regex
        target: php-files
        pattern: 'DB::unprepared\s*\(\s*\$'
    remediation: |
      Use DB::statement() with parameter binding for dynamic SQL:
        DB::statement('UPDATE users SET name = ? WHERE id = ?', [$name, $id]);
    references:
      - https://cwe.mitre.org/data/definitions/89.html
  - id: LARAVEL-017
    title: "response()->download() with user-controlled file path"
    description: >
      response()->download() or Storage::download() is called with a path from user input. Attackers use ../ sequences to download .env files, private keys, database backups, or application source code.

    severity: critical
    category: Path Traversal
    enabled: true
    tags: [lfi, path-traversal, owasp-a01, cwe-22]
    patterns:
      - type: regex
        target: php-files
        pattern: '(response\(\)->download|Storage::download)\s*\(\s*\$(_GET|_POST|_REQUEST|request)'
    remediation: |
      Use a record ID to look up the file path server-side:
        $file = UserFile::findOrFail($request->input('file_id'));
        $this->authorize('download', $file);
        return Storage::download($file->path, $file->original_name);
    references:
      - https://cwe.mitre.org/data/definitions/22.html
  - id: LARAVEL-018
    title: "TrustProxies configured with wildcard '*'"
    description: >
      TrustProxies is configured with $proxies = '*', causing the application to accept X-Forwarded-For, X-Forwarded-Proto from any IP. Attackers spoof these headers to bypass IP-based rate limiting and HTTPS enforcement.

    severity: high
    category: Configuration
    enabled: true
    tags: [proxy, owasp-a05, cwe-346]
    patterns:
      - type: regex
        target: php-files
        pattern: 'protected\s+\$proxies\s*=\s*[''"]?\*[''"]?'
      - type: regex
        target: env-files
        pattern: 'TRUSTED_PROXIES\s*=\s*\*'
    remediation: |
      Specify your load balancer/CDN IP ranges explicitly:
        protected $proxies = ['203.0.113.1/32', '10.0.0.0/8'];
    references:
      - https://cwe.mitre.org/data/definitions/346.html
