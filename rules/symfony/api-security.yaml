meta:
  category: Symfony - API Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Symfony 4.4-7.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: SYM-API-001
    title: "Sensitive Symfony API route without clear access control guard"
    description: >
      Symfony controller methods expose sensitive `/api/...` routes without
      clear `IsGranted`, `Security`, or `denyAccessUnlessGranted` protections in
      the same controller context.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: API Security
    tags: [symfony, api-security, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: controller-files
        pattern: '#\[Route\(\s*[''"]/?api/(admin|users?|accounts?|profiles?|billing|payments?|orders?|invoices?|settings)'
        exclude_pattern: '(#\[\s*IsGranted|Security\s*\(|denyAccessUnlessGranted\s*\(|->isGranted\s*\()'
    remediation: |
      Require explicit authorization on sensitive API controllers and actions.
      Use `#[IsGranted]`, security expressions, and ownership checks close to
      the controller boundary.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/"
      - "https://symfony.com/doc/current/security.html"

  - id: SYM-API-002
    title: "Symfony authentication API endpoint without clear brute-force controls"
    description: >
      Authentication-related Symfony API routes are present without clear
      evidence of throttling, limiter consumption, or lockout controls nearby.
      Login and token endpoints are common brute-force targets.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: API Security
    tags: [symfony, api-security, rate-limit, bruteforce, owasp-a04-2021, cwe-307, asvs-2.2.4]
    owasp: "A04:2021"
    cwe: "CWE-307"
    patterns:
      - type: regex
        target: controller-files
        pattern: '#\[Route\(\s*[''"]/?api/(login|token|auth|otp|password|forgot|reset)'
        exclude_pattern: '(RateLimiterFactory|TooManyRequestsHttpException|limiter|login_throttling|->consume\s*\()'
    remediation: |
      Add explicit brute-force controls to auth API endpoints using Symfony rate
      limiting or equivalent application-level lockout protections.
    references:
      - "https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://symfony.com/doc/current/rate_limiter.html"
