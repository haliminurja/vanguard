meta:
  category: Symfony - Business Logic
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Symfony 4.4-7.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: SYM-BIZ-001
    title: "Sensitive Symfony business action without clear authorization check"
    description: >
      Symfony controller methods for refunds, approvals, cancellations, price
      updates, or destructive mutations are present without nearby authorization
      enforcement.
    severity: high
    confidence: medium
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [symfony, business-logic, access-control, owasp-a01-2021, cwe-840, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(update|delete|approve|refund|cancel|capture|changeRole|setStatus|updatePrice)\b'
        exclude_pattern: '(denyAccessUnlessGranted\s*\(|isGranted\s*\(|#\[IsGranted\(|#\[Security\()'
    remediation: |
      Keep object-level authorization explicit in every business-critical
      controller action and deny by default.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://symfony.com/doc/current/security.html"

  - id: SYM-BIZ-002
    title: "Sensitive business fields assigned from Symfony request input"
    description: >
      Price, amount, balance, discount, role, or status values are copied
      directly from Symfony request input into persistence structures or entity
      setters.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [symfony, business-logic, pricing, owasp-a04-2021, cwe-840, asvs-4.2.4]
    owasp: "A04:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: '["''](price|amount|balance|discount|role|status|enabled)["'']\s*=>\s*\$request->(get|request->get|query->get)\('
      - type: regex
        target: php-files
        pattern: '->set(Price|Amount|Balance|Discount|Role|Status|Enabled)\s*\(\s*\$request->(get|request->get|query->get)\('
    remediation: |
      Derive privileged business values server-side or constrain them with
      explicit validation plus authorization-aware workflow checks.
    references:
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://symfony.com/doc/current/validation.html"

  - id: SYM-BIZ-003
    title: "Symfony refund or balance mutation uses request-controlled amount"
    description: >
      Refund, credit, debit, transfer, or price adjustment methods receive raw
      Symfony request values directly as the controlling amount or quantity.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [symfony, business-logic, finance, owasp-a04-2021, cwe-840, asvs-4.2.4]
    owasp: "A04:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: '(refund|credit|debit|withdraw|transfer|adjustBalance|setPrice|applyDiscount)\s*\([^)]*\$request->(get|request->get|query->get)\('
    remediation: |
      Normalize and bound financial input before use and enforce business
      invariants such as ownership, state, and maximum allowed adjustment.
    references:
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://owasp.org/www-project-top-ten/"
