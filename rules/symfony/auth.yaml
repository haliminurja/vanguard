meta:
  category: Symfony - Authentication
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Symfony 4.4-7.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: SYM-AUTH-001
    title: "Symfony manual authentication flow uses request-controlled identity"
    description: >
      Symfony user or token state is created directly from request-controlled
      input. Manual login flows of this kind bypass normal credential or token
      validation and can enable impersonation.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authentication
    tags: [symfony, auth, impersonation, owasp-a07-2021, cwe-287, asvs-2.1.1]
    owasp: "A07:2021"
    cwe: "CWE-287"
    patterns:
      - type: regex
        target: php-files
        pattern: '->setUser\s*\(\s*\$request->'
      - type: regex
        target: php-files
        pattern: '->setToken\s*\(\s*new\s+[A-Za-z0-9_\\]*Token[^;]*(\$request->|\$_(?:GET|POST|REQUEST))'
      - type: regex
        target: php-files
        pattern: 'UsernamePasswordToken\s*\([^;]*(\$request->|\$_(?:GET|POST|REQUEST))'
    remediation: |
      Let Symfony authenticators or verified token workflows establish identity.
      Avoid direct request-to-token or request-to-user shortcuts in controller
      code.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/287.html"
      - "https://symfony.com/doc/current/security.html"

  - id: SYM-AUTH-002
    title: "Sensitive Symfony route without clear access-control check"
    description: >
      A controller route for admin, account, billing, or password-management
      functionality does not show an `IsGranted`, `Security`, or
      `denyAccessUnlessGranted()` check nearby.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authorization
    tags: [symfony, auth, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: controller-files
        pattern: '#\[Route\(\s*[''"][^''"]*(admin|dashboard|account|billing|settings|profile|password)[^''"]*[''"]'
        exclude_pattern: '(#\[IsGranted\(|#\[Security\(|denyAccessUnlessGranted\s*\(|isGranted\s*\()'
    remediation: |
      Apply route-level or controller-level authorization for every sensitive
      action and keep the denial path explicit.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://symfony.com/doc/current/security.html#securing-controllers-and-other-code"

  - id: SYM-AUTH-003
    title: "Symfony login or recovery endpoint without clear throttling"
    description: >
      Login, password reset, OTP, or two-factor controllers are present without
      visible rate-limiting indicators. These flows need throttling to resist
      brute-force and credential stuffing.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Authentication
    tags: [symfony, auth, rate-limit, bruteforce, owasp-a07-2021, cwe-307, asvs-2.2.4]
    owasp: "A07:2021"
    cwe: "CWE-307"
    patterns:
      - type: regex
        target: controller-files
        pattern: '#\[Route\(\s*[''"][^''"]*(login|signin|forgot|reset|otp|2fa|two-factor)[^''"]*[''"]'
        exclude_pattern: '(login_throttling|rate_limiter|RateLimiter|TooManyLoginAttemptsAuthenticationException)'
    remediation: |
      Enable Symfony login throttling or apply an explicit RateLimiter policy to
      recovery and MFA endpoints.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://symfony.com/doc/current/security.html#limiting-login-attempts"
