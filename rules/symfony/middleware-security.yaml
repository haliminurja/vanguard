meta:
  category: Symfony - Middleware Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Symfony 4.4-7.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: SYM-MID-001
    title: "Sensitive Symfony route without clear authorization guard"
    description: >
      Sensitive Symfony controller routes are present without visible
      authorization guards such as `#[IsGranted]`, security expressions, or
      `denyAccessUnlessGranted()` in the same controller context.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Middleware Security
    tags: [symfony, middleware-security, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: controller-files
        pattern: '#\[Route\(\s*[''"][^''"]*(admin|account|settings|billing|profile|payment)[^''"]*[''"]'
        exclude_pattern: '(#\[\s*IsGranted|Security\s*\(|denyAccessUnlessGranted\s*\(|->isGranted\s*\()'
    remediation: |
      Apply explicit authorization checks to privileged routes and keep access
      decisions close to the controller boundary.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://symfony.com/doc/current/security.html"

  - id: SYM-MID-002
    title: "Sensitive Symfony path exposed with PUBLIC_ACCESS or security false"
    description: >
      Symfony configuration allows sensitive paths to bypass security controls
      through `PUBLIC_ACCESS` or `security: false`. This can unintentionally
      remove authentication from privileged request flows.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Middleware Security
    tags: [symfony, middleware-security, security-misconfiguration, owasp-a05-2021, cwe-16, asvs-14.2.1]
    owasp: "A05:2021"
    cwe: "CWE-16"
    condition: all
    patterns:
      - type: regex
        target: config-files
        pattern: 'path:\s*\^/(admin|account|settings|billing|profile|payment)'
      - type: regex
        target: config-files
        pattern: 'roles:\s*PUBLIC_ACCESS|security:\s*false'
    remediation: |
      Remove middleware bypass behavior from privileged paths and ensure access
      controls are deny-by-default for sensitive areas.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/16.html"
      - "https://symfony.com/doc/current/security/access_control.html"
