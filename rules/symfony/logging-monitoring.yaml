meta:
  category: Symfony - Logging and Monitoring
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Symfony 4.4-7.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: SYM-LOG-001
    title: "Sensitive data written to Symfony logs"
    description: >
      Symfony or Monolog logging calls appear to include credentials or secret
      material. This creates durable downstream disclosure risk.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
    category: Logging and Monitoring
    tags: [symfony, logging, monitoring, owasp-a09-2021, cwe-532, asvs-9.3.3]
    owasp: "A09:2021"
    cwe: "CWE-532"
    patterns:
      - type: regex
        target: php-files
        pattern: '(\$[A-Za-z_][A-Za-z0-9_]*Logger|\$logger|->getLogger\(\)|->(debug|info|warning|error|critical|notice|alert)\s*\()[^;]*(password|token|secret|authorization|api_key|private_key|otp)'
    remediation: |
      Redact or avoid sensitive fields before they reach Monolog handlers or
      centralized logging backends.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/532.html"
      - "https://symfony.com/doc/current/logging.html"

  - id: SYM-LOG-002
    title: "Symfony exception details returned to the client without clear logging"
    description: >
      Controller code returns raw exception messages or traces and does not show
      a nearby logging call. This leaks internals and weakens incident response.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Logging and Monitoring
    tags: [symfony, logging, exception-handling, owasp-a09-2021, cwe-209, asvs-9.1.1]
    owasp: "A09:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*return\s+new\s+(JsonResponse|Response)[^}]*\$e->(getMessage|getTraceAsString)\(\)'
        exclude_pattern: '(logger->|->error\(|->critical\(|report\()'
    remediation: |
      Log the exception server-side and return only normalized client-facing
      error text.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/209.html"
      - "https://symfony.com/doc/current/controller.html"

  - id: SYM-LOG-003
    title: "Symfony privilege or account-state changes without audit logging"
    description: >
      Role, password, email, or account enablement changes appear without clear
      evidence of audit logging or event emission nearby.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Logging and Monitoring
    tags: [symfony, logging, audit, owasp-a09-2021, cwe-778, asvs-9.2.1]
    owasp: "A09:2021"
    cwe: "CWE-778"
    patterns:
      - type: regex
        target: php-files
        pattern: '->set(Roles|Password|Email|Enabled|Locked)\s*\('
        exclude_pattern: '(logger->|->info\(|->warning\(|->error\(|audit|eventDispatcher|dispatch\()'
    remediation: |
      Emit audit events for sensitive identity and privilege mutations with
      actor, target, request metadata, and change reason.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/778.html"
      - "https://symfony.com/doc/current/logging.html"
