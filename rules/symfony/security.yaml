
meta:
  category: Symfony Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Symfony 4.4-7.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:

  - id: SYM-ENT-001
    title: "ESI (Edge Side Includes) Injection leading to SSRF"
    description: >
      Symfony's `render_esi()` Twig helper and `HttpCache` ESI integration
      renders sub-requests as fragments. When the fragment URI or `src`
      attribute is derived from unvalidated user input (query parameters,
      POST body, headers), an attacker can craft arbitrary URIs to perform SSRF.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.3
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:N"
    category: Injection
    enabled: true
    tags: [esi-injection, ssrf, owasp-a10-2021, symfony, cwe-918, pci-dss-6.2]
    owasp: "A10:2021"
    cwe: "CWE-918"
    patterns:
      - type: regex
        target: twig-files
        pattern: 'render_esi\s*\(\s*(app\.request|app\.request\.query|app\.request\.request|app\.request\.headers)'
      - type: regex
        target: php-files
        pattern: '->render\s*\([^,]+,\s*\[[^\]]*[''"]esi[''"]\s*=>\s*\$request->'
      - type: regex
        target: php-files
        pattern: 'HttpKernelInterface::SUB_REQUEST[^;]*\$request->get\('
    remediation: |
      NEVER construct ESI URIs dynamically from request parameters. Maintain a strict allowlist of internal route names.

    references:
      - "https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_(SSRF)/"
      - "https://cwe.mitre.org/data/definitions/918.html"
  - id: SYM-ENT-002
    title: "Unsafe Object Deserialization via Symfony SerializerComponent"
    description: >
      The Symfony Serializer component can instantiate arbitrary PHP objects
      from JSON/XML input. When the target class is not hardcoded but instead
      derived from user-supplied data, it can lead to RCE via POP chain.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Deserialization
    enabled: true
    tags: [rce, deserialization, owasp-a08-2021, symfony, cwe-502]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: '->deserialize\s*\(\s*\$request->getContent\(\)\s*,\s*\$request->get\('
      - type: regex
        target: php-files
        pattern: '->denormalize\s*\([^,]+,\s*\$request->(?:get|query->get|request->get)\('
      - type: regex
        target: php-files
        pattern: 'JMS\\Serializer.*->deserialize\s*\([^,]+,\s*\$_(?:POST|GET|REQUEST)'
    remediation: |
      Always hardcode the deserialization target class. `deserialize($request->getContent(), UserDto::class, 'json');`

    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
  - id: SYM-ENT-003
    title: "Symfony Web Profiler / _profiler Route Exposed in Production"
    description: >
      The Symfony Web Profiler Toolbar exposes extremely sensitive runtime data
      including database credentials, full query logs with bind parameters, and active session tokens.
    severity: critical
    confidence: high
    cvss_v3:
      score: 8.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N"
    category: Information Disclosure
    enabled: true
    tags: [profiler, debug-exposure, owasp-a05-2021, symfony, cwe-200, cwe-215]
    owasp: "A05:2021"
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: config-files
        pattern: 'web_profiler:\s*\n\s*toolbar:\s*true'
        exclude_pattern: '(dev|test|local)'
      - type: regex
        target: php-files
        pattern: 'WebProfilerBundle::class\s*=>\s*\[''all''\s*=>\s*true\]'
    remediation: |
      Ensure `WebProfilerBundle` is only registered for `dev` and `test` in `bundles.php`. Set `APP_ENV=prod`.

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/200.html"
  - id: SYM-ENT-004
    title: "Open Redirect via Unvalidated Referer / Redirect URL"
    description: >
      Using `$request->headers->get('Referer')` or `$request->query->get('redirect')`
      directly as the Location header in a `RedirectResponse` enables open redirects.
    severity: high
    confidence: high
    cvss_v3:
      score: 6.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N"
    category: Open Redirect
    enabled: true
    tags: [open-redirect, phishing, owasp-a01-2021, symfony, cwe-601]
    owasp: "A01:2021"
    cwe: "CWE-601"
    patterns:
      - type: regex
        target: php-files
        pattern: 'new\s+RedirectResponse\s*\(\s*\$request->headers->get\s*\(\s*[''"]Referer[''"]\s*\)'
      - type: regex
        target: php-files
        pattern: 'return\s+\$this->redirect\s*\(\s*\$request->(?:query|request)->get\s*\('
    remediation: |
      Always validate redirect targets against an allow-list of internal paths or use `generateUrl()`.

    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/601.html"
  - id: SYM-ENT-005
    title: "Missing CSRF Token Validation on State-Changing Endpoints"
    description: >
      Symfony's `CsrfTokenManager` provides built-in CSRF protection. When
      forms or API endpoints that mutate state (POST/PUT/PATCH/DELETE) skip
      `$this->isCsrfTokenValid()` or omit `{{ csrf_token('intention') }}`,
      attackers can forge cross-site requests.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: CSRF
    enabled: true
    tags: [csrf, owasp-a05-2021, symfony, cwe-352]
    owasp: "A02:2021"
    cwe: "CWE-352"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Request\s+\$request[^{]*\{[^}]*(delete|update|save|insert)[^}]*\$request->request->get'
        exclude_pattern: 'isCsrfTokenValid|_token'
    remediation: |
      Always include and validate CSRF tokens in Symfony forms.

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/352.html"
  - id: SYM-ENT-006
    title: "ExpressionLanguage Injection leading to RCE"
    description: >
      Passing user-controlled input directly to the `evaluate()` or `compile()`
      methods of Symfony's `ExpressionLanguage` component allows attackers to
      execute arbitrary PHP code.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Injection
    enabled: true
    tags: [rce, expression-language, owasp-a03-2021, symfony, cwe-94]
    owasp: "A03:2021"
    cwe: "CWE-94"
    patterns:
      - type: regex
        target: php-files
        pattern: '->(?:evaluate|compile)\s*\(\s*\$request->(?:request|query)->get\('
    remediation: |
      Never allow users to provide the expression string. User input should only be passed as variables in the second argument dictionary.

    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/94.html"
  - id: SYM-ENT-007
    title: "Insecure Remember-Me Configuration (Secret Re-use)"
    description: >
      If the `remember_me` firewall configuration uses a weak, hardcoded, or globally shared `secret`,
      attackers can forge remember-me cookies to hijack user sessions.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Session Management
    enabled: true
    tags: [remember-me, session-hijacking, symfony, cwe-287, owasp-a02-2021]
    owasp: "A02:2021"
    cwe: "CWE-287"
    patterns:
      - type: regex
        target: config-files
        pattern: 'remember_me:\s*\n.*\n*\s*secret:\s*[''"](?:secret|changeme|ThisTokenIsNotSoSecretChangeIt)[''"]'
    remediation: |
      Always use the application secret `%kernel.secret%` or a dedicated environment variable for the `remember_me` secret.

    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/287.html"
  - id: SYM-ENT-008
    title: "Weak Password Encoder Configuration (Legacy Crypt/MD5/Plaintext)"
    description: >
      Using legacy or weak password encoders like `plaintext`, `bcrypt` with low cost, or `md5` allows attackers to crack passwords quickly if the database is compromised.
    severity: high
    confidence: high
    category: Cryptographic Failure
    tags: [crypto, symfony, cwe-327]
    owasp: "A05:2021"
    cwe: "CWE-327"
    patterns:
      - type: regex
        target: config-files
        pattern: 'algorithm:\s*(plaintext|md5|sha1)'
        exclude_pattern: 'bcrypt|argon2i|argon2id'
    remediation: |
      Use `auto` to let Symfony choose the best algorithm, or explicitly define `bcrypt` or `argon2id` with appropriate cost parameters.

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/327.html"
  - id: SYM-ENT-009
    title: "Open Access Control (Missing access_control in security.yaml)"
    description: >
      The `access_control` section in `security.yaml` is empty or does not define rules for sensitive paths such as `/admin` or `/api`. This can lead to IDOR or unauthorized access to sensitive data.
    severity: high
    confidence: high
    category: Broken Access Control
    tags: [auth, symfony, cwe-284]
    owasp: "A07:2021"
    cwe: "CWE-284"
    patterns:
      - type: regex
        target: config-files
        pattern: 'access_control:\s*\[\s*\]'
    remediation: |
      Define strict `access_control` rules to prevent unauthorized access to sensitive areas.

    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/284.html"
  - id: SYM-ENT-010
    title: "HttpKernel Handle with Direct User Input"
    description: >
      Calling `Request::create()` with a URL or path from user input and then passing it to `$kernel->handle()` can simulate internal sub-requests that should not be publicly accessible.
    severity: high
    confidence: high
    category: Injection
    tags: [rce, symfony, cwe-20]
    owasp: "A03:2021"
    cwe: "CWE-20"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Request::create\s*\(\s*(\$request->|\$_GET|\$_POST)'
      - type: regex
        target: php-files
        pattern: '\$kernel->handle\s*\(\s*Request::create\s*\('
    remediation: |
      Ensure requests are handled through the standard Symfony pipeline and avoid manual kernel handle calls on unvalidated requests.
    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/20.html"
  - id: SYM-ENT-011
    title: "TLS Verification Disabled in HTTP Client Configuration"
    description: >
      Symfony outbound HTTP calls disable TLS peer/host verification.
      This permits man-in-the-middle attacks and forged upstream responses.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    tags: [symfony, tls, mitm, owasp-a02-2021, cwe-295, asvs-9.1.1, nist-sc-8]
    owasp: "A02:2021"
    cwe: "CWE-295"
    patterns:
      - type: regex
        target: php-files
        pattern: "['\\\"]verify_peer['\\\"]\\s*=>\\s*false"
      - type: regex
        target: php-files
        pattern: "['\\\"]verify_host['\\\"]\\s*=>\\s*false"
    remediation: |
      Ensure TLS verification is enabled for all outbound connections. 
      Use official trust stores and do not disable certificate checks in production.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/295.html"
      - "https://symfony.com/doc/current/http_client.html"

  - id: SYM-ENT-012
    title: "CORS allows wildcard origin with credentials"
    description: >
      Configuration allows `allow_origin: ['*']` together with `allow_credentials: true`.
      This is unsafe and can expose authenticated responses cross-origin.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Misconfiguration
    enabled: true
    tags: [symfony, cors, owasp-a05-2021, cwe-346, asvs-14.2.5, nist-sc-23]
    owasp: "A05:2021"
    cwe: "CWE-346"
    condition: all
    patterns:
      - type: regex
        target: config-files
        pattern: "allow_origin:\\s*\\[\\s*['\"]\\*['\"]\\s*\\]"
      - type: regex
        target: config-files
        pattern: "allow_credentials:\\s*true"
    remediation: |
      Use a specific origin allowlist and disable credentials for wildcard origins.
      Apply environment-based CORS policies.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://symfony.com/bundles/NelmioCorsBundle/current/index.html"

  - id: SYM-ENT-013
    title: "Unsafe Serializer Deserialization from Request Body"
    description: >
      Request content is directly deserialized into objects without strict context controls.
      This can cause mass assignment, privilege abuse, or unsafe object state transitions.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.7
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Deserialization
    tags: [symfony, serializer, owasp-a08-2021, cwe-502, asvs-5.5.2, nist-si-10]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: '->deserialize\s*\(\s*\$request->getContent\(\)\s*,\s*[^,]+,\s*[''"]json[''"]\s*\)'
        exclude_pattern: '(OBJECT_TO_POPULATE|groups|allowed_attributes|ALLOW_EXTRA_ATTRIBUTES|denormalize)'
    remediation: |
      Use limited DTOs, validation layers, and strict serializer contexts. 
      Avoid direct deserialization into sensitive domain entities.
    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://symfony.com/doc/current/components/serializer.html"

