meta:
  category: Symfony - Secrets Management
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Symfony 4.4-7.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: SYM-SECRETS-001
    title: "Potential Hardcoded Secret Material"
    description: >
      Static secret-like values are present in source or configuration. Hardcoded secrets increase exposure risk across source control and build artifacts.
    severity: critical
    confidence: medium
    cvss_v3:
      score: 9.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Secrets Management
    tags: [symfony, secrets, credential, owasp-a02-2021, cwe-798, pci-dss-3.6]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: any
        pattern: 'APP_SECRET\s*=|secret:\s*[\"][A-Za-z0-9_\-\/=\+]{16,}[\"]'
        exclude_pattern: '(env\(|getenv|putenv|\$\{?[A-Z0-9_]+\}?)'
    remediation: |
      Store all secrets in environment variables or secret managers, rotate regularly, and block commits containing secret fingerprints.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://symfony.com/doc/current/index.html"

  - id: SYM-SECRETS-002
    title: "High-Risk Secret Token or Private Key Pattern"
    description: >
      Potential private key or high-risk token pattern is detected in repository content.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.3
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Secrets Management
    tags: [symfony, secrets, owasp-a02-2021, cwe-798, pci-dss-3.6]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: any
        pattern: '-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}'
    remediation: |
      Immediately rotate exposed secrets, purge from history, and enforce pre-commit and CI secret scanning controls.
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
      - "https://symfony.com/doc/current/index.html"
