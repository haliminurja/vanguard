meta:
  category: Yii2 Security
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Yii2 2.0.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:

  - id: YII-ENT-001
    title: "Yii2 Gii Code Generator Exposed in Production (Instant RCE)"
    description: >
      The Gii module is Yii2's scaffolding and code-generation tool with an
      interactive web interface. When enabled in production or bound to
      `0.0.0.0` (all network interfaces), any network-accessible attacker can
      achieve instant unauthenticated Remote Code Execution.
    severity: critical
    confidence: high
    cvss_v3:
      score: 10.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
    category: Remote Code Execution / Information Disclosure
    enabled: true
    tags: [gii, rce, debug-exposure, cwe-284, owasp-a05-2021, yii2]
    owasp: "A05:2021"
    cwe: "CWE-284"
    patterns:
      - type: regex
        target: php-files
        pattern: '\$config\[(?:''|")modules(?:''|")\]\[(?:''|")gii(?:''|")\]\s*=\s*\['
        exclude_pattern: '(if\s*\(\s*YII_ENV_DEV\s*\)|YII_ENV\s*===\s*[''"]dev[''"])'
      - type: regex
        target: php-files
        pattern: '[''"]allowedIPs[''"]\s*=>\s*\[\s*[''"](\*|0\.0\.0\.0)[''"]'
    remediation: |
      Wrap Gii configuration inside an environment check `if (YII_ENV_DEV)`.

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/284.html"
  - id: YII-ENT-002
    title: "Unsafe Yii2 Cache Configuration Enabling Object Deserialization"
    description: >
      Yii2's caching layer uses PHP `unserialize()`. If the cache backend is
      exposed without authentication or cache keys are manipulated, an attacker
      can trigger RCE via POP chains.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Deserialization
    enabled: true
    tags: [cache, deserialization, yii2, cwe-502, owasp-a08-2021]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Yii::\$app->cache->(get|set|add)\s*\(\s*(\$request->|\$_GET|\$_POST|request\()'
    remediation: |
      Authenticate Redis/Memcached connections and avoid building cache keys from raw user input.

    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
  - id: YII-ENT-003
    title: "Cookie Validation Disabled - Session Hijacking and CSRF Bypass"
    description: >
      When `enableCookieValidation` is set to false, session cookies can be forged
      without the HMAC signature, leading to session hijacking.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure / Session Security
    enabled: true
    tags: [crypto, session-hijacking, csrf-bypass, yii2, cwe-565, owasp-a02-2021]
    owasp: "A02:2021"
    cwe: "CWE-565"
    patterns:
      - type: regex
        target: php-files
        pattern: '[''"]enableCookieValidation[''"]\s*=>\s*(false|0|FALSE)'
      - type: regex
        target: php-files
        pattern: '[''"]cookieValidationKey[''"]\s*=>\s*[''"](\s*|your_key_here|changeme|secret)[''"]'
    remediation: |
      Never disable `enableCookieValidation` and provide a strong random key.

    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/565.html"
  - id: YII-ENT-004
    title: "SQL Injection via Yii2 findBySql() / createCommand() Concatenation"
    description: >
      Bypassing Active Record parameterization using `findBySql()` or `createCommand()`
      with direct string concatenation leads to SQL injection.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: SQL Injection
    enabled: true
    tags: [sqli, yii2, cwe-89, owasp-a03-2021]
    owasp: "A03:2021"
    cwe: "CWE-89"
    patterns:
      - type: regex
        target: php-files
        pattern: '::findBySql\s*\(\s*["''].*\.\s*\$(?:_GET|_POST|_REQUEST|request)'
      - type: regex
        target: php-files
        pattern: '->createCommand\s*\(\s*["''].*\.\s*\$(?:_GET|_POST|_REQUEST)'
    remediation: |
      Use parameterized queries exclusively.

    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/89.html"
  - id: YII-ENT-005
    title: "Server-Side Template Injection (SSTI) in Yii2 View Renderer"
    description: >
      When using Twig or Smarty extensions with Yii2, passing user-controlled
      input directly as a template string to `render()` or compiling templates
      dynamically can lead to Server-Side Template Injection (SSTI) and RCE.
    severity: critical
    confidence: high
    cvss_v3:
      score: 10.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H"
    category: Injection
    enabled: true
    tags: [ssti, rce, yii2, cwe-1336, owasp-a03-2021]
    owasp: "A03:2021"
    cwe: "CWE-1336"
    patterns:
      - type: regex
        target: php-files
        pattern: '->render(?:Ajax|Partial)?\s*\(\s*["''][^"''\)]*\.\s*\$(?:_GET|_POST|_REQUEST|request)'
        exclude_pattern: '(->render|\$this->render)\s*\(\s*["''][a-zA-Z0-9_\-\/]+(\.twig|\.tpl)?["'']'
    remediation: |
      Never construct template paths or inline template strings from untrusted input. Use predefined template files and pass data via the context array.

    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/1336.html"
  - id: YII-ENT-006
    title: "Broken Access Control (Missing checkAccess in Controller)"
    description: >
      Yii2 Controller uses RBAC but does not call `Yii::$app->user->can()` or `checkAccess()` for sensitive CRUD actions. This allows IDOR where users can manipulate data that does not belong to them.
    severity: high
    confidence: high
    category: Broken Access Control
    tags: [auth, rbac, yii2, cwe-284]
    owasp: "A07:2021"
    cwe: "CWE-284"
    patterns:
      - type: regex
        target: php-files
        pattern: 'public\s+function\s+action(Update|Delete|Edit)\s*\(.*\)\s*\{[^}]*(findModel|findOne)'
        exclude_pattern: '(can\(|checkAccess)'
    remediation: |
      Always check user permissions before performing actions on models:
      `if (!Yii::$app->user->can('updatePost', ['post' => $model])) { throw new ForbiddenHttpException(); }`

    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/284.html"
  - id: YII-ENT-007
    title: "YII_DEBUG Active in Production Environment"
    description: >
      `defined('YII_DEBUG') or define('YII_DEBUG', true);` in `index.php` exposes internal system details, stack traces, and SQL queries on error pages. This provides valuable information for attackers to design further attacks.
    severity: high
    confidence: high
    category: Information Disclosure
    tags: [debug, disclosure, yii2, cwe-489]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: php-files
        pattern: "define\\(\\s*['\"]YII_DEBUG['\"]\\s*,\\s*true\\s*\\)"
    remediation: |
      Ensure `YII_DEBUG` is set to false in the production `web/index.php` file:
      `defined('YII_DEBUG') or define('YII_DEBUG', false);`
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/489.html"

  - id: YII-ENT-008
    title: "CORS Wildcard Origin with Credentials Enabled"
    description: >
      Yii2 CORS configuration allows `Origin => ['*']` while credentials are enabled.
      This combination permits cross-site credentialed requests and can leak sensitive data
      to untrusted origins.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Misconfiguration
    tags: [yii2, cors, owasp-a05-2021, cwe-346, asvs-14.2.5, nist-sc-23]
    owasp: "A05:2021"
    cwe: "CWE-346"
    condition: all
    patterns:
      - type: regex
        target: php-files
        pattern: "['\"]Origin['\"]\\s*=>\\s*\\[\\s*['\"]\\*['\"]\\s*\\]"
      - type: regex
        target: php-files
        pattern: "['\"]Access-Control-Allow-Credentials['\"]\\s*=>\\s*true"
    remediation: |
      Do not use wildcard origin when credentials are active.
      Use explicit origin allowlists and periodically audit CORS headers.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://owasp.org/www-project-application-security-verification-standard/"
      - "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf"

  - id: YII-ENT-009
    title: "File Validator Without Extension or MIME Restrictions"
    description: >
      Yii2 `file` validator is used without strict `extensions`, `mimeTypes`, or `maxSize`.
      This increases the risk of malicious upload payloads and unsafe file processing.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: File Upload
    tags: [yii2, upload, owasp-a08-2021, cwe-434, asvs-12.3.1, pci-dss-6.2]
    owasp: "A08:2021"
    cwe: "CWE-434"
    condition: all
    patterns:
      - type: regex
        target: php-files
        pattern: "\\[\\s*\\[[^\\]]+\\]\\s*,\\s*['\"]file['\"]\\s*\\]"
      - type: regex
        target: php-files
        pattern: "(extensions|mimeTypes|maxSize|checkExtensionByMimeType)"
        negative: true
    remediation: |
      Set upload constraints explicitly on each file validator:
      `extensions`, `mimeTypes`, `maxSize`, and store files in non-executable directories.
    references:
      - "https://owasp.org/www-community/vulnerabilities/Unrestricted_File_Upload"
      - "https://cwe.mitre.org/data/definitions/434.html"
      - "https://owasp.org/www-project-application-security-verification-standard/"

  - id: YII-ENT-010
    title: "Command Execution with User-Controlled Input"
    description: >
      Dangerous process execution functions receive untrusted input from request sources.
      This can lead to command injection and full server compromise.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: OS Command Injection
    tags: [yii2, command-injection, owasp-a03-2021, cwe-78, asvs-5.3.8, nist-si-10]
    owasp: "A03:2021"
    cwe: "CWE-78"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(shell_exec|exec|passthru|system|popen|proc_open)\s*\([^)]*(\$_GET|\$_POST|\$_REQUEST|\$request->|Yii::\$app->request->(get|post)\()'
    remediation: |
      Avoid direct command execution with user input.
      Use command allowlists, strict argument validation, and secure process wrappers.
    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/78.html"
      - "https://owasp.org/www-project-application-security-verification-standard/"
