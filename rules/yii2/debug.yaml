meta:
  category: Yii2 - Information Disclosure
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Yii2 2.0.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: YII-DEBUG-001
    title: "Debug Mode or Verbose Diagnostic Exposure"
    description: >
      Debug functionality appears enabled in application or runtime configuration. Production exposure can leak internals and accelerate exploitation.
    severity: medium
    confidence: high
    cvss_v3:
      score: 5.9
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [yii2, debug, diagnostics, owasp-a05-2021, cwe-489, nist-si-11]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: any
        pattern: 'define\(\s*[\"]YII_DEBUG[\"]\s*,\s*true'
    remediation: |
      Disable debug features in production and route diagnostics into secure observability tooling with strict access controls.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/489.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
      - "https://www.yiiframework.com/doc/guide/2.0/en"
  - id: YII-DEBUG-002
    title: "Yii2 VarDumper diagnostic helpers present in runtime code"
    description: >
      Yii2 VarDumper helpers are present in runtime paths and may expose raw
      object graphs, request data, or secrets if reached in production.
    severity: medium
    confidence: high
    cvss_v3:
      score: 6.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [yii2, debug, vardumper, owasp-a05-2021, cwe-489, asvs-14.3.1]
    owasp: "A05:2021"
    cwe: "CWE-489"
    patterns:
      - type: regex
        target: php-files
        pattern: 'VarDumper::(dump|dumpAsString)\s*\('
        exclude_pattern: '(//|#\s|/\*|test|Test|spec)'
    remediation: |
      Remove VarDumper diagnostics from runtime code and route needed insight
      through controlled logging or local-only debugging paths.
    references:
      - "https://cwe.mitre.org/data/definitions/489.html"
      - "https://www.yiiframework.com/doc/api/2.0/yii-helpers-vardumper"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
