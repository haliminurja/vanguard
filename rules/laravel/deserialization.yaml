meta:
  category: Laravel - Deserialization
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: LAR-DESER-001
    title: "Unsafe Deserialization of Untrusted Input"
    description: >
      Request-driven deserialization is detected without strict type, schema, or allowlist controls. This can result in object injection and privilege abuse.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H"
    category: Deserialization
    tags: [laravel, deserialization, object-injection, owasp-a08-2021, cwe-502, asvs-5.5.2]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: '(unserialize|json_decode)\s*\(\s*(\$request->|\$_(?:GET|POST|REQUEST|COOKIE))'
    remediation: |
      Use strict DTOs and validation layers. Avoid direct deserialization into privileged domain objects and reject unknown fields by default.
    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Deserialization_Cheat_Sheet.html"
      - "https://laravel.com/docs"

  - id: LAR-DESER-002
    title: "Laravel Queue Job Dispatched with Unsanitized Request Payload"
    description: >
      A queued job is dispatched with raw request data ($request->all() or
      $request->getContent()). Queue payloads are serialized and stored in
      the backend (Redis, database, SQS). If the queue backend is compromised
      or accessible, an attacker can modify the serialized payload to inject
      arbitrary objects and execute POP chain attacks when the worker processes
      the job.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Insecure Deserialization
    tags: [laravel, deserialization, queue, owasp-a08-2021, cwe-502, asvs-5.5.2]
    owasp: "A08:2021"
    cwe: "CWE-502"
    patterns:
      - type: regex
        target: php-files
        pattern: 'dispatch\s*\(\s*new\s+\w+\s*\(\s*\$request->(all|input|getContent)\s*\(\s*\)'
        exclude_pattern: '(validate|validated|only\(|specific_field)'
    remediation: |
      Validate and filter request data before dispatching to the queue:
        $data = $request->validate([
            'email'   => 'required|email',
            'message' => 'required|string|max:1000',
        ]);
        dispatch(new SendNotification($data['email'], $data['message']));
    references:
      - "https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/"
      - "https://cwe.mitre.org/data/definitions/502.html"
      - "https://laravel.com/docs/queues"
