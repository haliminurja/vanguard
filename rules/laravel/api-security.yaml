meta:
  category: Laravel - API Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: LAR-API-001
    title: "Sensitive Laravel API route without clear authentication or authorization guard"
    description: >
      Sensitive Laravel API routes or API resources are declared without clear
      evidence of `auth`, `auth:sanctum`, or policy/gate middleware nearby.
      This can expose high-value account, billing, or administrative endpoints
      to unauthenticated or weakly authorized callers.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: API Security
    tags: [laravel, api-security, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: routes-files
        pattern: 'Route::apiResource\s*\(\s*[''"](users?|accounts?|profiles?|orders?|payments?|invoices?|settings)[''"]|Route::(get|post|put|patch|delete)\s*\(\s*[''"]/?api/(admin|users?|accounts?|profiles?|billing|payments?|orders?|invoices?|settings)'
        exclude_pattern: '(middleware\s*\([^)]*(auth|auth:sanctum|can:|permission|verified)|Route::middleware\s*\([^)]*(auth|auth:sanctum|can:|permission))'
    remediation: |
      Protect sensitive API routes with explicit authentication middleware and
      authorization checks. Prefer grouped route middleware for `auth:sanctum`
      plus policy/gate enforcement on the controller layer.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://owasp.org/API-Security/editions/2023/en/0xa5-broken-function-level-authorization/"
      - "https://laravel.com/docs/11.x/routing"

  - id: LAR-API-002
    title: "Laravel authentication API endpoint without clear throttling"
    description: >
      Login, token, OTP, or password reset API endpoints are declared without
      clear throttling or rate-limiting indicators nearby. These endpoints are
      common brute-force and credential stuffing targets.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: API Security
    tags: [laravel, api-security, rate-limit, bruteforce, owasp-a04-2021, cwe-307, asvs-2.2.4]
    owasp: "A04:2021"
    cwe: "CWE-307"
    patterns:
      - type: regex
        target: routes-files
        pattern: 'Route::post\s*\(\s*[''"](/?api/)?(login|token|auth|otp|password|forgot|reset)[^''"]*[''"]'
        exclude_pattern: '(throttle|RateLimiter|Limit::perMinute|middleware\s*\([^)]*throttle|Route::middleware\s*\([^)]*throttle)'
    remediation: |
      Apply explicit rate limiting to authentication-related API routes, for
      example `throttle:login` or a dedicated RateLimiter definition with IP and
      account-based controls.
    references:
      - "https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://laravel.com/docs/11.x/routing#rate-limiting"
