meta:
  category: Laravel - Logging and Monitoring
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: LAR-LOG-001
    title: "Sensitive data written to Laravel logs"
    description: >
      Laravel logging calls include secrets, passwords, tokens, or raw
      authorization material. This creates durable downstream exposure in log
      files, central collectors, and support workflows.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
    category: Logging and Monitoring
    tags: [laravel, logging, monitoring, owasp-a09-2021, cwe-532, asvs-9.3.3]
    owasp: "A09:2021"
    cwe: "CWE-532"
    patterns:
      - type: regex
        target: php-files
        pattern: '(Log::|logger\s*\()[^;]*(password|token|secret|authorization|api_key|private_key|otp)'
    remediation: |
      Redact secret-bearing fields before they reach Laravel log channels and
      store only the minimum metadata needed for investigation.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/532.html"
      - "https://laravel.com/docs/11.x/logging"

  - id: LAR-LOG-002
    title: "Laravel exception details returned to the client without clear logging"
    description: >
      Application code returns raw exception messages or traces but does not
      show a nearby logging or reporting call. This leaks internal details and
      weakens detection.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Logging and Monitoring
    tags: [laravel, logging, exception-handling, owasp-a09-2021, cwe-209, asvs-9.1.1]
    owasp: "A09:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*return\s+(response\(\)->json|back\(\)|redirect\(\)|response\(\))[^}]*\$e->(getMessage|getTraceAsString)\(\)'
        exclude_pattern: '(Log::|logger\(|report\()'
    remediation: |
      Call `report($e)` or emit a structured Laravel log event, then return a
      generic client-facing error response.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/209.html"
      - "https://laravel.com/docs/11.x/errors"

  - id: LAR-LOG-003
    title: "Laravel privilege or credential changes without audit logging"
    description: >
      Code changes roles, permissions, or sensitive account state without clear
      evidence of audit logging or activity tracking nearby.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Logging and Monitoring
    tags: [laravel, logging, audit, owasp-a09-2021, cwe-778, asvs-9.2.1]
    owasp: "A09:2021"
    cwe: "CWE-778"
    patterns:
      - type: regex
        target: php-files
        pattern: '(assignRole|syncRoles|removeRole|givePermissionTo|revokePermissionTo|syncPermissions)\s*\('
        exclude_pattern: '(Log::|logger\(|activity\(|audit|event\()'
      - type: regex
        target: php-files
        pattern: '->update\s*\(\s*\[[^\]]*["''](email|password|is_admin|role|status|two_factor_secret|mfa_secret)["'']'
        exclude_pattern: '(Log::|logger\(|activity\(|audit|event\()'
    remediation: |
      Emit audit logs for role, permission, password, MFA, and account-status
      changes with actor, target, source IP, and reason.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/778.html"
      - "https://laravel.com/docs/11.x/logging"
