meta:
  category: Laravel - Logging and Monitoring
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: LAR-LOG-001
    title: "Sensitive Data Written to Application Logs"
    description: >
      Logging statements appear to include credentials or sensitive tokens. This can create downstream data exposure and lateral movement risk.
    severity: medium
    confidence: high
    cvss_v3:
      score: 6.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
    category: Logging and Monitoring
    tags: [laravel, logging, monitoring, owasp-a09-2021, cwe-532, asvs-9.3.3]
    owasp: "A09:2021"
    cwe: "CWE-532"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Log::(debug|info|warning|error)\s*\([^)]*(password|token|secret|authorization)'
    remediation: |
      Mask or hash sensitive values before logging and enforce centralized redaction policies in logging pipelines.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/532.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"
      - "https://laravel.com/docs"

  - id: LAR-LOG-002
    title: "Runtime Error Visibility/Logging Misconfiguration"
    description: >
      Error reporting configuration may suppress or misroute critical security events, reducing detection and incident response capability.
    severity: medium
    confidence: medium
    cvss_v3:
      score: 6.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:N/A:N"
    category: Logging and Monitoring
    tags: [laravel, logging, monitoring, owasp-a09-2021, cwe-778, asvs-9.1.1]
    owasp: "A09:2021"
    cwe: "CWE-778"
    patterns:
      - type: regex
        target: any
        pattern: 'error_reporting\s*\(\s*0\s*\)|ini_set\s*\(\s*[''"]display_errors[''"]\s*,\s*[''"]?1[''"]?\s*\)'
        exclude_pattern: '(test|Test|spec)'
    remediation: |
      Route errors to centralized logs with retention and alerting. Do not suppress events needed for security monitoring.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/778.html"
      - "https://laravel.com/docs"
