meta:
  category: Laravel - Injection
  version: "4.0.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: LAR-INJ-001
    title: "Dynamic Query or Command Construction with User Input"
    description: >
      Potential query construction from untrusted input is detected. Parameterization or strict allowlists may be missing, increasing injection risk.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Injection
    tags: [laravel, injection, sqli, owasp-a03-2021, cwe-89, asvs-5.3.2]
    owasp: "A03:2021"
    cwe: "CWE-89"
    patterns:
      - type: regex
        target: php-files
        pattern: '(DB::raw|whereRaw|selectRaw|orderByRaw|havingRaw|groupByRaw)\s*\(\s*[\"]([^\"]*)\$'
        exclude_pattern: '(prepare\(|bind|intval|absint|escape|quote)'
    remediation: |
      Use parameterized queries and strict input validation. Eliminate string interpolation for SQL and command contexts.
    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/89.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html"
      - "https://laravel.com/docs"

  - id: LAR-INJ-002
    title: "OS Command Execution with User-Controlled Input"
    description: >
      Command execution APIs appear to receive request-influenced input without robust sanitization or allowlisting.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Injection
    tags: [laravel, injection, command-injection, owasp-a03-2021, cwe-78, asvs-5.3.8]
    owasp: "A03:2021"
    cwe: "CWE-78"
    patterns:
      - type: regex
        target: php-files
        pattern: '\b(shell_exec|exec|passthru|system|popen|proc_open)\s*\([^)]*(\$request->|request\(|\$_(?:GET|POST|REQUEST))'
        exclude_pattern: '(escapeshellarg|escapeshellcmd)'
    remediation: |
      Avoid command execution on untrusted input. Use strict allowlists and escape/validate every argument.
    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/78.html"
      - "https://laravel.com/docs"
