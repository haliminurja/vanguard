meta:
  category: Laravel - Business Logic
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: LAR-BIZ-001
    title: "Sensitive Laravel business action without clear authorization check"
    description: >
      Controller methods for refund, approval, cancellation, price updates, or
      destructive mutations are present without nearby evidence of Laravel
      authorization enforcement.
    severity: high
    confidence: medium
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [laravel, business-logic, access-control, owasp-a01-2021, cwe-840, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(update|destroy|delete|approve|refund|cancel|capture|changeRole|setStatus|updatePrice)\b'
        exclude_pattern: '(authorize\s*\(|Gate::|can\s*\(|middleware.*can:|authorizeResource|policy)'
    remediation: |
      Apply explicit policy or gate checks for every business-critical mutation
      and keep object ownership validation close to the write path.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://laravel.com/docs/11.x/authorization"

  - id: LAR-BIZ-002
    title: "Sensitive business fields assigned from Laravel request input"
    description: >
      Price, amount, balance, discount, role, or status values are copied
      directly from a Laravel request into persistence structures.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [laravel, business-logic, pricing, owasp-a04-2021, cwe-840, asvs-4.2.4]
    owasp: "A04:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: '["''](price|amount|balance|discount|credit_limit|role|is_admin|status)["'']\s*=>\s*\$request->(input|get|post)\('
      - type: regex
        target: php-files
        pattern: '->(price|amount|balance|discount|credit_limit|role|is_admin|status)\s*=\s*\$request->(input|get|post)\('
    remediation: |
      Derive privileged business fields server-side or constrain them through
      strict allowlists and authorization-aware validation logic.
    references:
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://laravel.com/docs/11.x/validation"

  - id: LAR-BIZ-003
    title: "Laravel refund or balance mutation uses request-controlled amount"
    description: >
      Refund, credit, debit, transfer, or discount methods receive raw Laravel
      request values directly as the controlling amount or quantity.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Business Logic
    tags: [laravel, business-logic, finance, owasp-a04-2021, cwe-840, asvs-4.2.4]
    owasp: "A04:2021"
    cwe: "CWE-840"
    patterns:
      - type: regex
        target: php-files
        pattern: '->(refund|credit|debit|withdraw|transfer|adjustBalance|setPrice|applyDiscount)\s*\([^)]*\$request->(input|get|integer)\('
      - type: regex
        target: php-files
        pattern: '(refund|credit|debit|withdraw|transfer|adjustBalance|setPrice|applyDiscount)\s*\([^)]*\$request->(input|get|integer)\('
    remediation: |
      Normalize and bound financial input before use, then re-check business
      invariants such as ownership, max allowed adjustment, and current state.
    references:
      - "https://cwe.mitre.org/data/definitions/840.html"
      - "https://owasp.org/www-project-top-ten/"
