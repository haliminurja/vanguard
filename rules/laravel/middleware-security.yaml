meta:
  category: Laravel - Middleware Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: LAR-MID-001
    title: "Sensitive Laravel route without clear middleware guard"
    description: >
      Sensitive mutating Laravel routes are declared without clear authentication
      or authorization middleware nearby. This weakens the request boundary for
      account, billing, or administrative actions.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Middleware Security
    tags: [laravel, middleware-security, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: routes-files
        pattern: 'Route::(post|put|patch|delete)\s*\(\s*[''"][^''"]*(admin|account|settings|billing|profile|payment)[^''"]*[''"]'
        exclude_pattern: '(middleware\s*\([^)]*(auth|auth:sanctum|can:|permission|verified)|Route::middleware\s*\([^)]*(auth|auth:sanctum|can:|permission))'
    remediation: |
      Apply explicit authentication and authorization middleware for privileged
      routes and verify ownership in the controller or policy layer.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://laravel.com/docs/11.x/middleware"

  - id: LAR-MID-002
    title: "Laravel route explicitly bypasses important middleware"
    description: >
      A route or controller explicitly disables middleware via
      `withoutMiddleware()`. When this bypass affects authentication, CSRF,
      signature, verification, or throttling middleware, request protection can
      be materially weakened.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Middleware Security
    tags: [laravel, middleware-security, security-misconfiguration, owasp-a05-2021, cwe-16, asvs-14.2.1]
    owasp: "A05:2021"
    cwe: "CWE-16"
    patterns:
      - type: regex
        target: php-files
        pattern: '->withoutMiddleware\s*\([^)]*(auth|auth:sanctum|Authenticate|verified|signed|throttle|csrf|EnsureEmailIsVerified)'
        exclude_pattern: '(test|Test|fake|stub)'
    remediation: |
      Remove middleware bypass behavior from production paths and review every
      explicit exception against the intended threat model.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/16.html"
      - "https://laravel.com/docs/11.x/middleware"
