  - id: LAR-ENT-019
    title: "Hardcoded Fallback APP_KEY in Configuration"
    description: >
      Configuration sets a hardcoded fallback APP_KEY value in `env('APP_KEY', '...')`.
      If environment injection fails, application may run with predictable key material.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Cryptographic Failure
    enabled: true
    tags: [laravel, app-key, crypto, owasp-a02-2021, cwe-798, asvs-9.1.1, pci-dss-3.6]
    owasp: "A02:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: config-files
        pattern: 'env\s*\(\s*[''\"]APP_KEY[''\"]\s*,\s*[''\"]base64:[^''\"]+[''\"]\s*\)'
    remediation: |
      Do not use a hardcoded fallback APP_KEY. Require the key to be provided from the environment or a secret manager.
      Implement key rotation and standardized recovery procedures.
    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/798.html"
      - "https://laravel.com/docs/encryption"

