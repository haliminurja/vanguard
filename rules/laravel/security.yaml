meta:
  category: Laravel Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria
rules:
  - id: LAR-ENT-001
    title: "Eloquent Mass Assignment — $guarded = [] allows all fields"
    description: >
      The Eloquent model defines $guarded = [] which allows EVERY attribute to be set via create() or update(). An attacker can set is_admin, role, email_verified_at, password, or other sensitive fields via request input if the controller uses $request->all().

    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Mass Assignment
    enabled: true
    tags: [mass-assignment, eloquent, owasp-a04-2021, cwe-915, laravel]
    owasp: "A04:2021"
    cwe: "CWE-915"
    patterns:
      - type: regex
        target: model-files
        pattern: 'protected\s+\$guarded\s*=\s*\[\s*\]'
        exclude_pattern: '(seed|Seed|test|Test|factory|Factory)'
    remediation: |
      Use an explicit $fillable whitelist:
        protected $fillable = ['name', 'email', 'bio', 'avatar'];
        // OR protect sensitive fields
        protected $guarded = ['id', 'is_admin', 'role', 'email_verified_at', 'password'];
    references:
      - "https://cwe.mitre.org/data/definitions/915.html"
      - "https://laravel.com/docs/eloquent#mass-assignment"

  - id: LAR-ENT-004
    title: "File Upload — without MIME type and extension validation"
    description: >
      File upload uses storeAs() or putFile() without validation of mime type, size, and extension within the request validation rules. An attacker can upload PHP shells, web backdoors, or malware that is executed on the server.

    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:H"
    category: Unrestricted File Upload
    enabled: true
    tags: [file-upload, rce, owasp-a04-2021, cwe-434, laravel]
    owasp: "A04:2021"
    cwe: "CWE-434"
    patterns:
      - type: regex
        target: php-files
        pattern: '(\$request->file\(|\$file\s*=\s*\$request->|UploadedFile)[^;]*->(store|storeAs|storePublicly|putFile|putFileAs|move)\s*\('
        exclude_pattern: '(validate|mimes:|mimetypes:|max:|file\|image|->validate\()'
    remediation: |
      Always validate file uploads with strict rules:
        $request->validate([
            'document' => 'required|file|mimes:pdf,doc,docx|max:10240',
            'avatar'   => 'required|image|mimes:jpg,png,webp|max:2048|dimensions:max_width=2000',
        ]);
        // Store with a random name, NOT the original name
        $path = $request->file('document')->store('documents', 's3');
    references:
      - "https://cwe.mitre.org/data/definitions/434.html"
      - "https://laravel.com/docs/validation#rule-mimes"
  - id: LAR-ENT-006
    title: "API Token — Sanctum/Passport token without expiration"
    description: >
      Sanctum or Passport tokens are created without setting an expiration time. Tokens without expiration valid forever — if stolen, the attacker has permanent API access to the user's account.

    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Token Misconfiguration
    enabled: true
    tags: [sanctum, passport, token, owasp-a07-2021, cwe-613, laravel]
    owasp: "A07:2021"
    cwe: "CWE-613"
    patterns:
      - type: regex
        target: php-files
        pattern: '->createToken\s*\(\s*["''][^"'']+["'']\s*\)'
        exclude_pattern: '(expiration|expiresAt|expires_at|addMinutes|addHours|addDays)'
      - type: regex
        target: config-files
        pattern: "'expiration'\\s*=>\\s*(null|0)"
    remediation: |
      Always set an expiration on API tokens:
        // Sanctum — global config
        'expiration' => 60 * 24,  // 24 hours in minutes

        // Sanctum — per-token (Laravel 11+)
        $token = $user->createToken('api', ['*'], now()->addHours(24));

        // Passport
        Passport::tokensExpireIn(now()->addHours(24));
        Passport::refreshTokensExpireIn(now()->addDays(30));
    references:
      - "https://cwe.mitre.org/data/definitions/613.html"
      - "https://laravel.com/docs/sanctum#token-expiration"
  - id: LAR-ENT-008
    title: "Artisan Command Injection — arguments from user input"
    description: >
      Artisan::call() or Artisan::queue() is called with arguments originating from a request. Some Artisan commands can read files, delete data, or execute arbitrary code.

    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Command Injection
    enabled: true
    tags: [cmd-injection, artisan, owasp-a03-2021, cwe-78, laravel]
    owasp: "A03:2021"
    cwe: "CWE-78"
    patterns:
      - type: regex
        target: php-files
        pattern: 'Artisan::(call|queue)\s*\(\s*(\$request->|request\(|\$_GET|\$_POST)'
    remediation: |
      Do not allow users to choose Artisan commands. Use a whitelist:
        $allowedCommands = ['cache:clear', 'queue:restart'];
        $command = $request->input('command');
        abort_unless(in_array($command, $allowedCommands, true), 422);
        Artisan::call($command);
    references:
      - "https://cwe.mitre.org/data/definitions/78.html"
  - id: LAR-ENT-009
    title: "APP_KEY weak, default, or placeholder"
    description: >
      APP_KEY is set to a placeholder value ('base64:...short...', 'SomeRandomString', or empty). APP_KEY is the root of trust for encrypting cookies, sessions, signed URLs, and all data encrypted via the Crypt facade. A weak key means all encryption can be broken.

    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Cryptographic Failure
    enabled: true
    tags: [crypto, app-key, owasp-a02-2021, cwe-321, laravel]
    owasp: "A02:2021"
    cwe: "CWE-321"
    patterns:
      - type: regex
        target: env-files
        pattern: "APP_KEY\\s*=\\s*$"
      - type: regex
        target: env-files
        pattern: "APP_KEY\\s*=\\s*(SomeRandomString|YourAppKey|changeme|secret|base64:[A-Za-z0-9+/=]{1,20}$)"
    remediation: |
      Generate a strong key with Artisan:
        php artisan key:generate
      The key must be a base64-encoded 256-bit random value.
      Do not share APP_KEY between environments.
    references:
      - "https://cwe.mitre.org/data/definitions/321.html"
      - "https://laravel.com/docs/encryption"
  - id: LAR-ENT-012
    title: "Controller CRUD without authorization check"
    description: >
      The update/delete/store method in a Resource controller accesses a model without calling $this->authorize(), Gate::allows(), or using a Policy. Without authorization, any authenticated user can modify data belonging to other users.

    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Broken Access Control
    enabled: true
    tags: [authorization, idor, owasp-a01-2021, cwe-862, laravel]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: controller-files
        pattern: 'public\s+function\s+(update|destroy|delete|edit|store)\s*\([^)]*\$\w+\s*\)\s*\{[^}]*->update\s*\('
        exclude_pattern: '(authorize|Gate::|can\(|policy|abort_unless|abort_if|middleware.*can:)'
    remediation: |
      Use Laravel Policies for every CRUD operation:
        public function update(Request $request, Post $post)
        {
            $this->authorize('update', $post);
            // ... update logic
        }
    references:
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://laravel.com/docs/authorization"
  - id: LAR-ENT-013
    title: "Scheduled task running command with secret in arguments"
    description: >
      The Laravel Task Scheduler (Kernel.php or console.php) defines a scheduled command with an API key, password, or secret hardcoded as an argument. This value is exposed in the process list, Telescope, and scheduler logs.

    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:L/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Hardcoded Secret
    enabled: true
    tags: [scheduler, hardcoded-credential, owasp-a07-2021, cwe-798, laravel]
    owasp: "A07:2021"
    cwe: "CWE-798"
    patterns:
      - type: regex
        target: php-files
        pattern: '(->command|Artisan::call)\s*\(\s*[''"][^''"]*(password|secret|api_key|token|key)\s*=\s*[^$]'
        exclude_pattern: '(env\(|config\(|getenv)'
    remediation: |
      Use environment variables for all secrets:
        $schedule->command('sync:data --api-key=' . config('services.api.key'))->daily();
    references:
      - "https://cwe.mitre.org/data/definitions/798.html"
  - id: LAR-ENT-014
    title: "Event Listener handling sensitive data without validation"
    description: >
      The event listener receives an event payload and performs database operations or API calls without validating the event data. Events from untrusted sources (webhooks, queues) can contain payloads manipulated for SQL injection or privilege escalation.

    severity: medium
    confidence: medium
    cvss_v3:
      score: 6.5
      vector: "CVSS:3.1/AV:N/AC:H/PR:L/UI:N/S:U/C:L/I:H/A:N"
    category: Input Validation
    enabled: true
    tags: [events, input-validation, owasp-a03-2021, cwe-20, laravel]
    owasp: "A03:2021"
    cwe: "CWE-20"
    patterns:
      - type: regex
        target: php-files
        pattern: 'function\s+handle\s*\(\s*\w+Event\s+\$event\s*\)\s*\{[^}]*DB::'
        exclude_pattern: '(validate|validator|sanitize|filter_var|intval)'
    remediation: |
      Validate event data before any operation:
        public function handle(OrderEvent $event): void
        {
            $orderId = (int) $event->orderId;
            abort_if($orderId <= 0, 422);
            // ... process order
        }
    references:
      - "https://cwe.mitre.org/data/definitions/20.html"
  - id: LAR-ENT-015
    title: "Laravel Telescope/Horizon not protected by authentication in production"
    description: >
      Laravel Telescope or Horizon dashboards are accessed without adequate gate authorization. These dashboards expose database queries, request payloads, queue jobs, exceptions, and logs — information that is very valuable for attackers to plan targeted attacks.

    severity: critical
    confidence: high
    cvss_v3:
      score: 8.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N"
    category: Information Disclosure
    enabled: true
    tags: [telescope, horizon, debug-exposure, owasp-a05-2021, cwe-200, laravel]
    owasp: "A05:2021"
    cwe: "CWE-200"
    patterns:
      - type: regex
        target: php-files
        pattern: '(Telescope|Horizon)::auth\s*\(\s*function\s*\([^)]*\)\s*\{[^}]*return\s+true'
      - type: regex
        target: config-files
        pattern: "'enabled'\\s*=>\\s*(true|env\\s*\\(\\s*'TELESCOPE_ENABLED')"
        exclude_pattern: '(app\(\)->isLocal|app\(\)->environment\(\s*["\x27]local|APP_ENV|isProduction)'
    remediation: |
      Protect the dashboard with strict gate authorization:
        // TelescopeServiceProvider.php
        Telescope::auth(function ($request) {
            return $request->user()?->isAdmin() ?? false;
        });

        // In production, consider disabling it entirely:
        TELESCOPE_ENABLED=false
    references:
      - "https://cwe.mitre.org/data/definitions/200.html"
      - "https://laravel.com/docs/telescope#authorization"
  - id: CFG-CSRF02
    title: "Blade form without @csrf directive"
    description: >
      A <form> tag with a non-GET method in a Blade template does not include @csrf. Without CSRF token validation, the form is vulnerable to cross-site request forgery from any origin that can trick a logged-in user.

    severity: high
    confidence: high
    category: CSRF
    tags: [csrf, blade, owasp-a05, cwe-352, laravel]
    owasp: "A05:2021"
    cwe: "CWE-352"
    condition: all
    patterns:
      - type: regex
        target: blade-files
        pattern: '<form[^>]+method\s*=\s*["'']?(POST|PUT|PATCH|DELETE)[^>]*>'
      - type: contains
        target: blade-files
        pattern: "@csrf"
        negative: true
    remediation: |
      Add @csrf inside every non-GET Blade form:
        <form method="POST" action="{{ route('profile.update') }}">
            @csrf
            @method('PUT')
            <!- form fields ->
        </form>
    references:
      - "https://cwe.mitre.org/data/definitions/352.html"
      - "https://laravel.com/docs/csrf"
  - id: SUPPLY-005
    title: "NPM/Node dependency loaded from CDN without Subresource Integrity (SRI)"
    description: >
      A script or stylesheet is loaded from an external CDN (cdnjs, jsdelivr, unpkg, googleapis) without an integrity attribute (Subresource Integrity). If the CDN is compromised, an attacker can insert malicious JavaScript that is executed in the browsers of all users.

    severity: high
    confidence: high
    category: Third-Party Script
    tags: [supply-chain, cdn, sri, owasp-a08, cwe-829]
    cwe: "CWE-829"
    owasp: "A08:2021"
    patterns:
      - type: regex
        target: blade-files
        pattern: '<script[^>]+src\s*=\s*["'']https?://(cdn|cdnjs|unpkg|jsdelivr|googleapis)'
        exclude_pattern: 'integrity\s*='
      - type: regex
        target: blade-files
        pattern: '<link[^>]+href\s*=\s*["'']https?://(cdn|cdnjs|unpkg|jsdelivr|googleapis)'
        exclude_pattern: 'integrity\s*='
    remediation: |
      Add Subresource Integrity (SRI) hashes to all CDN resources:
        <script
            src="https://cdn.jsdelivr.net/npm/axios@1.6/dist/axios.min.js"
            integrity="sha384-REAL_HASH_HERE"
            crossorigin="anonymous">
        </script>
      Generate SRI hashes: https://www.srihash.org/
    references:
      - "https://cwe.mitre.org/data/definitions/829.html"
      - "https://developer.mozilla.org/en-US/docs/Web/Security/Subresource_Integrity"
  - id: XSS-B01
    title: "Blade raw output {!! !!} with untrusted variable"
    description: >
      The Blade raw output directive {!! !!} bypasses HTML escaping. Any user-controlled content rendered this way creates a stored or reflected XSS vector that executes in the victim's browser.

    severity: high
    confidence: medium
    category: Reflected/Stored XSS
    tags: [xss, blade, owasp-a03, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: blade-files
        pattern: '\{!!\s*\$'
        exclude_pattern: '(config|asset|Purifier|purify|clean\(|sanitize|strip_tags|e\(|htmlspecialchars)'
    remediation: |
      Use escaped Blade output for all user content:
        {{ $userContent }}
      Reserve {!! !!} only for trusted static HTML or sanitized content:
        {!! Purifier::clean($richText) !!}
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
      - "https://laravel.com/docs/blade#displaying-data"
  - id: XSS-B02
    title: "Blade raw output from request data (old/request/Input)"
    description: >
      The directive {!! !!} renders data directly from an HTTP request (old(), request(), Input::). Request data is always attacker-controlled and should never be rendered without escaping.

    severity: critical
    confidence: high
    category: Reflected XSS
    tags: [xss, blade, owasp-a03, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: blade-files
        pattern: '\{!!\s*(old\(|request\(|Input::|\$_GET|\$_POST|\$_REQUEST)'
    remediation: |
      Use double-brace syntax which automatically escapes output:
        {{ old('name') }}
        {{ request('query') }}
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-B03
    title: "Blade @php echo - outputting variables without escaping"
    description: >
      An @php/@endphp block uses echo/print to output a variable without passing it through htmlspecialchars() or e(). @php output is not processed by Blade's auto-escaping pipeline.

    severity: high
    confidence: medium
    category: Stored/Reflected XSS
    tags: [xss, blade, owasp-a03, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: blade-files
        pattern: '@php\s*(echo|print)\s+\$\w+'
        exclude_pattern: '(htmlspecialchars|e\(|strip_tags|ENT_QUOTES|Purifier)'
      - type: regex
        target: blade-files
        pattern: '@php.*echo\s+\$(_GET|_POST|_REQUEST|request)'
    remediation: |
      Use escaped Blade output instead of echo inside @php:
        {{ $variable }}
      If @php is required, always escape:
        @php echo e($variable); @endphp
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-H01
    title: "Inline event handler with user-controlled data"
    description: >
      The Blade template contains inline event handler attributes (onclick, onerror, onload, etc.) whose values include user data. Even with HTML attribute encoding, placing user data inside an event handler creates a JavaScript injection vector.

    severity: high
    confidence: high
    category: DOM XSS
    tags: [xss, dom-xss, owasp-a03, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: blade-files
        pattern: 'on(click|error|load|mouseover|submit|focus|blur|change|keyup|keydown)\s*=\s*["''][^"'']*\{\{'
    remediation: |
      Never mix user data with inline event handlers.
      Use data attributes and JavaScript event listeners instead:
        <button data-id="{{ $id }}" class="js-action">Click</button>
        <script>
        document.querySelectorAll('.js-action').forEach(b =>
            b.addEventListener('click', () => handle(b.dataset.id)));
        </script>
    references:
      - "https://cheatsheetseries.owasp.org/cheatsheets/DOM_based_XSS_Prevention_Cheat_Sheet.html"
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-H02
    title: "href with user data potentially a javascript: URI"
    description: >
      The Blade template generates an href attribute using user data without schema validation. An attacker could insert a javascript: URI that executes in the browser when the link is clicked.

    severity: high
    confidence: medium
    category: DOM XSS
    tags: [xss, dom-xss, owasp-a03, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: blade-files
        pattern: 'href\s*=\s*["'']?\{\{[^}]*(request|old|input|url|link|param)[^}]*\}\}'
        exclude_pattern: '(route\(|url\(|asset\(|secure_url\(|Str::startsWith)'
    remediation: |
      Validate the URL before using it in an href attribute:
        @php
            $url = Str::startsWith($link, ['https://', '/']) ? $link : '#';
        @endphp
        <a href="{{ $url }}">Link</a>
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: XSS-H03
    title: "Inline JSON data in <script> without @json directive"
    description: >
      PHP data is embedded inside a <script> tag using echo or string interpolation without using Blade's @json directive or json_encode() with JSON_HEX_TAG. Raw JSON can contain </script> sequences that break out of the script context.

    severity: high
    confidence: high
    category: Stored/Reflected XSS
    tags: [xss, owasp-a03, cwe-79]
    owasp: "A03:2021"
    cwe: "CWE-79"
    patterns:
      - type: regex
        target: blade-files
        pattern: '<script[^>]*>[\s\S]*?\{\{[\s\S]*?\}\}[\s\S]*?<\/script>'
        exclude_pattern: '(@json|JSON_HEX_TAG|json_encode)'
    remediation: |
      Use Blade's @json directive which automatically sets the correct flags:
        <script>const config = @json($config);</script>
      Alternatively, use json_encode() with HTML-safe flags:
        <?= json_encode($data, JSON_HEX_TAG|JSON_HEX_APOS|JSON_HEX_QUOT|JSON_HEX_AMP) ?>
    references:
      - "https://cwe.mitre.org/data/definitions/79.html"
  - id: BIZ-002
    title: "Insecure Password Reset - Reset token sent as HTTP GET parameter"
    description: >
      The application sends the password reset token via a GET query string or a Blade template. 
      GET parameters are vulnerable to being recorded in server logs, proxies, and browser history.
    severity: high
    confidence: medium
    category: Info Disclosure
    tags: [business-logic, password-reset, cwe-598, owasp-a02, laravel]
    owasp: "A02:2021"
    cwe: "CWE-598"
    patterns:
      - type: regex
        target: php-files
        pattern: "redirect\\s*\\(\\s*\\)\\s*->\\s*(to|away|route)\\s*\\(.*\\?.*(token|reset_token)=\\$.*"
      - type: regex
        target: blade-files
        pattern: "action=[\"']\\s*\\{\\{\\s*route\\s*\\(.*(token)=\\$"
    remediation: |
      Use the framework's built-in reset mechanism with a POST flow and secure token handling 
      (e.g., Password::broker()).
    references:
      - "https://cwe.mitre.org/data/definitions/598.html"

  - id: LAR-ENT-017
    title: "Trusted Proxies Wildcard Configuration"
    description: >
      Trusting all proxies (`*`) can enable spoofing of forwarded headers,
      impacting IP-based controls, URL generation, and security decisions.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Security Misconfiguration
    enabled: true
    tags: [laravel, proxy, header-spoofing, owasp-a05-2021, cwe-345, asvs-14.4.3]
    owasp: "A05:2021"
    cwe: "CWE-345"
    patterns:
      - type: regex
        target: middleware-files
        pattern: "protected\\s+\\$proxies\\s*=\\s*(['\"]\\*['\"]|\\[\\s*['\"]\\*['\"]\\s*\\])"
    remediation: |
      Restrict trusted proxies to known IP addresses or ranges of your reverse proxy infrastructure.
      Audit the use of forwarded headers for authentication, rate limiting, and logging.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/345.html"
      - "https://laravel.com/docs/requests#configuring-trusted-proxies"

  - id: LAR-ENT-018
    title: "CORS Wildcard Origin with supports_credentials Enabled"
    description: >
      `config/cors.php` enables wildcard origins while credentials are enabled.
      This can leak authenticated responses to untrusted origins.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Misconfiguration
    enabled: true
