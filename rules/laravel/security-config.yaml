meta:
  category: Laravel - Security Configuration
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "Laravel 10-12, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: LAR-SECCFG-001
    title: "Wildcard credentialed CORS policy in Laravel configuration"
    description: >
      Laravel CORS configuration combines `allowed_origins => ['*']` with
      `supports_credentials => true`. This weakens browser origin isolation for
      authenticated requests.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Security Configuration
    tags: [laravel, security-config, hardening, owasp-a05-2021, cwe-16, cis-control-4]
    owasp: "A05:2021"
    cwe: "CWE-16"
    condition: all
    patterns:
      - type: regex
        target: config-files
        pattern: "['\"]allowed_origins['\"]\\s*=>\\s*\\[\\s*['\"]\\*['\"]\\s*\\]"
      - type: regex
        target: config-files
        pattern: "['\"]supports_credentials['\"]\\s*=>\\s*true"
    remediation: |
      Restrict credentialed CORS to explicit trusted origins.
      Do not combine wildcard origins with cookies or other browser credentials.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/16.html"
      - "https://owasp.org/www-project-application-security-verification-standard/"
      - "https://laravel.com/docs"

  - id: LAR-SECCFG-002
    title: "Manual wildcard CORS response header"
    description: >
      Application code emits a wildcard CORS origin header directly. This can
      expose sensitive responses cross-origin when applied to authenticated or
      sensitive endpoints.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Configuration
    tags: [laravel, security-config, cors, owasp-a05-2021, cwe-346, asvs-14.2.5]
    owasp: "A05:2021"
    cwe: "CWE-346"
    patterns:
      - type: regex
        target: any
        pattern: "['\"]Access-Control-Allow-Origin['\"]\\s*=>\\s*['\"]\\*['\"]|header\\s*\\(\\s*['\"]Access-Control-Allow-Origin:\\s*\\*"
    remediation: |
      Use strict origin allowlists and avoid wildcard origins for sensitive or credentialed endpoints.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://laravel.com/docs"
