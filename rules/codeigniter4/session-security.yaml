meta:
  category: CodeIgniter 4 - Session Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 4.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CI4-SESSION-001
    title: "CodeIgniter 4 session cookie configuration is weak"
    description: >
      CodeIgniter 4 session or cookie settings disable secure or HttpOnly
      cookies, or use SameSite=None. This weakens session theft protections.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Session Security
    tags: [codeigniter4, session-security, cookie, owasp-a07-2021, cwe-614, asvs-3.4.3]
    owasp: "A07:2021"
    cwe: "CWE-614"
    patterns:
      - type: regex
        target: config-files
        pattern: 'public\s+\$cookieSecure\s*=\s*false|public\s+\$cookieHTTPOnly\s*=\s*false|public\s+\$cookieSameSite\s*=\s*[''"]?None[''"]?'
    remediation: |
      Keep CodeIgniter 4 cookies secure, HttpOnly, and SameSite-restricted in
      production configuration.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/614.html"
      - "https://codeigniter4.github.io/userguide/libraries/sessions.html"

  - id: CI4-SESSION-002
    title: "CodeIgniter 4 session rotation is disabled or preserves old sessions"
    description: >
      CodeIgniter 4 session ID rotation is disabled or configured to retain old
      sessions, weakening fixation protection after sensitive transitions.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Session Security
    tags: [codeigniter4, session-security, fixation, owasp-a07-2021, cwe-384, asvs-3.3.2]
    owasp: "A07:2021"
    cwe: "CWE-384"
    patterns:
      - type: regex
        target: config-files
        pattern: 'public\s+\$timeToUpdate\s*=\s*0|public\s+\$regenerateDestroy\s*=\s*false'
    remediation: |
      Keep session rotation enabled and destroy the old session when the
      framework rotates the identifier.
    references:
      - "https://cwe.mitre.org/data/definitions/384.html"
      - "https://codeigniter4.github.io/userguide/libraries/sessions.html"

  - id: CI4-SESSION-003
    title: "CodeIgniter 4 accepts session IDs from request input"
    description: >
      CodeIgniter 4 code sources the session ID from GET, POST, or cookie input.
      This is a direct session fixation risk.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Session Security
    tags: [codeigniter4, session-security, fixation, owasp-a07-2021, cwe-384, asvs-3.3.2]
    owasp: "A07:2021"
    cwe: "CWE-384"
    patterns:
      - type: regex
        target: php-files
        pattern: 'session_id\s*\(\s*(\$this->request->get(Get|Post|Cookie)\s*\(|\$_(?:GET|POST|REQUEST|COOKIE))'
      - type: regex
        target: php-files
        pattern: '["''][^"'']*PHPSESSID='
    remediation: |
      Accept session identifiers only from framework-managed secure cookies and
      never from request-controlled parameters.
    references:
      - "https://cwe.mitre.org/data/definitions/384.html"
      - "https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"
