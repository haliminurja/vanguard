meta:
  category: CodeIgniter 4 - Logging and Monitoring
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 4.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CI4-LOG-001
    title: "Sensitive data written to CodeIgniter 4 logs"
    description: >
      CodeIgniter 4 logging calls include credentials, secrets, or authorization
      material. This creates durable downstream disclosure risk.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.4
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:N/A:N"
    category: Logging and Monitoring
    tags: [codeigniter4, logging, monitoring, owasp-a09-2021, cwe-532, asvs-9.3.3]
    owasp: "A09:2021"
    cwe: "CWE-532"
    patterns:
      - type: regex
        target: php-files
        pattern: 'log_message\s*\(\s*[''"](debug|info|warning|error)[''"]\s*,\s*.*(password|token|secret|authorization|api_key|private_key|otp)'
    remediation: |
      Redact or omit secret-bearing fields before they enter CodeIgniter 4
      logs.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/532.html"
      - "https://codeigniter4.github.io/userguide/general/errors.html"

  - id: CI4-LOG-002
    title: "CodeIgniter 4 exception details returned to clients without clear logging"
    description: >
      CodeIgniter 4 code returns raw exception details to the client without
      nearby logging. This leaks internals and weakens investigation capability.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Logging and Monitoring
    tags: [codeigniter4, logging, exception-handling, owasp-a09-2021, cwe-209, asvs-9.1.1]
    owasp: "A09:2021"
    cwe: "CWE-209"
    patterns:
      - type: regex
        target: php-files
        pattern: 'catch\s*\([^)]*\$e\s*\)\s*\{[^}]*return\s+\$this->response->(setJSON|setBody)[^}]*\$e->(getMessage|getTraceAsString)\(\)'
        exclude_pattern: 'log_message\s*\('
    remediation: |
      Log the exception server-side and return only normalized, generic error
      responses to users and API clients.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/209.html"
      - "https://codeigniter4.github.io/userguide/general/errors.html"

  - id: CI4-LOG-003
    title: "CodeIgniter 4 privilege or account-state changes without audit logging"
    description: >
      Role, password, email, or account-status changes appear without nearby
      audit logging.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N"
    category: Logging and Monitoring
    tags: [codeigniter4, logging, audit, owasp-a09-2021, cwe-778, asvs-9.2.1]
    owasp: "A09:2021"
    cwe: "CWE-778"
    patterns:
      - type: regex
        target: php-files
        pattern: 'session\(\)->set\s*\(\s*\[[^\]]*[''"](role|is_admin)[''"]'
        exclude_pattern: 'log_message\s*\('
      - type: regex
        target: php-files
        pattern: '->(update|save)\s*\(\s*\[[^\]]*[''"](role|password|email|status)[''"]'
        exclude_pattern: 'log_message\s*\('
    remediation: |
      Emit structured audit records for privilege and account-state changes with
      actor, target, origin, and reason metadata.
    references:
      - "https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/"
      - "https://cwe.mitre.org/data/definitions/778.html"
