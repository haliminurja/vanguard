meta:
  category: CodeIgniter 4 - Authentication
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 4.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CI4-AUTH-001
    title: "CodeIgniter 4 session identity or role sourced from request input"
    description: >
      Session identity or privilege context is established directly from request
      data. This can enable impersonation or privilege escalation.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authentication
    tags: [codeigniter4, auth, impersonation, owasp-a07-2021, cwe-287, asvs-2.1.1]
    owasp: "A07:2021"
    cwe: "CWE-287"
    patterns:
      - type: regex
        target: php-files
        pattern: 'session\(\)->set\(\s*[''"](user|user_id|role|is_admin)[''"]\s*,\s*\$this->request->get(Post|Get)'
      - type: regex
        target: php-files
        pattern: 'session\(\)->set\(\s*\[[^\]]*[''"](user|user_id|role|is_admin)[''"]\s*=>\s*\$this->request->get(Post|Get)'
    remediation: |
      Resolve the authenticated user server-side after verified credential or
      token checks. Do not let raw request data define session identity.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/287.html"
      - "https://codeigniter4.github.io/userguide/libraries/sessions.html"

  - id: CI4-AUTH-002
    title: "Sensitive CodeIgniter 4 route without clear auth filter"
    description: >
      A privileged route is declared without nearby evidence of auth,
      permission, or session filters.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Authorization
    tags: [codeigniter4, auth, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: routes-files
        pattern: '\$routes->(get|post|put|patch|delete)\(\s*[''"]/?(admin|dashboard|account|billing|settings|profile|password)[^''"]*[''"]'
        exclude_pattern: '(filter[s]?\s*=>\s*[''"](auth|session|permission)|->group\s*\([^)]*[''"]filter[''"]\s*=>\s*[''"](auth|session|permission))'
    remediation: |
      Apply explicit route filters for authentication and authorization to every
      privileged CodeIgniter 4 route.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://codeigniter4.github.io/userguide/incoming/filters.html"

  - id: CI4-AUTH-003
    title: "CodeIgniter 4 login or recovery route without clear throttling"
    description: >
      Login, password reset, or OTP routes appear without visible throttling or
      rate-limit controls nearby.
    severity: high
    confidence: medium
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:L/A:N"
    category: Authentication
    tags: [codeigniter4, auth, rate-limit, bruteforce, owasp-a07-2021, cwe-307, asvs-2.2.4]
    owasp: "A07:2021"
    cwe: "CWE-307"
    patterns:
      - type: regex
        target: routes-files
        pattern: '\$routes->post\(\s*[''"]/?(login|signin|password|forgot|reset|otp|2fa)[^''"]*[''"]'
        exclude_pattern: '(throttle|throttler|rateLimit|rate_limit)'
    remediation: |
      Apply a CodeIgniter 4 throttler or equivalent rate limit to every
      authentication and recovery route.
    references:
      - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
      - "https://cwe.mitre.org/data/definitions/307.html"
      - "https://codeigniter4.github.io/userguide/libraries/throttler.html"
