meta:
  category: CodeIgniter 4 - Middleware Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 4.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:
  - id: CI4-MID-001
    title: "Sensitive CodeIgniter 4 route without clear auth filter"
    description: >
      Sensitive mutating CodeIgniter 4 routes are declared without visible auth
      filter indicators in the same routing context.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:N"
    category: Middleware Security
    tags: [codeigniter4, middleware-security, access-control, owasp-a01-2021, cwe-862, asvs-4.1.3]
    owasp: "A01:2021"
    cwe: "CWE-862"
    patterns:
      - type: regex
        target: routes-files
        pattern: '\$routes->(post|put|patch|delete)\(\s*[''"][^''"]*(admin|account|settings|billing|profile|payment)[^''"]*[''"]'
        exclude_pattern: '(filter[s]?\s*=>\s*[''"][^''"]*(auth|session|jwt|api|bearer)|group\s*\([^)]*filter)'
    remediation: |
      Apply explicit auth filters to privileged routes and verify authorization
      deeper in the controller or service layer.
    references:
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      - "https://cwe.mitre.org/data/definitions/862.html"
      - "https://codeigniter.com/user_guide/"

  - id: CI4-MID-002
    title: "CodeIgniter 4 CSRF filter broadly bypassed"
    description: >
      CodeIgniter 4 configuration exempts every route from the CSRF filter by
      using a wildcard exception list. This effectively disables CSRF protection
      for browser-based state-changing requests.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.0
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:N"
    category: Middleware Security
    tags: [codeigniter4, middleware-security, security-misconfiguration, owasp-a05-2021, cwe-16, asvs-14.2.1]
    owasp: "A05:2021"
    cwe: "CWE-16"
    patterns:
      - type: regex
        target: config-files
        pattern: 'csrf\s*=>\s*\[\s*[''"]except[''"]\s*=>\s*\[\s*[''"]\*[''"]'
    remediation: |
      Remove wildcard CSRF exceptions and keep exceptions narrowly scoped to
      endpoints that are demonstrably safe or protected by a separate mechanism.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/16.html"
      - "https://codeigniter.com/user_guide/"
