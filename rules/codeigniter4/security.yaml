
meta:
  category: CodeIgniter 4 Security
  version: "4.1.0"
  maintainer: "Security Engineering Team"
  updated: "2026"
  scope: "CodeIgniter 4.x, PHP 8.0-8.4"
  compliance:
    - OWASP-Top10-2021
    - CWE-SANS-Top25
    - NIST-SP-800-53
    - PCI-DSS-v4
    - ISO-27001
    - OWASP-ASVS-4.0.3
    - NIST-CSF-2.0
    - CIS-Controls-v8
    - SOC2-Trust-Services-Criteria

rules:

  - id: CI4-ENT-001
    title: "Entity / Model Mass Assignment ($allowedFields Misconfiguration)"
    description: >
      CodeIgniter 4 defines secure mass assignment using the `$allowedFields` array inside the Model. If `$allowedFields` is left empty, undefined, or manually disabled via `protect(false)`, the application allows attackers to override user IDs, roles, or administrative flags.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: Mass Assignment
    enabled: true
    tags: [mass-assignment, codeigniter4, owasp-a04-2021, cwe-915]
    owasp: "A04:2021"
    cwe: "CWE-915"
    patterns:
      - type: regex
        target: model-files
        pattern: 'protected\s+\$allowedFields\s*=\s*\[\s*\]'
      - type: regex
        target: php-files
        pattern: '->protect\s*\(\s*(false|0|FALSE)\s*\)'
    remediation: |
      Explicitly define exactly which fields can be updated:
      `protected $allowedFields = ['name', 'email', 'bio'];` Ensure sensitive properties like `is_admin` are not in this array.

    references:
      - "https://owasp.org/Top10/A04_2021-Insecure_Design/"
      - "https://cwe.mitre.org/data/definitions/915.html"
  - id: CI4-ENT-002
    title: "Bypassed Validation on Model ->save()"
    description: >
      Model validation is explicitly bypassed using `->skipValidation(true)`. If `$data` contains raw payload elements, the CodeIgniter 4 validation rules are ignored entirely, leading to malicious persistence.
    severity: high
    confidence: high
    cvss_v3:
      score: 7.5
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:H/A:N"
    category: Validation
    enabled: true
    tags: [validation, codeigniter4, cwe-20, owasp-a03-2021]
    owasp: "A03:2021"
    cwe: "CWE-20"
    patterns:
      - type: regex
        target: php-files
        pattern: '->skipValidation\s*\(\s*(true|1|TRUE)\s*\)'
    remediation: |
      Avoid suppressing framework validation for user input. If it must be suppressed for internal logical updates, only supply safe, isolated constants.

    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/20.html"
  - id: CI4-ENT-003
    title: "SQL Injection via CodeIgniter Query Builder ->query()"
    description: >
      Direct raw queries using `$db->query($sql)` without query bindings `?`. Even when using the query builder, string concatenation directly into the SQL payload bypasses the framework's escaping rules.
    severity: critical
    confidence: high
    cvss_v3:
      score: 9.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
    category: SQL Injection
    enabled: true
    tags: [sqli, codeigniter4, cwe-89, owasp-a03-2021]
    owasp: "A03:2021"
    cwe: "CWE-89"
    patterns:
      - type: regex
        target: php-files
        pattern: '->query\s*\(\s*["''].*\.\s*(\$request->|\$this->request->|\$_GET|\$_POST)'
    remediation: |
      Use proper query bindings: `$db->query('SELECT * FROM users WHERE status = ?', [$status]);`

    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/89.html"
  - id: CI4-ENT-004
    title: "CSRF Filter Missing Globally"
    description: >
      CodeIgniter 4 handles CSRF via a strict pre-filter. If `csrf_protection` is disabled in `app/Config/Filters.php` globals or the `.env` development overrides logic, the entire application will be vulnerable to state-changing CSRF exploits.
    severity: critical
    confidence: high
    cvss_v3:
      score: 8.8
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:H/A:H"
    category: CSRF
    enabled: true
    tags: [csrf, codeigniter4, cwe-352, owasp-a05-2021]
    owasp: "A05:2021"
    cwe: "CWE-352"
    condition: all
    patterns:
      - type: regex-multiline
        target: config-files
        pattern: '(?s)public\s+\$globals\s*=\s*\[.*?''before''\s*=>\s*\[[^\]]*\]'
      - type: contains
        target: config-files
        pattern: "csrf"
        negative: true
    remediation: |
      Include `csrf` in your `app/Config/Filters.php` global `before` hooks unless utilizing a pure stateless REST API (which should rely on OAuth2/JWT).

    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/352.html"
  - id: CI4-ENT-005
    title: "Insecure Database Connection Configuration"
    description: >
      CodeIgniter 4's `Database::connect()` can accept a custom configuration array.
      If this array is constructed using unvalidated user input, attackers may connect
      the application to a malicious database server, leading to data exfiltration or
      RCE via rogue MySQL servers.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.6
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:N/A:N"
    category: Insecure Configuration
    enabled: true
    tags: [database, ssrf, codeigniter4, cwe-15, owasp-a06-2021]
    owasp: "A06:2021"
    cwe: "CWE-15"
    patterns:
      - type: regex
        target: php-files
        pattern: '\\Config\\Database::connect\s*\(\s*(\$this->request->get|\$_POST)'
    remediation: |
      Never pass user input directly into `Database::connect()`. Use predefined configuration groups from `app/Config/Database.php`.

    references:
      - "https://owasp.org/Top10/A06_2021-Vulnerable_and_Outdated_Components/"
      - "https://cwe.mitre.org/data/definitions/15.html"
  - id: CI4-ENT-007
    title: "Weak Encryption Key in CI4"
    description: >
      `public $key = '';` in `app/Config/Encryption.php` must be set with a strong key (usually a 32-character hexadecimal string). An empty or default key allows decryption of sensitive data stored by the application.
    severity: critical
    confidence: high
    category: Cryptographic Failure
    tags: [crypto, codeigniter4, cwe-326]
    owasp: "A02:2021"
    cwe: "CWE-326"
    patterns:
      - type: regex
        target: config-files
        pattern: 'public\s+\$key\s*=\s*[''"]\s*[''"]'
    remediation: |
      Use the command `php spark key:generate` to create a secure key.

    references:
      - "https://owasp.org/Top10/A02_2021-Cryptographic_Failures/"
      - "https://cwe.mitre.org/data/definitions/326.html"
  - id: CI4-ENT-008
    title: "CORS Wildcard Origin with Credentials Enabled"
    description: >
      CodeIgniter 4 CORS configuration allows wildcard origins while credentials are enabled.
      This combination weakens browser origin isolation for authenticated traffic.
    severity: high
    confidence: high
    cvss_v3:
      score: 8.2
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:H/I:L/A:N"
    category: Security Misconfiguration
    tags: [codeigniter4, cors, owasp-a05-2021, cwe-346, asvs-14.2.5, nist-sc-23]
    owasp: "A05:2021"
    cwe: "CWE-346"
    condition: all
    patterns:
      - type: regex
        target: config-files
        pattern: 'public\s+\$allowedOrigins\s*=\s*\[\s*[''"]\*[''"]\s*\]'
      - type: regex
        target: config-files
        pattern: 'public\s+\$supportsCredentials\s*=\s*true'
    remediation: |
      Restrict allowed origins to trusted domains and disable credentials for wildcards.
      Review CORS policy on every API endpoint.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/346.html"
      - "https://codeigniter.com/user_guide/libraries/cors.html"

  - id: CI4-ENT-009
    title: "Content Security Policy Disabled in App Configuration"
    description: >
      Disabling CSP removes an important browser-side mitigation against XSS and content injection.
    severity: medium
    confidence: high
    cvss_v3:
      score: 6.1
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:H/I:L/A:N"
    category: Missing Security Control
    tags: [codeigniter4, csp, xss, owasp-a03-2021, cwe-16, asvs-14.4.1]
    owasp: "A03:2021"
    cwe: "CWE-16"
    patterns:
      - type: regex
        target: config-files
        pattern: 'public\s+\$contentSecurityPolicy\s*=\s*false'
    remediation: |
      Enable CSP and define strict policies as per the application's needs.
      Start with `default-src 'self'` and then relax it in a controlled manner.
    references:
      - "https://owasp.org/Top10/A03_2021-Injection/"
      - "https://cwe.mitre.org/data/definitions/16.html"
      - "https://codeigniter.com/user_guide/outgoing/csp.html"

  - id: CI4-ENT-010
    title: "Debug Toolbar Enabled"
    description: >
      CodeIgniter 4 Debug Toolbar enabled in non-development environments can expose
      SQL queries, headers, and runtime internals useful for attackers.
    severity: medium
    confidence: high
    cvss_v3:
      score: 5.3
      vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N"
    category: Information Disclosure
    tags: [codeigniter4, debug, disclosure, owasp-a05-2021, cwe-489, nist-si-11]
    owasp: "A05:2021"
    cwe: "CWE-489"
    condition: all
    patterns:
      - type: regex-multiline
        target: config-files
        pattern: '(?s)class\s+Toolbar\b'
      - type: regex
        target: config-files
        pattern: 'public\s+\$enabled\s*=\s*true'
    remediation: |
      Disable the toolbar in production and use a separate observability pipeline.
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://cwe.mitre.org/data/definitions/489.html"
      - "https://codeigniter.com/user_guide/testing/debugging.html"

